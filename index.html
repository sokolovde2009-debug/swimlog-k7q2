<style>
:root{color-scheme:light dark;--bg:#f2f6fa;--card:#fff;--ink:#14202b;--mut:#5b7188;--line:#d6e2ee;--acc:#0b5fa5;--accbg:#e4f0fb;--on:#fff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.meal .mt{font-weight:600}

.meal .kc{font-size:13px;color:var(--mut);white-space:nowrap;text-align:right}
.meal.on .mt{color:var(--ok)}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.alert.ok{background:var(--okbg);color:var(--ok)}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert b{color:inherit}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){text-align:right;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:4px 4px;border-bottom:1px solid var(--line)}

.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--chip)}

.ex .eh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.setrow{display:flex;gap:6px;align-items:center;padding:3px 0;font-size:14px}
.setrow .x{margin-left:auto}

svg.chart{width:100%;height:auto;display:block}
.days{display:flex;gap:6px;align-items:center}
.days .btn{flex:0 0 46px;padding:8px 0}
.days input{flex:1}
.hide{display:none!important}
</style>

function evalWeek(n) {
  const r = {n, avg: weekAvg(n), prev: n > 1 ? weekAvg(n - 1) : null, flags: 0, flagsPrev: 0, signals: [], msgs: []};
  r.delta = (r.avg != null && r.prev != null) ? r.avg - r.prev : null;
  const cnt = k => weekDates(k).reduce((s, x) => s + (((S.days[x] || {}).flag === 'hard') ? 1 : 0), 0);
  r.flags = cnt(n); r.flagsPrev = n > 1 ? cnt(n - 1) : 0;
  const calib = weekStart(n) <= DATA.calibEnd;
  r.calib = calib;
  if (r.flags >= 2 && r.flagsPrev >= 2) r.signals.push('«Тяжелее» два раза в неделю и больше две недели подряд.');
  // сила
  DATA.lifts.forEach(l => { const a = liftBest(l[0], n), b = n > 1 ? liftBest(l[0], n - 1) : null; if (a != null && b != null && a < b * 0.95) r.signals.push('Сила ниже на 5% и больше: ' + l[1] + ' (' + fmt(a) + ' против ' + fmt(b) + ' кг).'); });
  // сон: три ночи подряд меньше 6,5 (последние даты недели)
  const ds = weekDates(n).filter(x => (S.days[x] || {}).sleep != null);
  for (let i = 0; i + 2 < ds.length; i++) { const t = ds.slice(i, i + 3); if (t.every(x => num(S.days[x].sleep) < 6.5) && diffDays(t[2], t[0]) === 2) { r.signals.push('Сон меньше 6,5 часа три ночи подряд.'); break; } }
  // симптомы ЖКТ три дня подряд
  const all = weekDates(n);
  for (let i = 0; i + 2 < all.length; i++) {
    const t = all.slice(i, i + 3);
    if (t.every(x => { const s = (S.days[x] || {}).sym || {}; return s.heart || s.belly; })) { r.signals.push('Изжога или боль в животе три дня подряд.'); break; }
  }
  // быстрое снижение две недели подряд
  if (r.delta != null && r.delta <= -0.6 && n > 2) { const pd = weekAvg(n - 1) != null && weekAvg(n - 2) != null ? weekAvg(n - 1) - weekAvg(n - 2) : null; if (pd != null && pd <= -0.6) r.signals.push('Вес падает быстрее 0,6 кг в неделю две недели подряд.'); }
  // вердикт по весу
  if (r.avg == null) r.msgs.push({t: 'mut', s: 'Мало взвешиваний: нужно 4 в неделю и больше.'});
  else if (r.delta == null) r.msgs.push({t: 'mut', s: 'Нет среднего прошлой недели для сравнения.'});
  else if (calib) r.msgs.push({t: 'mut', s: 'Калибровка: решения по весу с 02.11. Изменение ' + (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг.'});
  else if (r.delta <= -0.6) r.msgs.push({t: 'bad', s: 'Быстрее лимита (' + fmt(r.delta, 2) + ' кг). Добавь блок А в М6 с понедельника по субботу.'});
  else if (r.delta <= -0.1) r.msgs.push({t: 'ok', s: 'По плану: ' + fmt(r.delta, 2) + ' кг за неделю.'});
  else if (r.delta <= 0.5) { const pd = n > 2 && weekAvg(n - 1) != null && weekAvg(n - 2) != null ? weekAvg(n - 1) - weekAvg(n - 2) : null; r.msgs.push(pd != null && pd > -0.1 ? {t: 'warn', s: 'Вес не падает две недели подряд. Сам еду не урезай: пришли данные, пересчитаю расход.'} : {t: 'warn', s: 'Вес почти не меняется (' + (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг). Ещё неделя наблюдения.'}); }
  else r.msgs.push({t: 'warn', s: 'Вес растёт больше 0,5 кг. Проверь условия взвешивания, потом пришли данные.'});
  return r;
}

function chartSvg(dates) {
  const pts = dates.map(d => ({d, w: num((S.days[d] || {}).w), m: movAvg(d)}));
  const ws = pts.map(p => p.w).filter(x => x != null).concat(pts.map(p => p.m).filter(x => x != null));
  if (ws.length < 2) return '<div class="sm mut">График появится, когда будет несколько взвешиваний.</div>';
  const lo = Math.min.apply(null, ws) - 0.3, hi = Math.max.apply(null, ws) + 0.3, W = 320, H = 130, L = 30, R = 6, T = 8, B = 18;
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = w => T + (H - T - B) * (1 - (w - lo) / (hi - lo));
  let dots = '', line = '', first = true;
  pts.forEach((p, i) => { if (p.w != null) dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="2.6" fill="var(--mut)"/>`; if (p.m != null) { line += (first ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(p.m).toFixed(1) + ' '; first = false; } });
  const ticks = [lo + 0.3, (lo + hi) / 2, hi - 0.3].map(t => `<text x="2" y="${(y(t) + 4).toFixed(1)}" font-size="9" fill="var(--mut)">${t.toFixed(1).replace('.', ',')}</text><line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес за 4 недели">${ticks}<path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.2"/>${dots}
  <text x="${L}" y="${H - 4}" font-size="9" fill="var(--mut)">${dshort(dates[0])}</text><text x="${W - R}" y="${H - 4}" font-size="9" text-anchor="end" fill="var(--mut)">${dshort(dates[dates.length - 1])}</text></svg>
  <div class="xs mut">Точки — взвешивания, линия — среднее за 7 дней.</div>`;
}
function summaryText(from, to) {

  lines.push(`ЖУРНАЛ ${from}..${to} (режим питания: ${mode}; версия страницы ${DATA.version})`);

  for (let d = from; d <= to; d = addDays(d, 1)) {
    const x = S.days[d]; if (!x && !(d in S.waist)) continue; const e = x || {};

  }
  const wl = Object.keys(S.waist).filter(k => k >= from && k <= to).sort().map(k => k + '=' + S.waist[k]); if (wl.length) lines.push('Талия: ' + wl.join('; '));
  const n = weekNo(to), r = evalWeek(n);

  if (r.signals.length) lines.push('Стоп-сигналы: ' + r.signals.join(' '));
  const g = DATA.lifts.map(l => `${l[1]}: ${fmt(liftBest(l[0], n))}/${fmt(n > 1 ? liftBest(l[0], n - 1) : null)}`).join('; '); lines.push('Зал, лучший расчётный максимум (эта/прошлая неделя): ' + g);
  const sets = S.gym.filter(x => x.date >= from && x.date <= to); if (sets.length) lines.push('Подходы: ' + sets.sort((a, b) => a.date < b.date ? -1 : 1).map(x => `${x.date} ${x.ex} ${x.w}x${x.reps}${x.rpe != null ? '@' + x.rpe : ''}`).join('; '));
  const st = S.starts.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(s => `${s.date} ${s.dist} м ${s.pool} м ${secStr(s.time)}${s.note ? ' (' + s.note + ')' : ''}`); if (st.length) lines.push('Старты: ' + st.join('; '));
  const ts = S.tests.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(t => `${t.date} ${t.name}: ${t.val}`); if (ts.length) lines.push('Тесты: ' + ts.join('; '));
  return lines.join('\n');
}
function viewWeek(v) {
  const n = Math.max(1, weekNo(curDate)); const r = evalWeek(n);
  const dates = []; for (let i = 27; i >= 0; i--) dates.push(addDays(curDate, -i));
  const rows = []; for (let k = n; k >= Math.max(1, n - 5); k--) { const a = weekAvg(k), b = k > 1 ? weekAvg(k - 1) : null; const wd = weekDates(k); const kc = wd.reduce((s, x) => s + (hasData(S.days[x]) ? 1 : 0), 0);
    const ticks = wd.map(x => { const p = plannedKcal(x), t = tickedKcal(x); return (S.days[x] && S.days[x].meals) ? t / p : null; }).filter(x => x != null);
    rows.push(`<tr><td>${k} <span class="xs mut">${dshort(weekStart(k))}</span></td><td class="n">${a != null ? fmt(a, 2) : '—'}</td><td class="n">${a != null && b != null ? (a - b > 0 ? '+' : '') + fmt(a - b, 2) : '—'}</td><td class="n">${wd.reduce((s, x) => s + (((S.days[x] || {}).flag === 'hard') ? 1 : 0), 0)}</td><td class="n">${ticks.length ? Math.round(mean(ticks) * 100) + '%' : '—'}</td></tr>`); }
  const waist = Object.keys(S.waist).sort().slice(-6).map(k => `<tr><td>${esc(dshort(k))}</td><td class="n">${fmt(S.waist[k])} см</td></tr>`).join('');
  const sleepAvg = mean(weekDates(n).map(x => num((S.days[x] || {}).sleep)).filter(x => x != null)), fatAvg = mean(weekDates(n).map(x => (S.days[x] || {}).fat).filter(x => x != null));
  const symCnt = weekDates(n).reduce((s, x) => s + Object.keys((S.days[x] || {}).sym || {}).filter(k => S.days[x].sym[k]).length, 0);
  v.innerHTML = `
  <div class="days"><button class="btn sec" data-act="day" data-n="-7">‹</button><input type="date" id="dt" value="${curDate}"><button class="btn sec" data-act="day" data-n="7">›</button></div>
  <div class="card" style="margin-top:8px"><h2>Неделя ${n} · ${esc(dshort(weekStart(n)))}–${esc(dshort(addDays(weekStart(n), 6)))}</h2>
    ${r.msgs.map(m => `<div class="alert ${m.t === 'mut' ? '' : m.t}" ${m.t === 'mut' ? 'style="background:var(--chip)"' : ''}>${esc(m.s)}</div>`).join('')}
    ${r.signals.length ? `<div class="alert bad"><b>Стоп-сигналы.</b> ${r.signals.map(esc).join(' ')} Ешь меню на поддержание (то же меню + блок А в М6) не меньше 2 недель и напиши мне.</div>` : `<div class="alert ok">Стоп-сигналов нет.</div>`}
    <div class="kv"><span>Среднее за неделю</span><span>${fmt(r.avg, 2)} кг</span><span>Прошлая неделя</span><span>${fmt(r.prev, 2)} кг</span><span>Изменение</span><span>${r.delta != null ? (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг' : '—'}</span>
    <span>«Тяжелее» за неделю</span><span>${r.flags} (прошлая ${r.flagsPrev})</span><span>Сон, среднее</span><span>${sleepAvg != null ? fmt(sleepAvg) + ' ч' : '—'}</span><span>Усталость, среднее</span><span>${fatAvg != null ? fmt(fatAvg) : '—'}</span><span>Отметок самочувствия</span><span>${symCnt}</span></div></div>
  <div class="card"><h2>Вес за 4 недели</h2>${chartSvg(dates)}</div>
  <div class="card"><h2>Последние недели</h2><table><tr><th>Нед.</th><th class="n">Среднее, кг</th><th class="n">Δ</th><th class="n">Тяжелее</th><th class="n">Меню</th></tr>${rows.join('')}</table></div>
  <div class="card"><h2>Талия по пупку</h2>${waist ? `<table>${waist}</table>` : '<div class="sm mut">Ещё нет записей.</div>'}</div>
  <div class="card"><h2>Отправить мне</h2><div class="sm mut">Скопируй сводку за 14 дней и вставь в чат с Claude.</div>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="copy14">Скопировать сводку</button><button class="btn sec" data-act="copyjson">Все данные (JSON)</button></div></div>`;
}

/* ---------------- вкладка «Тесты» ---------------- */
function normPct(dist, pool, t) { const n = (DATA.norms[dist] || {})[pool]; return n ? (t / n - 1) * 100 : null; }
function checkpoint() {
  const w = DATA.window; const res = S.starts.filter(s => s.date >= w[0] && s.date <= w[1]);
  const ok = [];
  res.forEach(s => { const key = s.dist + '_' + s.pool, th = DATA.thresholds[key]; if (th != null && s.time <= th) ok.push(s); });
  return {res, ok};
}
function bestLine(res) {
  const parts = [];
  [800, 400].forEach(dist => [50, 25].forEach(pool => {
    const t = res.filter(s => s.dist === dist && s.pool === pool).map(s => s.time);
    if (t.length) parts.push(dist + ' м (' + pool + ' м): ' + secStr(Math.min.apply(null, t)));
  }));
  return parts.length ? ' Лучшее в окне: ' + parts.join('; ') + '.' : '';
}
function critSpeed() {
  const out = [];
  [25, 50].forEach(p => { const a = S.starts.filter(s => s.pool === p && s.dist === 200), b = S.starts.filter(s => s.pool === p && s.dist === 400);
    a.forEach(x => b.forEach(y => { if (Math.abs(diffDays(x.date, y.date)) <= 21 && y.time > x.time) { const cs = 200 / (y.time - x.time); out.push({pool: p, cs, pace: 100 / cs, dprime: 200 - cs * x.time, date: y.date}); } })); });
  return out;
}
function viewTests(v) {
  const cp = checkpoint(), st = S.starts.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const pbs = DATA.pb.map(p => `<tr><td>${p.dist} м · ${p.pool} м</td><td class="n">${secStr(p.t)}</td><td class="n xs mut">${esc(p.note || '')}</td></tr>`).join('');
  const startRows = st.map(s => { const pc = normPct(s.dist, s.pool, s.time); return `<tr><td>${esc(dshort(s.date))}</td><td>${s.dist} м · ${s.pool} м</td><td class="n"><b>${secStr(s.time)}</b></td><td class="n">${pc != null ? (pc > 0 ? '+' : '') + fmt(pc) + '%' : '—'}</td><td class="n"><button class="btn sec sm" data-act="delstart" data-id="${s.id}">✕</button></td></tr>`; }).join('');
  const cs = critSpeed();
  const names = DATA.tests.map(t => t[0]).filter(x => !/^800 и 400/.test(x) && x !== 'Вес тела' && x !== 'Талия по пупку');
  const tr = S.tests.slice().sort((a, b) => a.date < b.date ? 1 : -1).map(t => `<tr><td>${esc(dshort(t.date))}</td><td>${esc(t.name)}</td><td class="n"><b>${esc(t.val)}</b></td><td class="n"><button class="btn sec sm" data-act="deltest" data-id="${t.id}">✕</button></td></tr>`).join('');
  const meets = DATA.meets.map(m => `<tr><td class="xs"><b>${esc(m[0])}</b></td><td class="xs">${esc(m[1])}<br><span class="mut">${esc(m[2])}</span></td></tr>`).join('');
  v.innerHTML = `
  <div class="card"><h2>Контрольная точка</h2>
    <div class="sm mut">Окно ${esc(dshort(DATA.window[0]))}–${esc(dshort(DATA.window[1]))}: 800 м ≤ ${secStr(DATA.thresholds['800_50'])} (50 м) или ≤ ${secStr(DATA.thresholds['800_25'])} (25 м), либо 400 м ≤ ${secStr(DATA.thresholds['400_50'])} (50 м).</div>
    ${cp.ok.length ? `<div class="alert ok"><b>Выполнена:</b> ${cp.ok.map(s => s.dist + ' м ' + secStr(s.time) + ' (' + dshort(s.date) + ')').join('; ')}. Весна 2027 остаётся.</div>`
      : cp.res.length ? `<div class="alert warn">Результаты в окне есть, порога нет.${bestLine(cp.res)}</div>`
      : `<div class="alert" style="background:var(--chip)">Официальных 400 и 800 м в окне пока нет.</div>`}</div>
  <div class="card"><h2>Добавить результат старта</h2>
    <div class="row"><div><label class="f">Дата</label><input type="date" id="sd" value="${today()}"></div>
    <div><label class="f">Бассейн</label><select id="sp"><option value="50">50 м</option><option value="25">25 м</option></select></div>
    <div><label class="f">Дистанция</label><select id="sdist">${[800, 400, 200, 100, 50, 1500].map(d => `<option value="${d}">${d} м</option>`).join('')}</select></div></div>
    <div class="row" style="margin-top:6px"><div><label class="f">Время (м:сс,сс)</label><input type="text" id="stime" inputmode="decimal" placeholder="8:45,09" autocomplete="off"></div>
    <div><label class="f">Старт, заметка</label><input type="text" id="snote" placeholder="школа, 25 м" autocomplete="off"></div>
    <div style="flex:0 0 auto"><label class="f">&nbsp;</label><button class="btn" data-act="addstart">Добавить</button></div></div></div>
  <div class="card"><h2>Старты</h2>${startRows ? `<table><tr><th>Дата</th><th>Дист.</th><th class="n">Время</th><th class="n">К норме МС</th><th></th></tr>${startRows}</table>` : '<div class="sm mut">Результатов пока нет.</div>'}
    ${cs.length ? `<h3>Критическая скорость</h3>${cs.map(c => `<div class="sm">${c.pool} м: CS ${fmt(c.cs, 2)} м/с (${secStr(c.pace)} на 100 м), D′ ${fmt(c.dprime, 0)} м</div>`).join('')}` : '<div class="xs mut" style="margin-top:6px">Критическая скорость считается, когда есть 200 и 400 м одного бассейна в пределах 3 недель.</div>'}</div>
  <div class="card"><h2>Рекорды (с твоих слов)</h2><table>${pbs}</table></div>
  <div class="card"><h2>Тесты зала и прыжки</h2>
    <label class="f">Тест</label><select id="tn">${names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <div class="row" style="margin-top:6px"><div><label class="f">Результат</label><input type="text" id="tv" placeholder="например 65 кг или 15" autocomplete="off"></div>
    <div style="flex:0 0 auto"><label class="f">&nbsp;</label><button class="btn" data-act="addtest">Добавить</button></div></div>
    ${tr ? `<table style="margin-top:8px"><tr><th>Дата</th><th>Тест</th><th class="n">Результат</th><th></th></tr>${tr}</table>` : ''}</div>
  <div class="card"><h2>Возможные контрольные старты</h2><table>${meets}</table>
    <div class="xs mut" style="margin-top:6px">Платные старты ты не планируешь. Старты школы — заявка твоя, когда опубликуют программу.</div></div>`;
}

/* ---------------- вкладка «Данные» ---------------- */
function viewData(v) {
  const days = Object.keys(S.days).filter(k => hasData(S.days[k])).length;
  v.innerHTML = `
  <div class="card"><h2>Режим питания</h2>
    <div class="chips"><button class="chip ${S.settings.mode === 'deficit' ? 'on' : ''}" data-act="mode" data-v="deficit">Дефицит</button><button class="chip ${S.settings.mode === 'maint' ? 'on' : ''}" data-act="mode" data-v="maint">Поддержание (+ блок А в М6)</button></div>
    <div class="xs mut" style="margin-top:6px">Поддержание включай при стоп-сигнале или когда вес падает слишком быстро.</div></div>
  <div class="card"><h2>Вес тела для подтягиваний</h2><div class="row"><input type="text" inputmode="decimal" id="bw" value="${esc(String(S.settings.bw).replace('.', ','))}"><div class="xs mut">Если есть среднее за 7 дней, берётся оно (${fmt(curBW())} кг).</div></div></div>
  <div class="card"><h2>Отправить данные</h2>
    <div class="row"><button class="btn" data-act="copy14">Сводка за 14 дней</button><button class="btn sec" data-act="copyjson">Все данные (JSON)</button></div>
    <div class="sm mut" style="margin-top:8px">Раз в неделю копируй сводку и вставляй в чат с Claude. JSON нужен как резервная копия: сохрани его в «Избранное» в Telegram.</div></div>
  <div class="card"><h2>Восстановить из копии</h2><textarea id="imp" placeholder="Вставь сюда JSON"></textarea><div class="row" style="margin-top:8px"><button class="btn sec" data-act="import">Загрузить</button></div></div>
  <div class="card"><h2>Установка на iPhone</h2><div class="sm">Открой страницу в Safari → кнопка «Поделиться» → «На экран „Домой“». Дальше открывай с иконки: так данные не стираются при долгом простое.</div></div>
  <div class="card"><h2>О странице</h2><div class="kv"><span>Версия</span><span>${esc(DATA.version)}</span><span>Дней с записями</span><span>${days}</span><span>Подходов в зале</span><span>${S.gym.length}</span><span>Хранение</span><span>${memOnly ? 'нет доступа' : 'в этом телефоне'}</span></div>
    <div class="xs mut" style="margin-top:6px">Данные хранятся только в браузере этого телефона. Сайт данных не собирает. Это не медицинская консультация.</div></div>
  <div class="card"><h2>Сброс</h2><div class="row"><button class="btn danger" data-act="wipe">Стереть все данные</button></div></div>`;
}

/* ---------------- действия ---------------- */
function copyText(txt, ok) {
  const done = () => toast(ok || 'Скопировано');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Не удалось скопировать'); } document.body.removeChild(ta); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]'); if (tb) { go(tb.dataset.tab); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, d = D(curDate);
  switch (act) {
    case 'day': curDate = addDays(curDate, parseInt(el.dataset.n, 10)); render(); break;
    case 'todaybtn': curDate = today(); render(); break;
    case 'rest': d.rest = !d.rest; if (!d.rest) delete d.rest; if (!hasData(d) && !d.rest) delete S.days[curDate]; save(); render(); break;
    case 'meal': d.meals = d.meals || {}; if (d.meals[el.dataset.id]) delete d.meals[el.dataset.id]; else d.meals[el.dataset.id] = true; save(); render(); break;
    case 'fat': d.fat = d.fat === parseInt(el.dataset.v, 10) ? null : parseInt(el.dataset.v, 10); if (d.fat == null) delete d.fat; save(); render(); break;
    case 'flag': d.flag = d.flag === el.dataset.v ? null : el.dataset.v; if (d.flag == null) delete d.flag; save(); render(); break;
    case 'sym': d.sym = d.sym || {}; if (d.sym[el.dataset.v]) delete d.sym[el.dataset.v]; else d.sym[el.dataset.v] = true; save(); render(); break;
    case 'sess': S.ui.gymSession = el.dataset.v; S.ui.gymDate = curDate; save(); render(); break;
    case 'addset': {
      const card = el.closest('.ex'), w = num($('.gw', card).value), reps = parseInt($('.gr', card).value, 10), rpe = num($('.gp', card).value);
      if (w == null || !(reps > 0)) { toast('Укажи вес и повторы'); break; }
      S.gym.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date: curDate, ex: el.dataset.ex, w, reps, rpe});
      save(); render(); toast('Подход записан'); break;
    }
    case 'delset': S.gym = S.gym.filter(g => g.id !== el.dataset.id); save(); render(); break;
    case 'done': d.done = d.done || {}; if (d.done[el.dataset.ex]) delete d.done[el.dataset.ex]; else d.done[el.dataset.ex] = true; save(); render(); break;
    case 'addstart': {
      const t = parseTime($('#stime').value), date = $('#sd').value;
      if (t == null || !date) { toast('Укажи дату и время'); break; }
      S.starts.push({id: Date.now().toString(36), date, pool: parseInt($('#sp').value, 10), dist: parseInt($('#sdist').value, 10), time: t, note: $('#snote').value.trim()});
      save(); render(); toast('Результат добавлен'); break;
    }
    case 'delstart': S.starts = S.starts.filter(s => s.id !== el.dataset.id); save(); render(); break;
    case 'addtest': { const val = $('#tv').value.trim(); if (!val) { toast('Укажи результат'); break; } S.tests.push({id: Date.now().toString(36), date: today(), name: $('#tn').value, val}); save(); render(); toast('Тест записан'); break; }
    case 'deltest': S.tests = S.tests.filter(t => t.id !== el.dataset.id); save(); render(); break;
    case 'mode': S.settings.mode = el.dataset.v; save(); render(); break;
    case 'copy14': { const to = today(); copyText(summaryText(addDays(to, -13), to), 'Сводка скопирована'); break; }
    case 'copyjson': copyText(JSON.stringify(S), 'Данные скопированы'); break;
    case 'import': {
      const raw = $('#imp').value.trim(); if (!raw) { toast('Вставь JSON'); break; }
      try { const o = JSON.parse(raw); if (!o || typeof o !== 'object' || !o.days) throw 0; S = Object.assign(fresh(), o); save(); render(); toast('Данные загружены'); } catch (e) { toast('Это не похоже на копию данных'); }
      break;
    }
    case 'wipe': if (confirm('Стереть все данные на этом телефоне? Это нельзя отменить.')) { if (confirm('Точно стереть всё?')) { S = fresh(); save(); render(); toast('Данные стёрты'); } } break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target, d = D(curDate);
  if (t.id === 'w') {
    const x = num(t.value); if (x == null) delete d.w; else d.w = x; save();
    const ma = movAvg(curDate), el = $('#ma'); if (el) el.textContent = ma != null ? fmt(ma) + ' кг' : 'пока мало данных';
  }
  else if (t.id === 'sleep') { const x = num(t.value); if (x == null) delete d.sleep; else d.sleep = x; save(); }
  else if (t.id === 'waist') { const x = num(t.value); if (x == null) delete S.waist[curDate]; else S.waist[curDate] = x; save(); }
  else if (t.id === 'off') { d.off = t.value; if (!t.value) delete d.off; save(); }
  else if (t.id === 'note') { d.note = t.value; if (!t.value) delete d.note; save(); }
  else if (t.id === 'bw') { const x = num(t.value); if (x != null) { S.settings.bw = x; save(); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'dt' && t.value) { curDate = t.value; render(); }
});
/* ---------------- запуск ---------------- */
persistReq();
render();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>

с", 100, 270], ["pollock", "минтай", 180, 140], ["veg", "рагу", 150, 150]], "oil": 10, "bread": 0}, {"label": "Сб ужин", "day": "Сб", "kind": "ужин", "time": "19:00", "store": "F", "age": 5.8, "thaw": "", "parts": [["pasta", "макароны", 100, 230], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 10, "bread": 0}, {"label": "Вс обед", "day": "Вс", "kind": "обед", "time": "12:30", "store": "F", "age": 23.2, "thaw": "", "parts": [["rice", "рис", 100, 270], ["pollock", "минтай", 180, 140], ["veg", "рагу", 150, 150]], "oil": 10, "bread": 0}, {"label": "Вс ужин", "day": "Вс", "kind": "ужин", "time": "19:00", "store": "Z", "age": 29.8, "thaw": "Вс утром", "parts": [["pasta", "макароны", 100, 230], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 10, "bread": 0}, {"label": "Пн обед", "day": "Пн", "kind": "обед", "time": "12:30", "store": "Z", "age": 47.2, "thaw": "Вс вечером", "parts": [["buckwheat", "гречка", 110, 275], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 60}, {"label": "Пн ужин", "day": "Пн", "kind": "ужин", "time": "19:15", "store": "Z", "age": 54.0, "thaw": "Пн утром", "parts": [["pasta", "макароны", 200, 460], ["potato", "картофель", 100, 85], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 0}, {"label": "Вт обед", "day": "Вт", "kind": "обед", "time": "12:30", "store": "Z", "age": 71.2, "thaw": "Пн вечером", "parts": [["buckwheat", "гречка", 110, 275], ["potato", "картофель", 150, 130], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 60}], "totals": [["rice", "рис", 200, 540], ["buckwheat", "гречка", 220, 550], ["pasta", "макароны", 400, 920], ["potato", "картофель", 250, 210], ["chicken", "курица", 650, 470], ["pollock", "минтай", 360, 280], ["veg", "рагу", 1050, 1050]], "timeline": [[0, "Старт", "Духовка 200 °C (верх и низ; с конвекцией 180 °C). Минтай в закрытом пакете в миску с холодной водой на 40–60 минут, воду меняй раз в 15 минут. Взвесь продукты. Для сырой курицы отдельная доска.", []], [5, "Маринад", "Смешай маринад, курицу обсуши и выложи в него. Руки с мылом.", ["chicken"]], [10, "Рис", "Промой, в чашу мультиварки с водой и солью, программа «Рис». Дальше не трогай.", ["rice"]], [15, "Рагу, часть 1", "Лук, морковь, томатная паста, паприка, лавр, вода. Крышка, средний огонь, 10–12 минут.", ["veg"]], [25, "Духовка: курица и картофель", "Курица на противне с пергаментом в духовку на 25–30 минут. Рядом на втором противне картофель дольками: 30–35 минут, на 15-й минуте переверни.", ["potato"]], [30, "Рагу, часть 2", "Добавь кабачок и цветную капусту, посоли, крышка, 15–20 минут.", []], [35, "Гречка", "Вода, крупа, соль, кипение без крышки; потом крышка, минимальный огонь, 15–18 минут.", ["buckwheat"]], [45, "Соусы", "Кефирный соус (5 минут, без плиты) и томатный (ковшик, 6–8 минут). Разложи в банки.", ["sauce_k", "sauce_t"]], [50, "Духовка: рыба", "Курицу достань, проверь готовность. Рыбу заверни в конверты и поставь на её место: 200 °C, 15–18 минут. Картофель, если ещё не готов, остаётся.", ["fish"]], [55, "Рис готов", "Выложи рис из чаши на противень тонким слоем, «подогрев» выключи. Рагу сними с огня, лавр выбрось, добавь укроп.", []], [60, "Макароны", "Вода с солью, на 1 минуту меньше времени на пачке, холодная вода, на противень.", ["pasta"]], [70, "Свежая порция", "Рыбу достань и собери порцию «Сб обед» на тарелку: рис ≈ 270 г, минтай ≈ 140 г, рагу 150 г, масло 10 г, соус. Ешь горячим.", []], [80, "Взвесь и раздели", "Взвесь каждый готовый компонент целиком (рис, гречка, макароны, курица, рыба без сока, рагу, картофель). Расфасуй по контейнерам (внизу этого экрана и в «Контейнеры»), подписав каждый.", []], [95, "Охлаждение", "Контейнеры без крышек поставь в таз с холодной водой на 10–15 минут, пока не станут тёплыми. Горячим в морозилку не ставь.", []], [105, "Холодильник, морозилка, уборка", "Закрой крышками. «Холодильник» в холодильник, «морозилка» в морозилку, баночки с соусами в холодильник. Всё готовое убрано не позже 60 минут после того, как рис вышел из мультиварки. Потом посуда.", []]], "recipeSeq": [["chicken", 5], ["rice", 10], ["veg", 15], ["potato", 25], ["buckwheat", 35], ["sauce_k", 45], ["sauce_t", 45], ["fish", 50], ["pasta", 60]], "daily": ["omelet_rest", "omelet", "oats"], "recipes": [{"id": "chicken", "title": "Курица, запечённая в кефирном маринаде", "sub": "650 г сырого филе бедра → ≈ 470 г готового, 5 порций по 130 г сырого", "items": ["куриное филе бедра (без кожи и кости) 650 г", "кефир 100 мл", "чеснок 2 зубчика", "паприка сладкая молотая 1½ ч. л.", "орегано или итальянские травы 1 ч. л.", "соль 1 ч. л. (≈ 6 г)", "чёрный перец молотый ¼ ч. л. (по желанию)"], "steps": ["Достань курицу из холодильника, обсуши бумажным полотенцем, срежь лишний жир и плёнки.", "В миске смешай кефир, чеснок (раздави или потри на мелкой тёрке), паприку, травы, соль и перец. Выложи курицу, перемешай руками, закрой. Маринад работает от 30 минут; если мариновал с вечера в холодильнике, мясо мягче.", "Противень застели пергаментом. Куски выложи на расстоянии 1–2 см, избыток маринада стряхни.", "Духовка 200 °C (верх и низ), середина. 25–30 минут. Готово, когда в самом толстом куске не меньше 74 °C (бедро мягче при 80 °C) или на разрезе нет розового и сок прозрачный.", "Дай постоять 5 минут. Не мой сырую курицу под краном: брызги разносят бактерии. После неё мой руки, доску и нож с мылом."], "notes": ["Бедро с кефирным маринадом остаётся сочным и после разогрева. Грудка в плане не используется."]}, {"id": "fish", "title": "Минтай в фольге с лимоном и укропом", "sub": "360 г сырого филе → ≈ 280 г готового, 2 конверта по 180 г", "items": ["минтай, филе 360 г (разморозь)", "лимон 2 шт: 4 тонких кружка и сок остального", "укроп 2 веточки", "лук репчатый 30 г кольцами", "соль ½ ч. л.", "фольга"], "steps": ["Разморозка: в холодильнике с вечера или в закрытом пакете в миске с холодной водой 40–60 минут (воду меняй каждые 15 минут). Не размораживай в тёплой воде и на столе.", "Филе обсуши. На лист фольги 30×30 см положи кольца лука, на них 180 г рыбы, посоли, сверху лимон и укроп.", "Заверни конвертом, швы наверх, чтобы сок не вытек.", "200 °C, 15–18 минут. Готово, когда мякоть белая, непрозрачная и расслаивается вилкой.", "Рыбу выложи вместе с соком из фольги (1–2 ст. л.): сок удерживает влагу при разогреве."], "notes": ["Минтай постный (0,9% жира): жир приходит из масла и соуса при разогреве. Рыба в плане стоит в первые сутки после готовки, дальше курица."]}, {"id": "rice", "title": "Рис в мультиварке", "sub": "200 г сухого → ≈ 540 г готового", "items": ["рис длиннозёрный шлифованный (не пропаренный, не круглый) 200 г", "вода 360 мл (1 г риса : 1,8 мл воды)", "соль ¾ ч. л."], "steps": ["Промой рис в сите холодной водой 4–5 раз, пока вода почти не станет прозрачной.", "В чашу: рис, вода, соль. Размешай, выровняй.", "Программа «Рис» или «Крупа» (обычно 30–40 минут). Нет такой — «Плов» или «Каша». Крышку не открывай.", "После сигнала подожди 5–10 минут, затем сразу выложи рис из чаши на противень или широкое блюдо тонким слоем. Отключи «подогрев»: рис нельзя оставлять в мультиварке остывать.", "Остынет за 15–20 минут. Взвесь весь готовый рис."], "notes": ["Первая партия калибрует воду: рис твёрдый — в следующий раз воды на 10% больше; каша — на 10% меньше. Если чаша 3 л не вмещает всю порцию (выше отметки «рис»), вари в два захода.", "FSA: варёный рис остужать до часа, в холодильнике не дольше суток, греть один раз до пара."]}, {"id": "buckwheat", "title": "Гречка рассыпчатая", "sub": "220 г сухой → ≈ 550 г готовой", "items": ["гречка ядрица 220 г", "вода 550 мл (на 100 г крупы 250 мл)", "соль ½ ч. л."], "steps": ["Пересыпь гречку на тарелку, убери тёмные зёрна и шелуху. Промой в сите.", "В кастрюлю с толстым дном: крупа, холодная вода, соль. Доведи до кипения без крышки.", "Накрой крышкой, минимальный огонь, 15–18 минут, не мешай и не открывай.", "Вся вода впиталась — выключи, накрой полотенцем на 10 минут. Потом выложи на противень тонким слоем остывать."], "notes": ["Вода осталась, а крупа готова — слей. Вода выкипела, а крупа жёсткая — добавь 50 мл кипятка и держи под крышкой 5 минут."]}, {"id": "pasta", "title": "Макароны (al dente)", "sub": "400 г сухих → ≈ 920 г готовых", "items": ["макароны из твёрдой пшеницы 400 г", "вода 4 л (1 л на 100 г)", "соль 4 ч. л. (1 ч. л. на литр)"], "steps": ["Кастрюля от 4 л (на 200 г хватит 2 л); если меньше, вари в два захода.", "Воду посоли, доведи до кипения, засыпь макароны, размешай.", "Вари на 1 минуту меньше, чем написано на пачке: при разогреве доварятся.", "Слей в дуршлаг, ополосни холодной водой 30 секунд, чтобы остановить варку и охладить. Стряхни воду, выложи на противень тонким слоем."], "notes": ["Масло в макароны не добавляй: оно уже в плане и кладётся в контейнер при сборке."]}, {"id": "potato", "title": "Картофель, запечённый дольками", "sub": "250 г сырого → ≈ 210 г готового", "items": ["картофель 250 г", "соль и паприка сладкая по вкусу"], "steps": ["Картофель вымой щёткой. Нарежь дольками толщиной 2 см вместе с кожурой, обсуши полотенцем.", "Противень застели пергаментом. Выложи дольки в один слой, посоли, посыпь паприкой.", "200 °C, 30–35 минут, на 15-й минуте переверни. Готово, когда мягко внутри и подрумянено по краям."], "notes": ["До 500 г — запеки (вкуснее), больше — отвари (не занимает духовку)."]}, {"id": "veg", "title": "Овощное рагу", "sub": "≈ 1050 г готового (по 150 г в контейнер); сырых овощей нужно больше, потому что они уваривают", "items": ["морковь 400 г", "кабачок 500 г", "цветная капуста замороженная 400 г", "лук репчатый 100 г", "томатная паста 30 г", "паприка сладкая 1 ч. л.", "лавровый лист 2 шт", "соль 1 ч. л.", "вода 120 мл", "укроп 10 г"], "steps": ["Нарежь: лук мелко, морковь кружками 0,5 см, кабачок кубиками 2 см. Цветную капусту не размораживай, раздели на соцветия.", "В широкую кастрюлю с толстым дном: лук, морковь, томатная паста, паприка, лавровый лист, вода. Крышка, средний огонь, 10–12 минут.", "Добавь кабачок и цветную капусту, посоли, перемешай. Крышка, 15–20 минут, один раз перемешай.", "Последние 3–5 минут без крышки, чтобы выкипела лишняя вода. Лавровый лист выбрось, добавь укроп.", "Остуди на противне или в широкой миске. Взвесь: должно получиться ≈ 1050 г"], "notes": ["Масла в рагу нет: оно в плане отдельно (по 10–15 г на контейнер)."]}, {"id": "omelet_rest", "title": "Омлет с беконом и сыром (М1 в дни отдыха)", "sub": "4 яйца, бекон 30 г, сыр 20 г, хлеб 80 г; 10 минут", "items": ["яйца 4 шт (200 г)", "бекон 30 г", "сыр 20 г", "хлеб 80 г (3 ломтика)", "соль щепотка"], "steps": ["Бекон нарежь полосками 1 см, выложи на холодную антипригарную сковороду, средний огонь, 2–3 минуты, пока не вытопится жир. Масла не добавляй.", "Яйца взбей вилкой с солью. Влей на сковороду на беконе, огонь слабый.", "Через 2 минуты посыпь тёртым сыром, накрой крышкой на 3–4 минуты, пока не схватится. Подавай с хлебом."], "notes": ["При изжоге бекон убери (в плане он раз в неделю)."]}, {"id": "omelet", "title": "Омлет (М1 в понедельник и среду)", "sub": "3 яйца, молоко 50 мл; 7 минут", "items": ["яйца 3 шт (150 г)", "молоко 2,5% 50 мл", "соль щепотка", "по желанию зелень"], "steps": ["Взбей яйца с молоком и солью вилкой.", "Антипригарная сковорода с крышкой, огонь слабый, без масла. Влей смесь, накрой крышкой на 5–6 минут, пока верх не схватится.", "Ешь с хлебом 100 г и бананом (по плану)."], "notes": ["Единственное, что готовится утром. Всё остальное из контейнеров."]}, {"id": "oats", "title": "Овсянка в банке (М1 во вторник, четверг, пятницу, субботу)", "sub": "вечером накануне, 2 минуты", "items": ["овсяные хлопья 100 г (обычные, не быстрого приготовления)", "молоко 2,5% 200 мл", "щепотка соли, корица по желанию", "утром: банан 120 г, мёд 15 г"], "steps": ["Вечером в банку или контейнер 0,5 л: хлопья, молоко, соль. Размешай, закрой, убери в холодильник.", "Утром разогрей 1 минуту в микроволновке (или ешь холодной). Добавь нарезанный банан и мёд."], "notes": ["Хранится в холодильнике до утра следующего дня; на несколько дней вперёд не готовь."]}, {"id": "sauce_k", "title": "Соус кефирно-чесночный (кислый, свежий)", "sub": "≈ 250 г, 6–7 порций по 40 г; в холодильнике 3 дня", "items": ["кефир 1% 220 мл", "чеснок 2 зубчика", "укроп 20 г", "лимонный сок 2 ч. л.", "соль ¼ ч. л.", "чёрный перец (по желанию)"], "steps": ["Чеснок раздави, укроп мелко нарежь. Смешай всё с кефиром, посоли.", "Переложи в банку, убери в холодильник. Клади 1–2 ст. л. на контейнер после разогрева."], "notes": ["≈ 10 ккал на порцию; в плане калории соусов не учтены (это в пределах точности расчёта)."]}, {"id": "sauce_t", "title": "Соус томатно-паприковый (кисло-острый)", "sub": "≈ 170 г, 6–7 порций по 25–30 г; в холодильнике 4 дня", "items": ["томатная паста 60 г", "вода 150 мл", "паприка сладкая 1 ч. л.", "чеснок 1 зубчик", "мёд 1 ч. л.", "лимонный сок или уксус 9% 1 ч. л.", "перец чили хлопья ¼ ч. л. (для острого, по желанию)", "соль ¼ ч. л."], "steps": ["В ковшик: паста, вода, паприка, чеснок (раздави), мёд, соль, чили. Размешай до однородности.", "Доведи до кипения, на слабом огне 6–8 минут под неплотной крышкой, пока не загустеет.", "Добавь лимонный сок, остуди, перелей в банку. Клади 1–2 ст. л. на рыбу, рис, картофель."], "notes": ["≈ 10 ккал на порцию, не учтено. Остроту регулируй чили: без чили соус просто кисло-сладкий."]}]}, "B": {"key": "B", "kind": "B", "date": null, "label": "Вторник", "start": "17:30", "end": "19:00", "prep": ["Продукты куплены (вкладка «Покупки»)", "Минтай переложен из морозилки в холодильник в понедельник вечером", "Духовка, 2 противня, пергамент, фольга", "Мультиварка 3 л; кастрюли: 4 л и больше (макароны), 2 л (гречка), широкая с крышкой 3–4 л (рагу); ковшик для соуса", "Весы, сито, дуршлаг, миска для маринада, тёрка", "6 контейнеров от 0,8 л (для больших порций 1 л), 2 банки для соусов, скотч и маркер для подписей"], "containers": [{"label": "Вт ужин", "day": "Вт", "kind": "ужин", "time": "19:15", "store": "fresh", " стань из холодильника (разморожен с вечера понедельника). Взвесь продукты. Для сырой курицы отдельная доска.", []], [5, "Маринад", "Смешай маринад, курицу обсуши и выложи в него. Руки с мылом.", ["chicken"]], [10, "Рис", "Промой, в чашу мультиварки с водой и солью, программа «Рис». Если столько не помещается в чашу (выше отметки «рис»), вари в два захода или часть в кастрюле.", ["rice"]], [12, "Картофель: чистка", "Вымой, очисти, нарежь кусками 3–4 см, залей в кастрюле холодной водой, посоли. Пока не включай.", ["potato"]], [15, "Рагу, часть 1", "Лук, морковь, томатная паста, паприка, лавр, вода. Крышка, средний огонь, 10–12 минут.", ["veg"]], [20, "Духовка: курица", "Курица на противне с пергаментом в духовку на 25–30 минут.", []], [25, "Картофель варится", "Включи огонь под картофелем: после закипания 15–18 минут.", []], [30, "Рагу, часть 2", "Добавь кабачок и цветную капусту, посоли, крышка, 15–20 минут.", []], [35, "Гречка", "Вода, крупа, соль, кипение без крышки; потом крышка, минимальный огонь, 15–18 минут.", ["buckwheat"]], [45, "Соусы", "Кефирный соус (5 минут, без плиты) и томатный (ковшик, 6–8 минут). Разложи в банки.", ["sauce_k", "sauce_t"]], [50, "Духовка: рыба", "Курицу достань, проверь готовность. Рыбу заверни в конверты и поставь на её место: 200 °C, 15–18 минут.", ["fish"]], [55, "Рис готов, картофель слит", "Рис из чаши на противень тонким слоем, «подогрев» выключи. Картофель слей и выложи на противень. Рагу сними с огня, лавр выбрось, добавь укроп.", []], [60, "Макароны", "Вода с солью (2 л на 200 г), на 1 минуту меньше времени на пачке, холодная вода, на противень.", ["pasta"]], [70, "Свежий ужин", "Рыбу достань и собери порцию «Вт ужин» на тарелку: рис ≈ 295 г, минтай ≈ 140 г, рагу 150 г, картофель ≈ 170 г, масло 15 г, соус. Ешь горячим.", []], [80, "Взвесь и раздели", "Взвесь каждый готовый компонент целиком (рис, гречка, макароны, курица, рыба без сока, рагу, картофель). Расфасуй по контейнерам (внизу этого экрана и в «Контейнеры»), подписав каждый.", []], [95, "Охлаждение", "Контейнеры без крышек поставь в таз с холодной водой на 10–15 минут, пока не станут тёплыми. Горячим в морозилку не ставь.", []], [105, "Холодильник, морозилка, уборка", "Закрой крышками. «Холодильник» в холодильник, «морозилка» в морозилку, баночки с соусами в холодильник. Всё готовое убрано не позже 60 минут после того, как рис вышел из мультиварки. Потом посуда.", []]], "recipeSeq": [["chicken", 5], ["rice", 10], ["potato", 12], ["veg", 15], ["buckwheat", 35], ["sauce_k", 45], ["sauce_t", 45], ["fish", 50], ["pasta", 60]], "daily": ["omelet_rest", "omelet", "oats"], "recipes": [{"id": "chicken", "title": "Курица, запечённая в кефирном маринаде", "sub": "650 г сырого филе бедра → ≈ 470 г готового, 5 порций по 130 г сырого", "items": ["куриное филе бедра (без кожи и кости) 650 г", "кефир 100 мл", "чеснок 2 зубчика", "паприка сладкая молотая 1½ ч. л.", "орегано или итальянские травы 1 ч. л.", "соль 1 ч. л. (≈ 6 г)", "чёрный перец молотый ¼ ч. л. (по желанию)"], "steps": ["Достань курицу из холодильника, обсуши бумажным полотенцем, срежь лишний жир и плёнки.", "В миске смешай кефир, чеснок (раздави или потри на мелкой тёрке), паприку, травы, соль и перец. Выложи курицу, перемешай руками, закрой. Маринад работает от 30 минут; если мариновал с вечера в холодильнике, мясо мягче.", "Противень застели пергаментом. Куски выложи на расстоянии 1–2 см, избыток маринада стряхни.", "Духовка 200 °C (верх и низ), середина. 25–30 минут. Готово, когда в самом толстом куске не меньше 74 °C (бедро мягче при 80 °C) или на разрезе нет розового и сок прозрачный.", "Дай постоять 5 минут. Не мой сырую курицу под краном: брызги разносят бактерии. После неё мой руки, доску и нож с мылом."], "notes": ["Бедро с кефирным маринадом остаётся сочным и после разогрева. Грудка в плане не используется."]}, {"id": "fish", "title": "Минтай в фольге с лимоном и укропом", "sub": "360 г сырого филе → ≈ 280 г готового, 2 конверта по 180 г", "items": ["минтай, филе 360 г (разморозь)", "лимон 2 шт: 4 тонких кружка и сок остального", "укроп 2 веточки", "лук репчатый 30 г кольцами", "соль ½ ч. л.", "фольга"], "steps": ["Разморозка: в холодильнике с вечера или в закрытом пакете в миске с холодной водой 40–60 минут (воду меняй каждые 15 минут). Не размораживай в тёплой воде и на столе.", "Филе обсуши. На лист фольги 30×30 см положи кольца лука, на них 180 г рыбы, посоли, сверху лимон и укроп.", "Заверни конвертом, швы наверх, чтобы сок не вытек.", "200 °C, 15–18 минут. Готово, когда мякоть белая, непрозрачная и расслаивается вилкой.", "Рыбу выложи вместе с соком из фольги (1–2 ст. л.): сок удерживает влагу при разогреве."], "notes": ["Минтай постный (0,9% жира): жир приходит из масла и соуса при разогреве. Рыба в плане стоит в первые сутки после готовки, дальше курица."]}, {"id": "rice", "title": "Рис в мультиварке", "sub": "530 г сухого → ≈ 1430 г готового", "items": ["рис длиннозёрный шлифованный (не пропаренный, не круглый) 530 г", "вода 955 мл (1 г риса : 1,8 мл воды)", "соль 1¾ ч. л."], "steps": ["Промой рис в сите холодной водой 4–5 раз, пока вода почти не станет прозрачной.", "В чашу: рис, вода, соль. Размешай, выровняй.", "Программа «Рис» или «Крупа» (обычно 30–40 минут). Нет такой — «Плов» или «Каша». Крышку не открывай.", "После сигнала подожди 5–10 минут, затем сразу выложи рис из чаши на противень или широкое блюдо тонким слоем. Отключи «подогрев»: рис нельзя оставлять в мультиварке остывать.", "Остынет за 15–20 минут. Взвесь весь готовый рис."], "notes": ["Первая партия калибрует воду: рис твёрдый — в следующий раз воды на 10% больше; каша — на 10% меньше. Если чаша 3 л не вмещает всю порцию (выше отметки «рис»), вари в два захода.", "FSA: варёный рис остужать до часа, в холодильнике не дольше суток, греть один раз до пара."]}, {"id": "buckwheat", "title": "Гречка рассыпчатая", "sub": "110 г сухой → ≈ 275 г готовой", "items": ["гречка ядрица 110 г", "вода 275 мл (на 100 г крупы 250 мл)", "соль ¼ ч. л."], "steps": ["Пересыпь гречку на тарелку, убери тёмные зёрна и шелуху. Промой в сите.", "В кастрюлю с толстым дном: крупа, холодная вода, соль. Доведи до кипения без крышки.", "Накрой крышкой, минимальный огонь, 15–18 минут, не мешай и не открывай.", "Вся вода впиталась — выключи, накрой полотенцем на 10 минут. Потом выложи на противень тонким слоем остывать."], "notes": ["Вода осталась, а крупа готова — слей. Вода выкипела, а крупа жёсткая — добавь 50 мл кипятка и держи под крышкой 5 минут."]}, {"id": "pasta", "title": "Макароны (al dente)", "sub": "200 г сухих → ≈ 460 г готовых", "items": ["макароны из твёрдой пшеницы 200 г", "вода 2 л (1 л на 100 г)", "соль 2 ч. л. (1 ч. л. на литр)"], "steps": ["Кастрюля от 4 л (на 200 г хватит 2 л); если меньше, вари в два захода.", "Воду посоли, доведи до кипения, засыпь макароны, размешай.", "Вари на 1 минуту меньше, чем написано на пачке: при разогреве доварятся.", "Слей в дуршлаг, ополосни холодной водой 30 секунд, чтобы остановить варку и охладить. Стряхни воду, выложи на противень тонким слоем."], "notes": ["Масло в макароны не добавляй: оно уже в плане и кладётся в контейнер при сборке."]}, {"id": "potato", "title": "Картофель отварной", "sub": "1200 г сырого → ≈ 1020 г готового", "items": ["картофель 1200 г", "вода: чтобы покрыла картофель (≈ 1,5–2 л)", "соль 2 ч. л."], "steps": ["Картофель вымой, очисти, нарежь кусками 3–4 см.", "Залей холодной водой, посоли, доведи до кипения, вари 15–18 минут до мягкости (вилка входит без усилия).", "Слей воду, оставь в дуршлаге на 5 минут, потом выложи на противень остывать."], "notes": ["До 500 г — запеки (вкуснее), больше — отвари (не занимает духовку)."]}, {"id": "veg", "title": "Овощное рагу", "sub": "≈ 1050 г готового (по 150 г в контейнер); сырых овощей нужно больше, потому что они уваривают", "items": ["морковь 400 г", "кабачок 500 г", "цветная капуста замороженная 400 г", "лук репчатый 100 г", "томатная паста 30 г", "паприка сладкая 1 ч. л.", "лавровый лист 2 шт", "соль 1 ч. л.", "вода 120 мл", "укроп 10 г"], "steps": ["Нарежь: лук мелко, морковь кружками 0,5 см, кабачок кубиками 2 см. Цветную капусту не размораживай, раздели на соцветия.", "В широкую кастрюлю с толстым дном: лук, морковь, томатная паста, паприка, лавровый лист, вода. Крышка, средний огонь, 10–12 минут.", "Добавь кабачок и цветную капусту, посоли, перемешай. Крышка, 15–20 минут, один раз перемешай.", "Последние 3–5 минут без крышки, чтобы выкипела лишняя вода. Лавровый лист выбрось, добавь укроп.", "Остуди на противне или в широкой миске. Взвесь: должно получиться ≈ 1050 г"], "notes": ["Масла в рагу нет: оно в плане отдельно (по 10–15 г на контейнер)."]}, {"id": "omelet_rest", "title": "Омлет с беконом и сыром (М1 в дни отдыха)", "sub": "4 яйца, бекон 30 г, сыр 20 г, хлеб 80 г; 10 минут", "items": ["яйца 4 шт (200 г)", "бекон 30 г", "сыр 20 г", "хлеб 80 г (3 ломтика)", "соль щепотка"], "steps": ["Бекон нарежь полосками 1 см, выложи на холодную антипригарную сковороду, средний огонь, 2–3 минуты, пока не вытопится жир. Масла не добавляй.", "Яйца взбей вилкой с солью. Влей на сковороду на беконе, огонь слабый.", "Через 2 минуты посыпь тёртым сыром, накрой крышкой на 3–4 минуты, пока не схватится. Подавай с хлебом."], "notes": ["При изжоге бекон убери (в плане он раз в неделю)."]}, {"id": "omelet", "title": "Омлет (М1 в понедельник и среду)", "sub": "3 яйца, молоко 50 мл; 7 минут", "items": ["яйца 3 шт (150 г)", "молоко 2,5% 50 мл", "соль щепотка", "по желанию зелень"], "steps": ["Взбей яйца с молоком и солью вилкой.", "Антипригарная сковорода с крышкой, огонь слабый, без масла. Влей смесь, накрой крышкой на 5–6 минут, пока верх не схватится.", "Ешь с хлебом 100 г и бананом (по плану)."], "notes": ["Единственное, что готовится утром. Всё остальное из контейнеров."]}, {"id": "oats", "title": "Овсянка в банке (М1 во вторник, четверг, пятницу, субботу)", "sub": "вечером накануне, 2 минуты", "items": ["овсяные хлопья 100 г (обычные, не быстрого приготовления)", "молоко 2,5% 200 мл", "щепотка соли, корица по желанию", "утром: банан 120 г, мёд 15 г"], "steps": ["Вечером в банку или контейнер 0,5 л: хлопья, молоко, соль. Размешай, закрой, убери в холодильник.", "Утром разогрей 1 минуту в микроволновке (или ешь холодной). Добавь нарезанный банан и мёд."], "notes": ["Хранится в холодильнике до утра следующего дня; на несколько дней вперёд не готовь."]}, {"id": "sauce_k", "title": "Соус кефирно-чесночный (кислый, свежий)", "sub": "≈ 250 г, 6–7 порций по 40 г; в холодильнике 3 дня", "items": ["кефир 1% 220 мл", "чеснок 2 зубчика", "укроп 20 г", "лимонный сок 2 ч. л.", "соль ¼ ч. л.", "чёрный перец (по желанию)"], "steps": ["Чеснок раздави, укроп мелко нарежь. Смешай всё с кефиром, посоли.", "Переложи в банку, убери в холодильник. Клади 1–2 ст. л. на контейнер после разогрева."], "notes": ["≈ 10 ккал на порцию; в плане калории соусов не учтены (это в пределах точности расчёта)."]}, {"id": "sauce_t", "title": "Соус томатно-паприковый (кисло-острый)", "sub": "≈ 170 г, 6–7 порций по 25–30 г; в холодильнике 4 дня", "items": ["томатная паста 60 г", "вода 150 мл", "паприка сладкая 1 ч. л.", "чеснок 1 зубчик", "мёд 1 ч. л.", "лимонный сок или уксус 9% 1 ч. л.", "перец чили хлопья ¼ ч. л. (для острого, по желанию)", "соль ¼ ч. л."], "steps": ["В ковшик: паста, вода, паприка, чеснок (раздави), мёд, соль, чили. Размешай до однородности.", "Доведи до кипения, на слабом огне 6–8 минут под неплотной крышкой, пока не загустеет.", "Добавь лимонный сок, остуди, перелей в банку. Клади 1–2 ст. л. на рыбу, рис, картофель."], "notes": ["≈ 10 ккал на порцию, не учтено. Остроту регулируй чили: без чили соус просто кисло-сладкий."]}]}, "A": {"key": "A", "kind": "A", "date": null, "label": "Суббота", "start": "11:15", "end": "13:15", "prep": ["Продукты куплены (вкладка «Покупки»)", "Минтай переложен из морозилки в холодильник вчера вечером", "Духовка, 2 противня, пергамент, фольга", "Мультиварка 3 л; кастрюли: 4 л и больше (макароны), 2 л (гречка), широкая с крышкой 3–4 л (рагу); ковшик для соуса", "Весы, сито, дуршлаг, миска для маринада, тёрка", "6 контейнеров от 0,8 л (для больших порций 1 л), 2 банки для соусов, скотч и маркер для подписей"], "containers": [{"label": "Сб обед", "day": "Сб", "kind": "обед", "time": "13:15", "store": "fresh", "age": 0.0, "thaw": "", "parts": [["rice", "рис", 110, 295], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 60}, {"label": "Сб ужин", "day": "Сб", "kind": "ужин", "time": "19:15", "store": "F", "age": 6.0, "thaw": "", "parts": [["rice", "рис", 200, 540], ["potato", "картофель", 200, 170], ["pollock", "минтай", 180, 140], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 0}, {"label": "Вс обед", "day": "Вс", "kind": "обед", "time": "12:30", "store": "F", "age": 23.2, "thaw": "", "parts": [["rice", "рис", 100, 270], ["pollock", "минтай", 180, 140], ["veg", "рагу", 150, 150]], "oil": 10, "bread": 0}, {"label": "Вс ужин", "day": "Вс", "kind": "ужин", "time": "19:00", "store": "Z", "age": 29.8, "thaw": "Вс утром", "parts": [["pasta", "макароны", 100, 230], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 10, "bread": 0}, {"label": "Пн обед", "day": "Пн", "kind": "обед", "time": "12:30", "store": "Z", "age": 47.2, "thaw": "Вс вечером", "parts": [["buckwheat", "гречка", 110, 275], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 60}, {"label": "Пн ужин", "day": "Пн", "kind": "ужин", "time": "19:15", "store": "Z", "age": 54.0, "thaw": "Пн утром", "parts": [["pasta", "макароны", 200, 460], ["potato", "картофель", 100, 85], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 0}, {"label": "Вт обед", "day": "Вт", "kind": "обед", "time": "12:30", "store": "Z", "age": 71.2, "thaw": "Пн вечером", "parts": [["buckwheat", "гречка", 110, 275], ["potato", "картофель", 150, 130], ["chicken", "курица", 130, 95], ["veg", "рагу", 150, 150]], "oil": 15, "bread": 60}], "totals": [["rice", "рис", 410, 1105], ["buckwheat", "гречка", 220, 550], ["pasta", "макароны", 300, 690], ["potato", "картофель", 450, 380], ["chicken", "курица", 650, 470], ["pollock", "минтай", 360, 280], ["veg", "рагу", 1050, 1050]], "timeline": [[0, "Старт", "Духовка 200 °C (верх и низ; с конвекцией 180 °C). Минтай достань из холодильника (разморожен с вечера пятницы). Взвесь продукты. Для сырой курицы отдельная доска.", []], [5, "Маринад", "Смешай маринад, курицу обсуши и выложи в него. Руки с мылом.", ["chicken"]], [10, "Рис", "Промой, в чашу мультиварки с водой и солью, программа «Рис». Дальше не трогай.", ["rice"]], [15, "Рагу, часть 1", "Лук, морковь, томатная паста, паприка, лавр, вода. Крышка, средний огонь, 10–12 минут.", ["veg"]], [25, "Духовка: курица и картофель", "Курица на противне с пергаментом в духовку на 25–30 минут. Рядом на втором противне картофель дольками: 30–35 минут, на 15-й минуте переверни.", ["potato"]], [30, "Рагу, часть 2", "Добавь кабачок и цветную капусту, посоли, крышка, 15–20 минут.", []], [35, "Гречка", "Вода, крупа, соль, кипение без крышки; потом крышка, минимальный огонь, 15–18 минут.", ["buckwheat"]], [45, "Соусы", "Кефирный соус (5 минут, без плиты) и томатный (ковшик, 6–8 минут). Разложи в банки.", ["sauce_k", "sauce_t"]], [50, "Духовка: рыба", "Курицу достань, проверь готовность. Рыбу заверни в конверты и поставь на её место: 200 °C, 15–18 минут. Картофель, если ещё не готов, остаётся.", ["fish"]], [55, "Рис готов", "Выложи рис из чаши на противень тонким слоем, «подогрев» выключи. Рагу сними с огня, лавр выбрось, добавь укроп.", []], [60, "Макароны", "Вода с солью, на 1 минуту меньше времени на пачке, холодная вода, на противень.", ["pasta"]], [70, "Свежая порция", "Рыбу достань и собери порцию «Сб обед» на тарелку: рис ≈ 295 г, курица ≈ 95 г, рагу 150 г, масло 15 г, соус, хлеб 60 г. Ешь горячим.", []], [80, "Взвесь и раздели", "Взвесь каждый готовый компонент целиком (рис, гречка, макароны, курица, рыба без сока, рагу, картофель). Расфасуй по контейнерам (внизу этого экрана и в «Контейнеры»), подписав каждый.", []], [95, "Охлаждение", "Контейнеры без крышек поставь в таз с холодной водой на 10–15 минут, пока не станут тёплыми. Горячим в морозилку не ставь.", []], [105, "Холодильник, морозилка, уборка", "Закрой крышками. «Холодильник» в холодильник, «морозилка» в морозилку, баночки с соусами в холодильник. Всё готовое убрано не позже 60 минут после того, как рис вышел из мультиварки. Потом посуда.", []]], "recipeSeq": [["chicken", 5], ["rice", 10], ["veg", 15], ["potato", 25], ["buckwheat", 35], ["sauce_k", 45], ["sauce_t", 45], ["fish", 50], ["pasta", 60]], "daily": ["omelet_rest", "omelet", "oats"], "recipes": [{"id": "chicken", "title": "Курица, запечённая в кефирном маринаде", "sub": "650 г сырого филе бедра → ≈ 470 г готового, 5 порций по 130 г сырого", "items": ["куриное филе бедра (без кожи и кости) 650 г", "кефир 100 мл", "чеснок 2 зубчика", "паприка сладкая молотая 1½ ч. л.", "орегано или итальянские травы 1 ч. л.", "соль 1 ч. л. (≈ 6 г)", "чёрный перец молотый ¼ ч. л. (по желанию)"], "steps": ["Достань курицу из холодильника, обсуши бумажным полотенцем, срежь лишний жир и плёнки.", "В миске смешай кефир, чеснок (раздави или потри на мелкой тёрке), паприку, травы, соль и перец. Выложи курицу, перемешай руками, закрой. Маринад работает от 30 минут; если мариновал с вечера в холодильнике, мясо мягче.", "Противень застели пергаментом. Куски выложи на расстоянии 1–2 см, избыток маринада стряхни.", "Духовка 200 °C (верх и низ), середина. 25–30 минут. Готово, когда в самом толстом куске не меньше 74 °C (бедро мягче при 80 °C) или на разрезе нет розового и сок прозрачный.", "Дай постоять 5 минут. Не мой сырую курицу под краном: брызги разносят бактерии. После неё мой руки, доску и нож с мылом."], "notes": ["Бедро с кефирным маринадом остаётся сочным и после разогрева. Грудка в плане не используется."]}, {"id": "fish", "title": "Минтай в фольге с лимоном и укропом", "sub": "360 г сырого филе → ≈ 280 г готового, 2 конверта по 180 г", "items": ["минтай, филе 360 г (разморозь)", "лимон 2 шт: 4 тонких кружка и сок остального", "укроп 2 веточки", "лук репчатый 30 г кольцами", "соль ½ ч. л.", "фольга"], "steps": ["Разморозка: в холодильнике с вечера или в закрытом пакете в миске с холодной водой 40–60 минут (воду меняй каждые 15 минут). Не размораживай в тёплой воде и на столе.", "Филе обсуши. На лист фольги 30×30 см положи кольца лука, на них 180 г рыбы, посоли, сверху лимон и укроп.", "Заверни конвертом, швы наверх, чтобы сок не вытек.", "200 °C, 15–18 минут. Готово, когда мякоть белая, непрозрачная и расслаивается вилкой.", "Рыбу выложи вместе с соком из фольги (1–2 ст. л.): сок удерживает влагу при разогреве."], "notes": ["Минтай постный (0,9% жира): жир приходит из масла и соуса при разогреве. Рыба в плане стоит в первые сутки после готовки, дальше курица."]}, {"id": "rice", "title": "Рис в мультиварке", "sub": "410 г сухого → ≈ 1105 г готового", "items": ["рис длиннозёрный шлифованный (не пропаренный, не круглый) 410 г", "вода 740 мл (1 г риса : 1,8 мл воды)", "соль 1¼ ч. л."], "steps": ["Промой рис в сите холодной водой 4–5 раз, пока вода почти не станет прозрачной.", "В чашу: рис, вода, соль. Размешай, выровняй.", "Программа «Рис» или «Крупа» (обычно 30–40 минут). Нет такой — «Плов» или «Каша». Крышку не открывай.", "После сигнала подожди 5–10 минут, затем сразу выложи рис из чаши на противень или широкое блюдо тонким слоем. Отключи «подогрев»: рис нельзя оставлять в мультиварке остывать.", "Остынет за 15–20 минут. Взвесь весь готовый рис."], "notes": ["Первая партия калибрует воду: рис твёрдый — в следующий раз воды на 10% больше; каша — на 10% меньше. Если чаша 3 л не вмещает всю порцию (выше отметки «рис»), вари в два захода.", "FSA: варёный рис остужать до часа, в холодильнике не дольше суток, греть один раз до пара."]}, {"id": "buckwheat", "title": "Гречка рассыпчатая", "sub": "220 г сухой → ≈ 550 г готовой", "items": ["гречка ядрица 220 г", "вода 550 мл (на 100 г крупы 250 мл)", "соль ½ ч. л."], "steps": ["Пересыпь гречку на тарелку, убери тёмные зёрна и шелуху. Промой в сите.", "В кастрюлю с толстым дном: крупа, холодная вода, соль. Доведи до кипения без крышки.", "Накрой крышкой, минимальный огонь, 15–18 минут, не мешай и не открывай.", "Вся вода впиталась — выключи, накрой полотенцем на 10 минут. Потом выложи на противень тонким слоем остывать."], "notes": ["Вода осталась, а крупа готова — слей. Вода выкипела, а крупа жёсткая — добавь 50 мл кипятка и держи под крышкой 5 минут."]}, {"id": "pasta", "title": "Макароны (al dente)", "sub": "300 г сухих → ≈ 690 г готовых", "items": ["макароны из твёрдой пшеницы 300 г", "вода 3 л (1 л на 100 г)", "соль 3 ч. л. (1 ч. л. на литр)"], "steps": ["Кастрюля от 4 л (на 200 г хватит 2 л); если меньше, вари в два захода.", "Воду посоли, доведи до кипения, засыпь макароны, размешай.", "Вари на 1 минуту меньше, чем написано на пачке: при разогреве доварятся.", "Слей в дуршлаг, ополосни холодной водой 30 секунд, чтобы остановить варку и охладить. Стряхни воду, выложи на противень тонким слоем."], "notes": ["Масло в макароны не добавляй: оно уже в плане и кладётся в контейнер при сборке."]}, {"id": "potato", "title": "Картофель, запечённый дольками", "sub": "450 г сырого → ≈ 380 г готового", "items": ["картофель 450 г", "соль и паприка сладкая по вкусу"], "steps": ["Картофель вымой щёткой. Нарежь дольками толщиной 2 см вместе с кожурой, обсуши полотенцем.", "Противень застели пергаментом. Выложи дольки в один слой, посоли, посыпь паприкой.", "200 °C, 30–35 минут, на 15-й минуте переверни. Готово, когда мягко внутри и подрумянено по краям."], "notes": ["До 500 г — запеки (вкуснее), больше — отвари (не занимает духовку)."]}, {"id": "veg", "title": "Овощное рагу", "sub": "≈ 1050 г готового (по 150 г в контейнер); сырых овощей нужно больше, потому что они уваривают", "items": ["морковь 400 г", "кабачок 500 г", "цветная капуста замороженная 400 г", "лук репчатый 100 г", "томатная паста 30 г", "паприка сладкая 1 ч. л.", "лавровый лист 2 шт", "соль 1 ч. л.", "вода 120 мл", "укроп 10 г"], "steps": ["Нарежь: лук мелко, морковь кружками 0,5 см, кабачок кубиками 2 см. Цветную капусту не размораживай, раздели на соцветия.", "В широкую кастрюлю с толстым дном: лук, морковь, томатная паста, паприка, лавровый лист, вода. Крышка, средний огонь, 10–12 минут.", "Добавь кабачок и цветную капусту, посоли, перемешай. Крышка, 15–20 минут, один раз перемешай.", "Последние 3–5 минут без крышки, чтобы выкипела лишняя вода. Лавровый лист выбрось, добавь укроп.", "Остуди на противне или в широкой миске. Взвесь: должно получиться ≈ 1050 г"], "notes": ["Масла в рагу нет: оно в плане отдельно (по 10–15 г на контейнер)."]}, {"id": "omelet_rest", "title": "Омлет с беконом и сыром (М1 в дни отдыха)", "sub": "4 яйца, бекон 30 г, сыр 20 г, хлеб 80 г; 10 минут", "items": ["яйца 4 шт (200 г)", "бекон 30 г", "сыр 20 г", "хлеб 80 г (3 ломтика)", "соль щепотка"], "steps": ["Бекон нарежь полосками 1 см, выложи на холодную антипригарную сковороду, средний огонь, 2–3 минуты, пока не вытопится жир. Масла не добавляй.", "Яйца взбей вилкой с солью. Влей на сковороду на беконе, огонь слабый.", "Через 2 минуты посыпь тёртым сыром, накрой крышкой на 3–4 минуты, пока не схватится. Подавай с хлебом."], "notes": ["При изжоге бекон убери (в плане он раз в неделю)."]}, {"id": "omelet", "title": "Омлет (М1 в понедельник и среду)", "sub": "3 яйца, молоко 50 мл; 7 минут", "items": ["яйца 3 шт (150 г)", "молоко 2,5% 50 мл", "соль щепотка", "по желанию зелень"], "steps": ["Взбей яйца с молоком и солью вилкой.", "Антипригарная сковорода с крышкой, огонь слабый, без масла. Влей смесь, накрой крышкой на 5–6 минут, пока верх не схватится.", "Ешь с хлебом 100 г и бананом (по плану)."], "notes": ["Единственное, что готовится утром. Всё остальное из контейнеров."]}, {"id": "oats", "title": "Овсянка в банке (М1 во вторник, четверг, пятницу, субботу)", "sub": "вечером накануне, 2 минуты", "items": ["овсяные хлопья 100 г (обычные, не быстрого приготовления)", "молоко 2,5% 200 мл", "щепотка соли, корица по желанию", "утром: банан 120 г, мёд 15 г"], "steps": ["Вечером в банку или контейнер 0,5 л: хлопья, молоко, соль. Размешай, закрой, убери в холодильник.", "Утром разогрей 1 минуту в микроволновке (или ешь холодной). Добавь нарезанный банан и мёд."], "notes": ["Хранится в холодильнике до утра следующего дня; на несколько дней вперёд не готовь."]}, {"id": "sauce_k", "title": "Соус кефирно-чесночный (кислый, свежий)", "sub": "≈ 250 г, 6–7 порций по 40 г; в холодильнике 3 дня", "items": ["кефир 1% 220 мл", "чеснок 2 зубчика", "укроп 20 г", "лимонный сок 2 ч. л.", "соль ¼ ч. л.", "чёрный перец (по желанию)"], "steps": ["Чеснок раздави, укроп мелко нарежь. Смешай всё с кефиром, посоли.", "Переложи в банку, убери в холодильник. Клади 1–2 ст. л. на контейнер после разогрева."], "notes": ["≈ 10 ккал на порцию; в плане калории соусов не учтены (это в пределах точности расчёта)."]}, {"id": "sauce_t", "title": "Соус томатно-паприковый (кисло-острый)", "sub": "≈ 170 г, 6–7 порций по 25–30 г; в холодильнике 4 дня", "items": ["томатная паста 60 г", "вода 150 мл", "паприка сладкая 1 ч. л.", "чеснок 1 зубчик", "мёд 1 ч. л.", "лимонный сок или уксус 9% 1 ч. л.", "перец чили хлопья ¼ ч. л. (для острого, по желанию)", "соль ¼ ч. л."], "steps": ["В ковшик: паста, вода, паприка, чеснок (раздави), мёд, соль, чили. Размешай до однородности.", "Доведи до кипения, на слабом огне 6–8 минут под неплотной крышкой, пока не загустеет.", "Добавь лимонный сок, остуди, перелей в банку. Клади 1–2 ст. л. на рыбу, рис, картофель."], "notes": ["≈ 10 ккал на порцию, не учтено. Остроту регулируй чили: без чили соус просто кисло-сладкий."]}]}}, "trips": {"A1": {"key": "A1", "date": "2026-10-17", "shop": "10:00", "groups": [["Мясо и рыба", [["Куриное филе бедра", "650 г", "650 г", 286, "chicken"], ["Минтай, филе замороженное", "720 г", "1 × упаковка 1 кг", 400, "pollock"]]], ["Молочное и яйца", [["Кефир 1%", "1,7 л", "2 × бутылка 0,9 л", 176, "kefir"], лифованный", "940 г", "2 × пачка 900 г", 252, "rice"], ["Гречка ядрица", "330 г", "1 × пачка 800 г", 76, "buckwheat"], ["Макароны (твёрдые сорта)", "500 г", "2 × пачка 450 г", 126, "pasta"], ["Овсяные хлопья (не быстрые)", "400 г", "1 × пачка 500 г", 65, "oats"], ["Хлеб пшеничный (нарезка)", "940 г", "3 × батон 450 г", 231, "bread"], ["Мёд", "270 г", "1 × банка 300 г", 150, "honey"], ["Масло подсолнечное", "200 г", "1 × бутылка 1 л", 175, "oil"]]]], "total": 3052, "fresh": [["Чеснок", "1 головка", 20], ["Укроп", "1 пучок", 50], ["Лимон", "2 шт", 100]], "pantry": [], "grand": 3222, "nonfood": []}}, "cal": {"std": {"Сб": {"events": [["обед", "Сб обед", "fresh", "13:15", "", "A"], ["ужин", "Сб ужин", "F", "19:15", "", "A"]], "m1": "oats", "cook": "A", "shop": "A", "evening": []}, "Вс": {"events": [["обед", "Вс обед", "F", "12:30", "", "A"], ["ужин", "Вс ужин", "Z", "19:00", "Вс утром", "A"]], "m1": "rest", "cook": null, "shop": null, "evening": []}, "Пн": {"events": [["обед", "Пн обед", "Z", "12:30", "Вс вечером", "A"], ["ужин", "Пн ужин", "Z", "19:15", "Пн утром", "A"]], "m1": "omelet", "cook": null, "shop": null, "evening": ["минтай из морозилки в холодильник (на вторничную готовку)"]}, "Вт": {"events": [["обед", "Вт обед", "Z", "12:30", "Пн вечером", "A"], ["ужин", "Вт ужин", "fresh", "19:15", "", "B"]], "m1": "oats", "cook": "B", "shop": "B", "evening": []}, "Ср": {"events": [["обед", "Ср обед", "F", "12:30", "", "B"], ["ужин", "Ср ужин", "F", "19:15", "", "B"]], "m1": "omelet", "cook": null, "shop": null, "evening": []}, "Чт": {"events": [["обед", "Чт обед", "Z", "12:30", "Ср вечером", "B"], ["ужин", "Чт ужин", "Z", "19:15", "Чт утром", "B"]], "m1": "oats", "cook": null, "shop": null, "evening": []}, "Пт": {"events": [["обед", "Пт обед", "Z", "12:30", "Чт вечером", "B"], ["ужин", "Пт ужин", "Z", "19:15", "Пт утром", "B"]], "m1": "oats", "cook": null, "shop": null, "evening": ["минтай из морозилки в холодильник (на субботнюю готовку)"]}}, "first": {"2026-10-17": {"events": [["обед", "Сб обед", "fresh", "13:15", "", "A1"], ["ужин", "Сб ужин", "F", "19:00", "", "A1"]], "m1": "rest", "cook": "A1", "shop": "A1", "evening": []}}}, "docs": [{"id": "home", "title": "Главное", "html": "\n<div class=\"box ok\"><b>Цель:<\/b> меньше жира при той же силе и скорости в воде. Темп около 0,3 кг в неделю, к 27.12 около −3 кг по моей оценке расхода. Реальный темп покажут весы, а не расчёт.<\/div>\n<h3>Старт<\/h3>\n<ul>\n<li><b>Сб 17.10 и Вс 18.10:<\/b> меню отдыха (≈ 2700 ккал, без дефицита). Покупки, первая готовка (лист cook-17-10.pdf), весы.<\/li>\n<li><b>Вс 18.10 утром:<\/b> первое взвешивание (после туалета, до еды и воды) и талия по пупку.<\/li>\n<li><b>Пн 19.10:<\/b> первый день меню с дефицитом.<\/li>\n<li>Две недели до 01.11 — калибровка: решения по весу принимаются с 02.11. Вес в первые дни может прыгнуть на ±1 кг из-за воды и гликогена.<\/li>\n<\/ul>\n<h3>Как устроена неделя<\/h3>\n<ul>\n<li><b>Готовка два раза:<\/b> суббота 11:15–13:15 и вторник 17:30–19:15. Покупки перед каждой: суббота 10:15 и вторник 16:30.<\/li>\n<li>Остальное — сборка за 5 минут вечером: сумка на завтра, банка овсянки, достать из морозилки то, что назначено (раздел «Неделя готовки»).<\/li>\n<li>Порция, которую съедаешь позже чем через ≈ 24 часа после готовки, сразу идёт в морозилку.<\/li>\n<\/ul>\n<h3>Что купить кроме еды<\/h3>\n<ul>\n<li>Весы для тела с шагом 100 г. Контейнеры 0,8–1 л: 6–7 на каждую готовку.<\/li>\n<li>Термосумка и 2 замороженные бутылки воды вместо хладоэлементов: обед на учёбе стоит без холода около 6 часов.<\/li>\n<li>2 банки для соусов, малярный скотч и маркер для подписей.<\/li>\n<\/ul>\n<h3>Главное<\/h3>\n<ul>\n<li>6 приёмов; пауза между ними не больше 4–5 часов; последний не позже 20:00 (за 2 часа до сна).<\/li>\n<li>Не пропускай М2 после воды: 5 минут в раздевалке.<\/li>\n<li>Еда тёплая, есть медленно. Не жарить: варить, тушить, запекать, на пару.<\/li>\n<li>Кофе, энергетики, шоколад и газировка в план не входят; газировка раз в месяц — твоё решение.<\/li>\n<\/ul>"}, {"id": "nums", "title": "Числа по дням", "html": "<table class=\"t\"><tr><th>День<\/th><th>Нагрузка<\/th><th>ккал<\/th><th>Белок, г<\/th><th>Угл., г/кг<\/th><th>Жир, г<\/th><th>Дост. энергия<\/th><\/tr><tr><td class=b>Пн<\/td><td>вода ×2<\/td><td class=n>4214<\/td><td class=n>193<\/td><td class=n>7.7<\/td><td class=n>91<\/td><td class=n>33<\/td><\/tr><tr><td class=b>Вт<\/td><td>вода утром<\/td><td class=n>3437<\/td><td class=n>167<\/td><td class=n>6.1<\/td><td class=n>75<\/td><td class=n>35<\/td><\/tr><tr><td class=b>Ср<\/td><td>вода + зал A<\/td><td class=n>3877<\/td><td class=n>191<\/td><td class=n>6.8<\/td><td class=n>85<\/td><td class=n>36<\/td><\/tr><tr><td class=b>Чт<\/td><td>вода + зал C<\/td><td class=n>3681<\/td><td class=n>162<\/td><td class=n>6.8<\/td><td class=n>79<\/td><td class=n>35<\/td><\/tr><tr><td class=b>Пт<\/td><td>вода ×2<\/td><td class=n>4266<\/td><td class=n>172<\/td><td class=n>8.3<\/td><td class=n>81<\/td><td class=n>34<\/td><\/tr><tr><td class=b>Сб<\/td><td>вода + зал B<\/td><td class=n>3929<\/td><td class=n>170<\/td><td class=n>7.5<\/td><td class=n>75<\/td><td class=n>34<\/td><\/tr><tr><td class=b>Вс<\/td><td>отдых<\/td><td class=n>2703<\/td><td class=n>152<\/td><td class=n>3.9<\/td><td class=n>81<\/td><td class=n>39<\/td><\/tr><\/table>\n<div class=\"box\">В среднем <b>≈ 3730 ккал<\/b> и <b>≈ 170 г белка<\/b> (2,0 г на кг). Моя оценка расхода <b>≈ 4030 ккал в день<\/b> (±400).\nДефицит около <b>300 ккал<\/b> в день, около 0,28 кг в неделю. Продукты на неделю стоят ≈ 3540 ₽ (оценка).<\/div>\n<h3>Как посчитано<\/h3>\n<ul>\n<li>Покой: 1953 ккал (формула Миффлина — Сан-Жеора) × 1,4 за обычный день = 2734 ккал.<\/li>\n<li>Тренировки сверх покоя: вода ≈ 510 ккал в час (≈ 1020 за утро, ≈ 890 за вечер), зал ≈ 300 ккал в час. Оценка по METs, ошибка ±30%.<\/li>\n<li><b>Доступная энергия<\/b> = (еда − расход на тренировки) на кг тощей массы (69 кг, оценка). Общий ориентир IOC: ниже 30 ккал — низкая. У мужчин порог изучен хуже, поэтому держим не ниже 33 в каждый день. В таблице видно, почему на тяжёлых днях дефицита почти нет, а на лёгких он больше.<\/li>\n<li><b>Белок<\/b> 2 г на кг: в дефиците при силовых тренировках защищает мышцы (ориентир 1,6–2,4 г на кг).<\/li>\n<li><b>Поддержание<\/b> (запасной вариант): то же меню + блок А в М6 с понедельника по субботу. В среднем ≈ 3990 ккал.<\/li>\n<\/ul>"}, {"id": "base", "title": "База дня: вторник", "html": "<p class=\"small\">Крупы и мясо — в сухом и сыром весе (взвешивай до готовки на кухонных весах). Овощи — тушёные, масло добавляй в готовое.<\/p>\n<table class=\"t mt\"><colgroup><col style=\"width:17%\"><col style=\"width:59%\"><col style=\"width:12%\"><col style=\"width:12%\"><\/colgroup>\n<tr><th>Время<\/th><th>Приём<\/th><th>ккал<\/th><th>Белок<\/th><\/tr><tr><td class=b style='white-space:normal'>06:15<\/td><td><b>М1<\/b> до воды (за 45 мин)<br><span class=small>овсяные хлопья (сух.) 100 г<br>молоко 2,5% 200 мл<br>банан 120 г<br>мёд 15 г (2 ч. л.)<\/span><\/td><td class=n>611<\/td><td class=n>19<\/td><\/tr><tr><td class=b style='white-space:normal'>09:10<\/td><td><b>М2<\/b> после воды (из сумки)<br><span class=small>кефир 1% 400 мл<br>банан 120 г<br>хлеб 80 г (3 ломтика)<\/span><\/td><td class=n>476<\/td><td class=n>19<\/td><\/tr><tr><td class=b style='white-space:normal'>12:30<\/td><td><b>М3<\/b> обед (контейнер, микроволновка)<br><span class=small>гречка (сух.) 110 г<br>куриное филе бедра (сырое) 130 г<br>овощи (морковь, кабачок, цветная капуста), тушёные 150 г<br>масло подсолнечное 15 г (1 ст. л.)<br>хлеб 60 г (2 ломтика)<\/span><\/td><td class=n>856<\/td><td class=n>46<\/td><\/tr><tr><td class=b style='white-space:normal'>за 60–90 мин до вечерней тренировки<\/td><td><b>М4<\/b> перекус<br><span class=small>творог 5% 80 г<br>хлеб 60 г (2 ломтика)<br>мёд 15 г (2 ч. л.)<br>яблоко сладкое 150 г<\/span><\/td><td class=n>370<\/td><td class=n>19<\/td><\/tr><tr><td class=b style='white-space:normal'>19:15<\/td><td><b>М5<\/b> ужин (дома)<br><span class=small>рис (сух.) 110 г<br>минтай, филе (сырое) 180 г<br>овощи (морковь, кабачок, цветная капуста), тушёные 150 г<br>масло подсолнечное 15 г (1 ст. л.)<br>картофель 200 г<\/span><\/td><td class=n>826<\/td><td class=n>42<\/td><\/tr><tr><td class=b style='white-space:normal'>19:50<\/td><td><b>М6<\/b> перед сном (за 2 ч)<br><span class=small>кефир 1% 300 мл<br>творог 5% 50 г<\/span><\/td><td class=n>180<\/td><td class=n>18<\/td><\/tr><tr><td class=b>+<\/td><td><b>Картофель<\/b> к обеду<br><span class=small>картофель 150 г<\/span><\/td><td class=n>116<\/td><td class=n>3<\/td><\/tr>\n<tr class=\"bh\"><td colspan=\"2\">Итого вторник<\/td><td class=n>3437<\/td><td class=n>167<\/td><\/tr><\/table>\n<h3>Что где<\/h3>\n<ul>\n<li><b>М1:<\/b> овсянка (или омлет в дни из таблицы). За 45 минут до воды.<\/li>\n<li><b>М2:<\/b> в сумке, съедаешь после воды. Нет аппетита — хотя бы кефир и банан.<\/li>\n<li><b>М3:<\/b> контейнер, 1–2 минуты в микроволновке на учёбе.<\/li>\n<li><b>М4:<\/b> за 60–90 минут до вечерней тренировки; в дни без неё около 15:30.<\/li>\n<li><b>М5, М6:<\/b> дома. М6 не позже 20:00.<\/li>\n<\/ul>"}, {"id": "days", "title": "Дни недели", "html": "<p class=\"small\">М2, М4 и М6 одинаковые во все дни (как во вторник); меняются М1, М3, М5 и добавки.<\/p>\n<table class=\"t\"><colgroup><col style=\"width:9%\"><col style=\"width:18%\"><col style=\"width:20%\"><col style=\"width:28%\"><col style=\"width:25%\"><\/colgroup>\n<tr><th>День<\/th><th>М1<\/th><th>М3<\/th><th>М5<\/th><th>Добавки<\/th><\/tr><tr><td class=b>Пн<\/td><td>омлет (3 яйца)<\/td><td>гречка + курица<\/td><td>макароны, курица, картофель 100 г<\/td><td class=small>Блок А к М2<br>Блок А к М4<br>Блок Б (макароны) к ужину<\/td><\/tr><tr><td class=b>Вт<\/td><td>овсянка<\/td><td>гречка + курица<\/td><td>рис, минтай, картофель 200 г<\/td><td class=small>Картофель к обеду<\/td><\/tr><tr><td class=b>Ср<\/td><td>омлет (3 яйца)<\/td><td>гречка + курица<\/td><td>макароны, минтай, картофель 100 г<\/td><td class=small>Блок А к М4<br>Блок Б (макароны) к ужину<\/td><\/tr><tr><td class=b>Чт<\/td><td>овсянка<\/td><td>рис + курица<\/td><td>картофель 450 г, курица<\/td><td class=small>Блок А к М4<br>Блок В (картофель) к ужину<\/td><\/tr><tr><td class=b>Пт<\/td><td>овсянка<\/td><td>рис + курица<\/td><td>рис, курица, картофель 200 г<\/td><td class=small>Блок А к М2<br>Блок А к М4<br>Блок Б (рис) к ужину<\/td><\/tr><tr><td class=b>Сб<\/td><td>овсянка<\/td><td>рис + курица<\/td><td>рис, минтай, картофель 200 г<\/td><td class=small>Блок А к М2<br>Блок Б (рис) к ужину<\/td><\/tr><tr><td class=b>Вс<\/td><td colspan=3>меню отдыха (раздел «Отдых»)<\/td><td>—<\/td><\/tr><\/table>\n<h3>Блоки<\/h3>\n<table class=\"t\"><tr><th>Блок<\/th><th>Состав<\/th><th>ккал<\/th><\/tr><tr><td class=b>Блок А<\/td><td>хлеб 60 г (2 ломтика)<br>мёд 15 г (2 ч. л.)<br>банан 120 г<\/td><td class=n>310<\/td><\/tr><tr><td class=b>Блок Б (рис)<\/td><td>рис (сух.) 90 г<\/td><td class=n>297<\/td><\/tr><tr><td class=b>Блок В (картофель)<\/td><td>картофель 250 г<\/td><td class=n>192<\/td><\/tr><tr><td class=b>Картофель<\/td><td>картофель 150 г<\/td><td class=n>116<\/td><\/tr><\/table>\n<div class=\"box ok\"><b>Блок А — резерв.<\/b> Скорость снижения веса больше 0,6 кг в неделю, плохой сон, «тяжелее» на режиме: добавь блок А в М6 с понедельника по субботу (≈ +310 ккал в день). Правила проверки — в разделе «Проверка».<\/div>\n<h3>Замены (ккал почти не меняются)<\/h3>\n<ul>\n<li>минтай 180 г ↔ куриное филе бедра 130 г (и наоборот);<\/li>\n<li>творог 80 г ↔ 2 яйца вкрутую;<\/li>\n<li>кефир ↔ молоко 2,5% (+50 ккал на 400 мл);<\/li>\n<li>банан ↔ груша или сладкое яблоко 200 г;<\/li>\n<li>гречка ↔ рис ↔ макароны по сухому весу; картофель в три раза больше по весу;<\/li>\n<li>шейк NEO вместо кефира в М2 (30 г белка): на вкус и по цене решаешь сам.<\/li>\n<\/ul>"}, {"id": "rest", "title": "Отдых: воскресенье", "html": "<table class=\"t mt\"><colgroup><col style=\"width:14%\"><col style=\"width:62%\"><col style=\"width:12%\"><col style=\"width:12%\"><\/colgroup>\n<tr><th>Время<\/th><th>Приём<\/th><th>ккал<\/th><th>Белок<\/th><\/tr><tr><td class=b>09:00<\/td><td><b>М1<\/b> завтрак<br><span class=small>4 яйца (200 г)<br>бекон 30 г<br>сыр 20 г<br>хлеб 80 г (3 ломтика)<\/span><br><span class=small>омлет с беконом и сыром — раз в неделю; при изжоге бекон убрать<\/span><\/td><td class=n>694<\/td><td class=n>40<\/td><\/tr><tr><td class=b>12:30<\/td><td><b>М2<\/b> обед<br><span class=small>рис (сух.) 100 г<br>минтай, филе (сырое) 180 г<br>овощи (морковь, кабачок, цветная капуста), тушёные 150 г<br>масло подсолнечное 10 г (1 ст. л.)<\/span><br><span class=small>рыба: в первые сутки после готовки<\/span><\/td><td class=n>594<\/td><td class=n>38<\/td><\/tr><tr><td class=b>15:30<\/td><td><b>М3<\/b> полдник<br><span class=small>творог 5% 100 г<br>банан 120 г<br>мёд 15 г (2 ч. л.)<br>хлеб 60 г (2 ломтика)<\/span><\/td><td class=n>431<\/td><td class=n>23<\/td><\/tr><tr><td class=b>19:00<\/td><td><b>М4<\/b> ужин<br><span class=small>макароны (сух.) 100 г<br>куриное филе бедра (сырое) 130 г<br>овощи (морковь, кабачок, цветная капуста), тушёные 150 г<br>масло подсолнечное 10 г (1 ст. л.)<\/span><br><span class=small>контейнер из холодильника или морозилки: см. вкладку «Еда»<\/span><\/td><td class=n>636<\/td><td class=n>38<\/td><\/tr><tr><td class=b>19:50<\/td><td><b>М5<\/b> вечер<br><span class=small>кефир 1% 300 мл<br>яблоко сладкое 150 г<br>хлеб 60 г (2 ломтика)<\/span><br><span class=small>не позже 20:00<\/span><\/td><td class=n>348<\/td><td class=n>14<\/td><\/tr>\n<tr class=\"bh\"><td colspan=\"2\">Итого<\/td><td class=n>2703<\/td><td class=n>152<\/td><\/tr><\/table>\n<p class=\"small\">Расход в день отдыха ≈ 2730 ккал, поэтому дефицита здесь нет: воскресенье пополняет запасы перед понедельником.<\/p>"}, {"id": "week", "title": "Неделя готовки", "html": "<div class=\"box ok\"><b>Две готовки в неделю:<\/b> суббота 11:15–13:15 (после воды и магазина, до зала в 14:30) и вторник 17:30–19:15 (вечерней воды нет). Всё остальное — сборка за 5 минут вечером.<\/div>\n<table class=\"t\"><colgroup><col style=\"width:9%\"><col style=\"width:19%\"><col style=\"width:24%\"><col style=\"width:22%\"><col style=\"width:26%\"><\/colgroup>\n<tr><th>День<\/th><th>Дела<\/th><th>Контейнеры дня<\/th><th>Утром<\/th><th>Вечером<\/th><\/tr><tr><td class=b>Сб<\/td><td>магазин 10:15; готовка 11:15–13:15<\/td><td class=small>«Сб обед» (сразу)<br>«Сб ужин» (холодильник)<\/td><td class=small>—<\/td><td class=small>—<\/td><\/tr><tr><td class=b>Вс<\/td><td>—<\/td><td class=small>«Вс обед» (холодильник)<br>«Вс ужин» (морозилка)<\/td><td class=small>из морозилки в холодильник «Вс ужин»<\/td><td class=small>из морозилки в холодильник «Пн обед»<br>сумка на завтра (М2, обед, М4), 2 бутылки воды в морозилку<\/td><\/tr><tr><td class=b>Пн<\/td><td>—<\/td><td class=small>«Пн обед» (морозилка)<br>«Пн ужин» (морозилка)<\/td><td class=small>из морозилки в холодильник «Пн ужин»<br>«Пн обед» в термосумку<\/td><td class=small>из морозилки в холодильник «Вт обед»<br>банка овсянки на утро<br>минтай из морозилки в холодильник (на вторничную готовку)<br>сумка на завтра (М2, обед, М4), 2 бутылки воды в морозилку<\/td><\/tr><tr><td class=b>Вт<\/td><td>магазин 16:30; готовка 17:30–19:00<\/td><td class=small>«Вт обед» (морозилка)<br>«Вт ужин» (сразу)<\/td><td class=small>«Вт обед» в термосумку<\/td><td class=small>сумка на завтра (М2, обед, М4), 2 бутылки воды в морозилку<\/td><\/tr><tr><td class=b>Ср<\/td><td>—<\/td><td class=small>«Ср обед» (холодильник)<br>«Ср ужин» (холодильник)<\/td><td class=small>«Ср обед» в термосумку<\/td><td class=small>из морозилки в холодильник «Чт обед»<br>банка овсянки на утро<br>сумка на завтра (М2, обед, М4), 2 бутылки воды в морозилку<\/td><\/tr><tr><td class=b>Чт<\/td><td>—<\/td><td class=small>«Чт обед» (морозилка)<br>«Чт ужин» (морозилка)<\/td><td class=small>из морозилки в холодильник «Чт ужин»<br>«Чт обед» в термосумку<\/td><td class=small>из морозилки в холодильник «Пт обед»<br>банка овсянки на утро<br>сумка на завтра (М2, обед, М4), 2 бутылки воды в морозилку<\/td><\/tr><tr><td class=b>Пт<\/td><td>—<\/td><td class=small>«Пт обед» (морозилка)<br>«Пт ужин» (морозилка)<\/td><td class=small>из морозилки в холодильник «Пт ужин»<br>«Пт обед» в термосумку<\/td><td class=small>банка овсянки на утро<br>минтай из морозилки в холодильник (на субботнюю готовку)<br>сумка на завтра: М2 (после воды)<\/td><\/tr><\/table>\n<h3>Как это работает<\/h3>\n<ul>\n<li><b>Сб 10:15 магазин, 11:15 готовка:<\/b> на сб (обед и ужин), вс, пн и обед вт. Из них в холодильник идут порции до воскресного обеда, остальные в морозилку.<\/li>\n<li><b>Вт 16:30 магазин, 17:30 готовка:<\/b> ужин вт сразу, на ср в холодильник, на чт и пт в морозилку.<\/li>\n<li><b>Рыба<\/b> стоит в первые сутки после готовки (сб, вс, вт, ср), курица в поздние дни (пн, чт, пт): после морозилки и разогрева курица остаётся сочнее, минтай сохнет.<\/li>\n<li><b>Каждое утро и вечер<\/b> — по таблице: это 5 минут. Калории и вес каждого контейнера в разделе «Расфасовка».<\/li>\n<li>Первая суббота 17.10 отличается: меню отдыха. Её лист: cook-17-10.pdf.<\/li>\n<\/ul>"}, {"id": "store", "title": "Хранение и разогрев", "html": "<table class=\"t\"><colgroup><col style=\"width:24%\"><col><\/colgroup><tr><th>Тема<\/th><th>Правило<\/th><\/tr><tr><td class=b style='white-space:normal'>Холодильник или морозилка<\/td><td>В холодильнике лежит только то, что съедается в течение ≈ 24 часов после готовки. Остальное сразу в морозилку (в течение 60 минут после приготовления). Таблица «Расфасовка» говорит, куда что.<\/td><\/tr><tr><td class=b style='white-space:normal'>Охлаждение<\/td><td>Не оставляй готовое остывать в мультиварке, кастрюле или на столе больше часа. Рис и макароны тонким слоем на противне, в контейнеры по одной порции: так остывают быстрее. Горячий контейнер в морозилку не ставь: подожди, пока станет тёплым.<\/td><\/tr><tr><td class=b style='white-space:normal'>Размораживание<\/td><td>Контейнер из морозилки переложи в холодильник: на обед — накануне вечером, на ужин — утром того же дня. Не размораживай на столе.<\/td><\/tr><tr><td class=b style='white-space:normal'>Минтай<\/td><td>Хранится в морозилке. За ночь до готовки переложи его в холодильник: в пятницу вечером на субботу, в понедельник вечером на вторник. Не размораживай на столе и в тёплой воде.<\/td><\/tr><tr><td class=b style='white-space:normal'>Разогрев<\/td><td>Один раз, в микроволновке: 1–2 ст. л. воды, крышка с щелью, 2 минуты на 800 Вт, перемешай, ещё 1–2 минуты. Должно парить по всему объёму (≥ 74 °C). Разогретое не убирай обратно: съешь или выбрось.<\/td><\/tr><tr><td class=b style='white-space:normal'>На учёбе<\/td><td>Утром контейнер из холодильника в термосумку с 2 хладоэлементами (или с 2 замороженными бутылками воды). Готовая еда с мясом, рисом и макаронами не должна стоять без холода дольше 2 часов (USDA); обед в 12:30 при выходе в 06:30 — это 6 часов.<\/td><\/tr><tr><td class=b style='white-space:normal'>Что выбросить<\/td><td>Контейнер из холодильника старше 24 часов с рисом или макаронами; любой с кислым или необычным запахом; любой, который был разогрет и не съеден.<\/td><\/tr><\/table><h3>Источники<\/h3><ul><li><a href=\"https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker\">FSA (Великобритания), Home food fact checker, обновлено 21.08.2026<\/a><\/li><li><a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\">USDA FSIS, Leftovers and Food Safety<\/a><\/li><li><a href=\"https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/bacteria-foodborne-illness/bacillus-cereus\">FSANZ, Bacillus cereus<\/a><\/li><\/ul><p class=\"small\">FSA: рис в холодильнике не дольше 1 суток, остужать до часа, греть один раз. USDA: готовые блюда 3–4 суток в холодильнике, 3–4 месяца в морозилке, разогрев до 74 °C. FSANZ: токсин B. cereus образуется и в других крахмалистых блюдах при плохом охлаждении. Правило «24 часа или морозилка» строже USDA.<\/p>\n<h3>Когда доставать из морозилки<\/h3>\n<table class=\"t\"><colgroup><col style=\"width:30%\"><col><\/colgroup><tr><th>Когда<\/th><th>Что<\/th><\/tr><tr><td class=b>Пт вечером<\/td><td>минтай из морозилки в холодильник (на субботу)<\/td><\/tr><tr><td class=b>Вс утром<\/td><td>из морозилки в холодильник «Вс ужин»<\/td><\/tr><tr><td class=b>Вс вечером<\/td><td>из морозилки в холодильник «Пн обед»<\/td><\/tr><tr><td class=b>Пн утром<\/td><td>из морозилки в холодильник «Пн ужин»<\/td><\/tr><tr><td class=b>Пн вечером<\/td><td>из морозилки в холодильник «Вт обед»; минтай из морозилки в холодильник (на вторник)<\/td><\/tr><tr><td class=b>Ср вечером<\/td><td>из морозилки в холодильник «Чт обед»<\/td><\/tr><tr><td class=b>Чт утром<\/td><td>из морозилки в холодильник «Чт ужин»<\/td><\/tr><tr><td class=b>Чт вечером<\/td><td>из морозилки в холодильник «Пт обед»<\/td><\/tr><tr><td class=b>Пт утром<\/td><td>из морозилки в холодильник «Пт ужин»<\/td><\/tr><\/table>"}, {"id": "time", "title": "Режим дня", "html": "<table class=\"t\"><colgroup><col style=\"width:25%\"><col><\/colgroup><tr><td class=b>06:00<\/td><td>подъём, вес до еды (в журнал)<\/td><\/tr><tr><td class=b>06:15<\/td><td>М1: овсянка или омлет<\/td><\/tr><tr><td class=b>06:30<\/td><td>выход<\/td><\/tr><tr><td class=b>07:00–09:00<\/td><td>вода (суббота 07:30–09:45, потом магазин 10:15 и готовка 11:15)<\/td><\/tr><tr><td class=b>09:10<\/td><td>М2 из сумки<\/td><\/tr><tr><td class=b>09:00–16:00<\/td><td>учёба или дом<\/td><\/tr><tr><td class=b>12:30<\/td><td>М3: контейнер<\/td><\/tr><tr><td class=b>перед вечером<\/td><td>М4 за 60–90 минут до воды или зала<\/td><\/tr><tr><td class=b>16:45–18:30<\/td><td>вода (пн, пт); зал A в среду 16:00, зал C в четверг 17:00; вторник 16:30 магазин, 17:30 готовка<\/td><\/tr><tr><td class=b>19:15<\/td><td>М5: ужин<\/td><\/tr><tr><td class=b>19:50<\/td><td>М6: кефир и творог, последний приём<\/td><\/tr><tr><td class=b>21:30<\/td><td>экраны выключены<\/td><\/tr><tr><td class=b>22:00<\/td><td>сон<\/td><\/tr><\/table>\n<ul>\n<li>Подъём в 06:00 и отбой в 22:00 каждый день, включая выходные: 8 часов сна. Если сейчас ложишься сильно позже, сдвигай отбой на 30 минут каждые 3 дня.<\/li>\n<li>Ужин и М6 не позже чем за 2 часа до сна.<\/li>\n<li>Выходной: те же 06:00 и 22:00, но без воды и зала.<\/li>\n<\/ul>"}, {"id": "check", "title": "Проверка раз в неделю и остановка", "html": "<h3>Понедельник утром (страница «Неделя» в журнале)<\/h3>\n<ul>\n<li>Вес: среднее за 7 дней (нужно 4 взвешивания и больше), сравнивай со средним прошлой недели.<\/li>\n<li><b>Падает быстрее 0,6 кг в неделю<\/b> (0,7% веса): добавь блок А в М6 с понедельника по субботу.<\/li>\n<li><b>Падает на 0,1–0,6 кг:<\/b> всё по плану.<\/li>\n<li><b>Не падает 2 недели подряд:<\/b> сам не урезай: запас по доступной энергии небольшой. Пришли данные, я пересчитаю расход.<\/li>\n<li><b>Растёт больше 0,5 кг в неделю:<\/b> проверь, что взвешиваешься в одних условиях; потом пришли данные.<\/li>\n<li>Талия по пупку раз в неделю (воскресенье утром): −1 см за 4 недели — ориентир, ±1 см — погрешность.<\/li>\n<\/ul>\n<div class=\"box red\"><b>Остановка дефицита.<\/b> Любой из пунктов → ешь меню на поддержание (то же меню + блок А в М6) не меньше 2 недель и напиши мне:<br>\n1. «Тяжелее» на режиме два раза в неделю и больше две недели подряд.<br>\n2. Рабочие веса главных подъёмов в зале ниже на 5% и больше за неделю.<br>\n3. Болезнь, травма, температура.<br>\n4. Сон меньше 6,5 часа три ночи подряд.<br>\n5. Срыв: переедание или «не лезет» больше двух дней.<br>\n6. Изжога или боль в животе три дня подряд.<br>\n7. Вес падает быстрее 0,6 кг в неделю две недели подряд.<\/div>"}], "nums": {"rows": [["Пн", "вода ×2", 4214, 193, 7.7, 91, 33], ["Вт", "вода утром", 3437, 167, 6.1, 75, 35], ["Ср", "вода + зал A", 3877, 191, 6.8, 85, 36], ["Чт", "вода + зал C", 3681, 162, 6.8, 79, 35], ["Пт", "вода ×2", 4266, 172, 8.3, 81, 34], ["Сб", "вода + зал B", 3929, 170, 7.5, 75, 34], ["Вс", "отдых", 2703, 152, 3.9, 81, 39]], "avg": {"kcal": 3729, "p": 173, "tee": 4029, "deficit": 300}}, "rules": [["Холодильник или морозилка", "В холодильнике лежит только то, что съедается в течение ≈ 24 часов после готовки. Остальное сразу в морозилку (в течение 60 минут после приготовления). Таблица «Расфасовка» говорит, куда что."], ["Охлаждение", "Не оставляй готовое остывать в мультиварке, кастрюле или на столе больше часа. Рис и макароны тонким слоем на противне, в контейнеры по одной порции: так остывают быстрее. Горячий контейнер в морозилку не ставь: подожди, пока станет тёплым."], ["Размораживание", "Контейнер из морозилки переложи в холодильник: на обед — накануне вечером, на ужин — утром того же дня. Не размораживай на столе."], ["Минтай", "Хранится в морозилке. За ночь до готовки переложи его в холодильник: в пятницу вечером на субботу, в понедельник вечером на вторник. Не размораживай на столе и в тёплой воде."], ["Разогрев", "Один раз, в микроволновке: 1–2 ст. л. воды, крышка с щелью, 2 минуты на 800 Вт, перемешай, ещё 1–2 минуты. Должно парить по всему объёму (≥ 74 °C). Разогретое не убирай обратно: съешь или выбрось."], ["На учёбе", "Утром контейнер из холодильника в термосумку с 2 хладоэлементами (или с 2 замороженными бутылками воды). Готовая еда с мясом, рисом и макаронами не должна стоять без холода дольше 2 часов (USDA); обед в 12:30 при выходе в 06:30 — это 6 часов."], ["Что выбросить", "Контейнер из холодильника старше 24 часов с рисом или макаронами; любой с кислым или необычным запахом; любой, который был разогрет и не съеден."]], "sources": [["FSA (Великобритания), Home food fact checker, обновлено 21.08.2026", "https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker"], ["USDA FSIS, Leftovers and Food Safety", "https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety"], ["FSANZ, Bacillus cereus", "https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/bacteria-foodborne-illness/bacillus-cereus"]], "sourcesNote": "FSA: рис в холодильнике не дольше 1 суток, остужать до часа, греть один раз. USDA: готовые блюда 3–4 суток в холодильнике, 3–4 месяца в морозилке, разогрев до 74 °C. FSANZ: токсин B. cereus образуется и в других крахмалистых блюдах при плохом охлаждении. Правило «24 часа или морозилка» строже USDA."}};
const LS_KEY = 'swimlog.v1';
const DAYMS = 86400000;
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WDN = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* ---------------- утилиты ---------------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / DAYMS);
const weekNo = s => Math.floor(diffDays(s, DATA.start) / 7) + 1;
const weekStart = n => addDays(DATA.start, (n - 1) * 7);
const dayCode = s => WD[parse(s).getDay()];
const today = () => ymd(new Date());
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const num = v => { if (v === '' || v == null) return null; const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : null; };
const fmt = (x, d) => x == null ? '—' : x.toFixed(d == null ? 1 : d).replace('.', ',');
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const dlong = s => { const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const dshort = s => { const d = parse(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
function secStr(t) { // секунды -> м:сс,сс
  if (t == null) return '—'; const m = Math.floor(t / 60), s = t - m * 60;
  return (m ? m + ':' : '') + (s < 10 && m ? '0' : '') + s.toFixed(2).replace('.', ',');
}
function parseTime(str) { // «8:45,09», «8:45.09», «525,09»
  if (!str) return null; const s = String(str).trim().replace(',', '.');
  const m = s.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if (m) return parseInt(m[1], 10) * 60 + parseFloat(m[2]);
  const x = parseFloat(s); return isFinite(x) ? x : null;
}

/* ---------------- хранение ---------------- */
let memOnly = false;
function fresh() {
  return {v: 1, settings: {mode: 'deficit', bw: 85}, days: {'2026-10-17': {rest: true}}, waist: {'2026-10-17': 87}, gym: [], starts: [], tests: [], ui: {},
    food: {shop: {}, cook: {}, calc: {}, chores: {}}};
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const o = JSON.parse(raw); const s = Object.assign(fresh(), o, {settings: Object.assign(fresh().settings, o.settings || {})}); s.food = Object.assign(fresh().food, o.food || {}); return s; }
  } catch (e) { memOnly = true; }
  return fresh();
}
let S = load();
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { if (!memOnly) { memOnly = true; toast('Память браузера недоступна: данные не сохранятся'); } }
}
function persistReq() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} }
const D = date => (S.days[date] = S.days[date] || {});
const hasData = d => d && (d.w != null || d.sleep != null || d.fat != null || d.flag || (d.meals && Object.keys(d.meals).length) || d.note || d.off || (d.sym && Object.keys(d.sym).length) || (d.done && Object.keys(d.done).length));
const NOLOAD = ['A6', 'A7', 'B1', 'B7', 'C1', 'C3', 'C5', 'C6'];   // упражнения без записи веса: отметка «Сделал»

/* ---------------- меню и день ---------------- */
function dayType(date) { const d = S.days[date]; return (d && d.rest) ? 'Вс' : dayCode(date); }
function menuFor(date) { return DATA.menu.days[dayType(date)]; }
function plannedKcal(date) { const m = menuFor(date); return (S.settings.mode === 'maint' && !m.rest) ? m.kcal_maint : m.kcal; }
function menuItems(date) {
  const m = menuFor(date); const out = m.meals.map(x => Object.assign({}, x));
  m.extras.forEach(x => out.push(Object.assign({extra: true}, x)));
  if (S.settings.mode === 'maint' && !m.rest) out.push(Object.assign({extra: true}, DATA.menu.maint_extra));
  return out;
}
function tickedKcal(date) {
  const d = S.days[date] || {}, t = d.meals || {};
  return menuItems(date).reduce((s, x) => s + (t[x.id] ? x.kcal : 0), 0);
}

/* ---------------- вес, недели ---------------- */
function weightsOn(dates) { return dates.map(x => num((S.days[x] || {}).w)).filter(x => x != null); }
function weekDates(n) { const s = weekStart(n); return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(s, i)); }
function weekAvg(n) { const w = weightsOn(weekDates(n)); return w.length >= 4 ? mean(w) : null; }
function movAvg(date) { // среднее за 7 дней, заканчивая date, нужно >=3 значения
  const w = weightsOn([0, 1, 2, 3, 4, 5, 6].map(i => addDays(date, -i))); return w.length >= 3 ? mean(w) : null;
}
function lastWeight() {
  const ds = Object.keys(S.days).filter(k => num(S.days[k].w) != null).sort(); return ds.length ? num(S.days[ds[ds.length - 1]].w) : null;
}
function curBW() { return movAvg(today()) || lastWeight() || S.settings.bw || 85; }

/* ---------------- зал ---------------- */
function e1rm(set, ex) {
  const bw = ex && ex.bw ? curBW() : 0, total = set.w + bw;
  const f = 1 + (set.reps + (set.rpe != null ? 10 - set.rpe : 0)) / 30;
  return {total: total * f, added: total * f - bw};
}
function exInfo(code) { for (const k of ['A', 'B', 'C']) { const x = DATA.sessions[k].find(e => e.code === code); if (x) return Object.assign({sess: k}, x, {bw: !!DATA.lifts.find(l => l[0] === code && l[2])}); } return null; }
function liftBest(code, n) {
  const ex = exInfo(code); const ds = weekDates(n); let best = null;
  S.gym.forEach(g => { if (g.ex === code && ds.indexOf(g.date) >= 0) { const v = e1rm(g, ex); const x = ex.bw ? v.added : v.total; if (best == null || x > best) best = x; } });
  return best;
}
function defaultSession(date) { const c = dayCode(date); return c === 'Ср' ? 'A' : c === 'Сб' ? 'B' : c === 'Чт' ? 'C' : 'A'; }
function blockIdx(n) { return n <= 4 ? 0 : n <= 8 ? 1 : 2; }

/* ---------------- правила недели ---------------- */
function evalWeek(n) {
  const r = {n, avg: weekAvg(n), prev: n > 1 ? weekAvg(n - 1) : null, flags: 0, flagsPrev: 0, signals: [], msgs: []};
  r.delta = (r.avg != null && r.prev != null) ? r.avg - r.prev : null;
  const cnt = k => weekDates(k).reduce((s, x) => s + (((S.days[x] || {}).flag === 'hard') ? 1 : 0), 0);
  r.flags = cnt(n); r.flagsPrev = n > 1 ? cnt(n - 1) : 0;
  const calib = weekStart(n) <= DATA.calibEnd;
  r.calib = calib;
  if (r.flags >= 2 && r.flagsPrev >= 2) r.signals.push('«Тяжелее» два раза в неделю и больше две недели подряд.');
  // сила
  DATA.lifts.forEach(l => { const a = liftBest(l[0], n), b = n > 1 ? liftBest(l[0], n - 1) : null; if (a != null && b != null && a < b * 0.95) r.signals.push('Сила ниже на 5% и больше: ' + l[1] + ' (' + fmt(a) + ' против ' + fmt(b) + ' кг).'); });
  // сон: три ночи подряд меньше 6,5 (последние даты недели)
  const ds = weekDates(n).filter(x => (S.days[x] || {}).sleep != null);
  for (let i = 0; i + 2 < ds.length; i++) { const t = ds.slice(i, i + 3); if (t.every(x => num(S.days[x].sleep) < 6.5) && diffDays(t[2], t[0]) === 2) { r.signals.push('Сон меньше 6,5 часа три ночи подряд.'); break; } }
  // симптомы ЖКТ три дня подряд
  const all = weekDates(n);
  for (let i = 0; i + 2 < all.length; i++) {
    const t = all.slice(i, i + 3);
    if (t.every(x => { const s = (S.days[x] || {}).sym || {}; return s.heart || s.belly; })) { r.signals.push('Изжога или боль в животе три дня подряд.'); break; }
  }
  // быстрое снижение две недели подряд
  if (r.delta != null && r.delta <= -0.6 && n > 2) { const pd = weekAvg(n - 1) != null && weekAvg(n - 2) != null ? weekAvg(n - 1) - weekAvg(n - 2) : null; if (pd != null && pd <= -0.6) r.signals.push('Вес падает быстрее 0,6 кг в неделю две недели подряд.'); }
  // вердикт по весу
  if (r.avg == null) r.msgs.push({t: 'mut', s: 'Мало взвешиваний: нужно 4 в неделю и больше.'});
  else if (r.delta == null) r.msgs.push({t: 'mut', s: 'Нет среднего прошлой недели для сравнения.'});
  else if (calib) r.msgs.push({t: 'mut', s: 'Калибровка: решения по весу с 02.11. Изменение ' + (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг.'});
  else if (r.delta <= -0.6) r.msgs.push({t: 'bad', s: 'Быстрее лимита (' + fmt(r.delta, 2) + ' кг). Добавь блок А в М6 с понедельника по субботу.'});
  else if (r.delta <= -0.1) r.msgs.push({t: 'ok', s: 'По плану: ' + fmt(r.delta, 2) + ' кг за неделю.'});
  else if (r.delta <= 0.5) { const pd = n > 2 && weekAvg(n - 1) != null && weekAvg(n - 2) != null ? weekAvg(n - 1) - weekAvg(n - 2) : null; r.msgs.push(pd != null && pd > -0.1 ? {t: 'warn', s: 'Вес не падает две недели подряд. Сам еду не урезай: пришли данные, пересчитаю расход.'} : {t: 'warn', s: 'Вес почти не меняется (' + (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг). Ещё неделя наблюдения.'}); }
  else r.msgs.push({t: 'warn', s: 'Вес растёт больше 0,5 кг. Проверь условия взвешивания, потом пришли данные.'});
  return r;
}

/* ---------------- вкладка «Еда» ---------------- */
const FD = DATA.food;

const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const T_MORNING = 6 * 60 + 30, T_EVENING = 20 * 60 + 30;
const isCookDay = s => { const w = parse(s).getDay(); return s >= FD.firstCook && (w === 6 || w === 2); };
function cookOnOrAfter(s) { if (s < FD.firstCook) return FD.firstCook; for (let i = 0; i < 8; i++) { if (isCookDay(s)) return s; s = addDays(s, 1); } return FD.firstCook; }
function cookOnOrBefore(s) { for (let i = 0; i < 8; i++) { if (s < FD.firstCook) return FD.firstCook; if (isCookDay(s)) return s; s = addDays(s, -1); } return FD.firstCook; }
const sessKey = s => s === FD.firstCook ? 'A1' : (parse(s).getDay() === 6 ? 'A' : 'B');

const calFor = s => FD.cal.first[s] || FD.cal.std[dayCode(s)];

/* вес компонента в контейнере по введённому общему готовому весу: вес по плану × (вышло ÷ по плану всего) */
function weightOf(sess, p, vals) {
  const tot = (sess.totals.find(t => t[0] === p[0]) || [])[2], v = num((vals || {})[p[0]]);
  return (tot && v != null && v > 0) ? Math.round(p[2] * v / tot) : null;
}

  return esc(parts.join(', ') + (co.oil ? ', масло ' + co.oil + ' г' : '') + (co.bread ? ', хлеб ' + co.bread + ' г отдельно' : ''));

/* ---- дела на дату, по времени ---- */
function choreItems(date) {
  const c = calFor(date), nx = calFor(addDays(date, 1)), items = [];
  const add = (t, id, html, go) => items.push({t, id, html, go});
  if (c.m1 === 'oats') add(6 * 60 + 15, 'm1', '<b>Завтрак</b> · овсянка из банки (она с вечера в холодильнике): 1 минута в микроволновке, банан и мёд');
  else if (c.m1 === 'omelet') add(6 * 60 + 15, 'm1', '<b>Завтрак</b> · омлет из 3 яиц, 7 минут', 'rec');
  else add(9 * 60, 'm1', '<b>Завтрак</b> · омлет с беконом и сыром, 10 минут', 'rec');
  if (c.shop) { const tr = FD.trips[c.shop]; add(toMin(tr.shop), 'shop', `<b>Магазин</b> · список в «Покупки», ≈ ${tr.grand} ₽`, 'shop'); }
  if (c.cook) { const s = FD.sessions[c.cook]; add(toMin(s.start), 'cook', `<b>Готовка</b> ${esc(s.start)}–${esc(s.end)} · шаги и рецепты в «Готовка»`, 'cook'); }
  c.events.forEach(ev => {
    const co = FD.sessions[ev[5]].containers.find(x => x.label === ev[1]);
    if (ev[2] === 'Z' && ev[0] === 'ужин') add(T_MORNING, 'm-' + ev[1], `Достань из морозилки в холодильник «${esc(ev[1])}» (на ужин)`);
    if (ev[0] === 'обед' && ev[2] !== 'fresh' && dayCode(date) !== 'Вс') add(T_MORNING, 'b-' + ev[1], `Положи «${esc(ev[1])}» в термосумку (обед на учёбе)`);
    add(toMin(ev[3]), 'e-' + ev[1], `<b>${esc(cap(ev[0]))}</b> · «${esc(ev[1])}» ${storeChip(ev[2])}<div class="xs mut">${co ? contHtml(FD.sessions[ev[5]], co) : ''}</div>`);

  if (nx.m1 === 'oats') add(T_EVENING, 'jar', 'Сделай банку овсянки на утро: хлопья 100 г, молоко 200 мл, щепотка соли; закрой и в холодильник', 'rec');

}

const FOOD_HELP = {plan: 'Что сделать сегодня по еде, по времени. Нажимай на строку, когда сделал.', cook: 'Шаги по минутам. Рецепт раскрывается внутри шага. В конце раскладка по контейнерам.',

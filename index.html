asta", "макароны", 200, 460], ["potato", "картофель", 100, 85], ["chicken", "курица", 130, 95], ["veg", "овощи", 150, 150]], "oil": 15, "bread": 0}, {"label": "Вт обед", "day": "Вт", "date": "2027-02-02", "kind": "обед", "time": "12:30", "store": "Z", "age": 71.5, "thaw": "Пн вечером", "parts": [["buckwheat", "гречка", 110, 275], ["potato", "картофель", 150, 130], ["chicken", "курица", 130, 95], ["veg", "овощи", 150, 150]], "oil": 15, "bread": 60}, {"label": "Вт ужин", "day": "Вт", "date": "2027-02-02", "kind": "ужин", "time": "19:15", "store": "Z", "age": 78.2, "thaw": "Вт утром", "parts": [["rice", "рис", 110, 295], ["potato", "картофель", 200, 170], ["chicken", "курица", 130, 95], ["veg", "овощи", 150, 150]], "oil": 15, "bread": 0}], "totals": [["rice", "рис", 520, 1405], ["buckwheat", "гречка", 220, 550], ["pasta", "макароны", 300, 690], ["potato", "картофель", 650, 550], ["chicken", "курица", 780, 560], ["pollock", "минтай", 360, 280], ["veg", "овощи", 1200, 1200]], "tl": "310138e8", "prep": "1ebefb7b", "rc": {"chicken": "de3bd505", "veg": "ac2a214b", "rice": "c57e112e", "buckwheat": "ad5275f1", "pasta": "0c3515a3", "potato": "8d65610c", "fish": "048c4312", "sauce_k": "2dc01b29", "sauce_t": "ecc99e02", "omelet_rest": "bc7256a2", "omelet": "480cc887", "oats": "6e698e37"}, "recipeSeq": [["chicken", 3], ["veg", 8], ["rice", 15], ["potato", 20], ["sauce_k", 35], ["sauce_t", 35], ["fish", 40], ["buckwheat", 95], ["pasta", 125]], "daily": ["omelet_rest", "omelet", "oats"]}}, "pool": {"tl": {"955aa8d2": [[0, "Старт", "Духовка 200 °C (верх и низ; с конвекцией 180 °C). Минтай в закрытом пакете в миску с холодной водой на 40–60 минут, воду меняй раз в 15 минут. Взвесь продукты. Для сырой курицы отдельная доска.", []], [5, "Маринад", "Смешай маринад, курицу обсуши и выложи в него. Руки с мылом.", ["chicken"]], [10, "Рис", "Промой, в чашу мультиварки с водой и солью, программа «Рис». Дальше не трогай.", ["rice"]], [15, "Рагу, часть 1", "Лук, морковь, томатная паста, паприка, лавр, вода. Крышка, средний огонь, 10–12 минут.", ["veg"]], [25, "Духовка: курица и картофель", "Курица на противне с пергаментом в духовку на 25–30 минут. Рядом на втором противне картофель дольками: 30–35 минут, на 15-й минуте переверни.", ["potato"]], [30, "Рагу, часть 2", "Добавь кабачок и цветную капусту, посоли, крышка, 15–20 минут.", []], [35, "Гречка", "Вода, крупа, соль, кипение без крышки; потом крышка, минимальный огонь, 15–18 минут.", ["buckwheat"]], [45, "Соусы", "Кефирный соус (5 минут, без плиты) и томатный (ковшик, 6–8 минут). Разложи в банки.", ["sauce_k", "sauce_t"]], [50, "Духовка: рыба", "Курицу достань, проверь готовность. Рыбу заверни в конверты и поставь на её место: 200 °C, 15–18 минут. Картофель, если ещё не готов, остаётся.", ["fish"]], [55, "Рис готов", "Выложи рис из чаши (и из кастрюли) на противень тонким слоем, «подогрев» выключи. Рагу сними с огня, лавр выбрось (укроп добавь, если есть).", []], [60, "Макароны", "Вода с солью (4 л), на 1 минуту меньше времени на пачке, холодная вода, на противень.", ["pasta"]], [70, "Свежая порция", "Рыбу достань и собери порцию «Сб обед» на тарелку: рис ≈ 270 г, минтай ≈ 140 г, рагу 150 г, масло 10 г, соус. Ешь горячим.", []], [80, "Взвесь и раздели", "Взвесь каждый готовый компонент целиком (рис, гречка, макароны, курица, рыба без сока, овощи, картофель). Расфасуй по контейнерам по таблице расфасовки, подписав каждый.", []], [95, "Охлаждение", "Контейнеры без крышек поставь в таз с холодной водой на 10–15 минут, пока не станут тёплыми. Горячим в морозилку не ставь.", []], [105, "Холодильник, морозилка, уборка", "Закрой крышками. «Холодильник» в холодильник, «морозилка» в морозилку, баночки с соусами в холодильник. Всё готовое убрано не позже 60 минут после того, как рис вышел из мультиварки. Потом посуда.", []]], "c8294914": [[0, "Старт", "Духовку на 200 °C (верх и низ; с конвекцией 180 °C), прогрев ≈ 20 минут. Взвесь продукты. На стол: миска, сито, доска с ножом, чайник, 2 противня, 6–8 листов пергамента. Сырую курицу режь на листе пергамента.", []], [3, "Маринад для курицы", "Курицу обсуши и подрежь на листе пергамента, смешай маринад в миске, выложи курицу, перемешай руками. Руки и нож с мылом.", ["chicken"]], [8, "Овощи: нарезка", "Нарежь все овощи для корзины (≈ 550 г).", ["veg"]], [15, "Рис и овощи", "Рис 110 г: промой в сите. В чашу: рис, вода 200 мл, соль ¼ ч. л. Размешай, выровняй. Сверху корзина с овощами (≈ 550 г сырых), закрой крышку. Программа «Рис» или «Крупа» (30–40 минут), крышку не открывай.", ["rice"]], [20, "Курица и картофель в духовку", "Духовка прогрета. Противень №1 (пергамент) с курицей в духовку на 25–30 минут. Картофель: нарежь дольками 2 см с кожурой, обсуши, на противень №2 (пергамент, один слой, соль, паприка), в духовку на 35–40 минут, на 20-й минуте переверни.", ["potato"]], [48, "Курица готова", "Достань противень №1, проверь курицу (≥ 74 °C внутри), выложи куски на пергамент. Картофель переверни. ", []], [55, "Гречка", "Из чаши: рис на лист пергамента слоем 2 см, овощи из корзины на отдельный лист. Чашу и корзину ополосни. Гречка 110 г: переберись и промой. В чашу: крупа, вода 275 мл, соль ¼ ч. л. Размешай. Программа «Гречка» или «Крупа» (25–30 минут), крышку не открывай.", ["buckwheat"]], [68, "Духовка: готово", "Достань картофель с противня №2, выложи остывать на пергамент. Духовку выключи.", []], [85, "Макароны", "Включи чайник заранее. Из чаши: гречку на лист пергамента слоем 2 см. Чашу и корзину ополосни. Макароны 200 г: в чашу макароны, соль 1 ч. л. и горячая вода из чайника, чтобы покрыла на 2 см (≈ 700 мл, не выше 2/3 чаши). Программа «Макароны» или «Варка» на 1 минуту меньше времени на пачке (8–10 минут), крышка закрыта.", ["pasta"]], [97, "Взвесь и раздели", "Последний заход, из чаши: макароны слей в сито, ополосни холодной водой 30 секунд, стряхни и выложи на пергамент. Чашу и корзину ополосни. Взвесь каждый готовый компонент целиком (рис, гречка, макароны, курица, рыба без сока, овощи, картофель). Расфасуй по контейнерам по таблице расфасовки, подписав каждый.", []], [115, "Охлаждение", "Контейнеры без крышек поставь в таз с холодной водой на 10–15 минут, пока не станут тёплыми. Горячим в морозилку не ставь.", []], [125, "Холодильник, морозилка, уборка", "Закрой крышками. «Холодильник» в холодильник, «морозилка» в морозилку, баночки с соусами в холодильник. Мыть: чаша, корзина, миска, сито, доска, нож. Пергамент и фольгу выброси.", []]], "26c431f8": [[0, "Старт", "Духовку на 200 °C (верх и низ; с конвекцией 180 °C), прогрев ≈ 20 минут. Минтай достань из холодильника (с вечера он лежит там, разморожен). Взвесь продукты. На стол: миска, сито, доска с ножом, чайник, 2 противня, 6–8 листов пергамента. Сырую курицу режь на листе пергамента.", []], [3, "Маринад для курицы", "Курицу обсуши и подрежь на листе пергамента, смешай маринад в миске, выложи курицу, перемешай руками. Руки и нож с мылом.", ["chicken"]], [8, "Овощи: нарезка", "Нарежь овощи для первого захода (≈ 700 г, в тех же долях морковь, кабачок, капуста). Остальное нарежешь позже.", ["veg"]], [15, "Рис и овощи (1 из 2)", "Рис 415 г: промой в сите. В чашу: рис, вода 745 мл, соль 1¼ ч. л. Размешай, выровняй. Сверху корзина с овощами (часть 1 из 2, ≈ 700 г сырых), закрой крышку. Программа «Рис» или «Крупа» (30–40 минут), крышку не открывай.", ["rice"]], [20, "Курица и картофель в духовку", "Духовка прогрета. Противень №1 (пергамент) с курицей в духовку на 25–30 минут. Картофель: нарежь дольками 2 см с кожурой, обсуши, на противень №2 (пергамент, один слой, соль, паприка), в духовку на 35–40 минут, на 20-й минуте переверни. На противень не больше 900 г: остальные 200 г нарежешь позже.", ["potato"]], [28, "Овощи для остальных заходов: нарезка", "Нарежь оставшиеся овощи и раздели по весу на 1 часть (≈ 700 г каждая). Убери в миску или на доску под полотенце до своего захода.", []], [35, "Соусы в банках", "Кефирный и томатный соус делаются прямо в банках, без плиты, 5 минут. Закрой и убери в холодильник.", ["sauce_k", "sauce_t"]], [40, "Рыба и остаток картофеля: подготовка", "Пока доходит курица: заверни рыбу в конверты из фольги по рецепту, нарежь оставшийся картофель (200 г дольками 2 см), соль и паприка. Конверты и картофель положи на лист пергамента рядом с духовкой.", ["fish"]], [48, "Курица готова, рыба в духовку", "Достань противень №1, проверь курицу (≥ 74 °C внутри), выложи куски на пергамент. Картофель переверни. На освободившийся противень №1 (чистый пергамент) поставь конверты с рыбой и выложи оставшийся картофель: 200 °C, рыба 15–18 минут, картофель 35 минут.", []], [55, "Рис и овощи (2 из 2)", "Из чаши: рис на лист пергамента слоем 2 см, овощи из корзины на отдельный лист. Чашу и корзину ополосни. Рис 415 г: промой в сите. В чашу: рис, вода 745 мл, соль 1¼ ч. л. Размешай, выровняй. Сверху корзина с овощами (часть 2 из 2, ≈ 700 г сырых), закрой крышку. Программа «Рис» или «Крупа» (30–40 минут), крышку не открывай.", []], [68, "Рыба и картофель готовы", "Достань рыбу (конверты не раскрывай до взвешивания) и картофель с противня №2, выложи остывать на пергамент. Картофель на противне №1 допекается ещё.", []], [70, "Свежая порция", "Рыбу достань и собери порцию «Чт обед» на тарелку: рис ≈ 295 г, минтай ≈ 140 г, овощи 150 г, масло 15 г, соус, хлеб 60 г. Ешь горячим.", []], [75, "Остывший лист в холодильник", "Лист с крупой и овощами первого захода лежит уже ≈ 20 минут и остыл. Переложи его вместе с пергаментом на свободный противень и убери в холодильник до фасовки. Не помещается — оставь на столе, не накрывая. Фасовать из холодного так же удобно.", []], [86, "Остаток картофеля готов", "Достань противень №1 и выложи картофель остывать на пергамент. Духовку выключи.", []], [95, "Макароны", "Включи чайник заранее. Из чаши: рис на лист пергамента слоем 2 см, овощи из корзины на отдельный лист. Чашу и корзину ополосни. Макароны 100 г: в чашу макароны, соль ½ ч. л. и горячая вода из чайника, чтобы покрыла на 2 см (≈ 350 мл, не выше 2/3 чаши). Программа «Макароны» или «Варка» на 1 мину ходов: нарезка", "Нарежь оставшиеся овощи и раздели по весу на 1 часть (≈ 700 г каждая). Убери в миску или на доску под полотенце до своего захода.", []], [35, "Соусы в банках", "Кефирный и томатный соус делаются прямо в банках, без плиты, 5 минут. Закрой и убери в холодильник.", ["sauce_k", "sauce_t"]], [40, "Рыба и остаток картофеля: подготовка", "Пока доходит курица: заверни рыбу в конверты из фольги по рецепту, нарежь оставшийся картофель (300 г дольками 2 см), соль и паприка. Конверты и картофель положи на лист пергамента рядом с духовкой.", ["fish"]], [45, "Рис и овощи (1 из 2)", "Из чаши: гречку на лист пергамента слоем 2 см, овощи из корзины на отдельный лист. Чашу и корзину ополосни. Рис 365 г: промой в сите. В чашу: рис, вода 655 мл, соль 1¼ ч. л. Размешай, выровняй. Сверху корзина с овощами (часть 2 из 2, ≈ 700 г сырых), закрой крышку. Программа «Рис» или «Крупа» (30–40 минут), крышку не открывай.", ["rice"]], [48, "Курица готова, рыба в духовку", "Достань противень №1, проверь курицу (≥ 74 °C внутри), выложи куски на пергамент. Картофель переверни. На освободившийся противень №1 (чистый пергамент) поставь конверты с рыбой и выложи оставшийся картофель: 200 °C, рыба 15–18 минут, картофель 35 минут.", []], [68, "Рыба и картофель готовы", "Достань рыбу (конверты не раскрывай до взвешивания) и картофель с противня №2, выложи остывать на пергамент. Картофель на противне №1 допекается ещё.", []], [70, "Свежая порция", "Рыбу достань и собери порцию «Ср обед» на тарелку: гречка ≈ 275 г, минтай ≈ 140 г, овощи 150 г, масло 15 г, соус, хлеб 60 г. Ешь горячим.", []], [75, "Остывшие листы в холодильник", "Листы с крупой и овощами первых заходов лежат уже ≈ 30 минут и остыли. Переложи их вместе с пергаментом на свободные противни и убери в холодильник до фасовки. Не помещается — оставь на столе, не накрывая. Фасовать из холодного так же удобно.", []], [85, "Рис (2 из 2)", "Из чаши: рис на лист пергамента слоем 2 см, овощи из корзины на отдельный лист. Чашу и корзину о  "Лист с крупой и овощами первого захода лежит уже ≈ 20 минут и остыл. Переложи его вместе с пергаментом на свободный противень и убери в холодильник до фасовки. Не помещается — оставь на столе, не накрывая. Фасовать из холодного так же удобно.", []], [85, "Макароны (1 из 2)", "Включи чайник заранее. Из чаши: гречку на лист пергамента слоем 2 см, овощи из корзины на отдельный лист. Чашу и корзину ополосни. Макароны 250 г: в чашу макароны, соль 1¼ ч. л. и горячая вода из чайника, чтобы покрыла на 2 см (≈ 875 мл, не выше 2/3 чаши). Программа «Макароны» или «Варка» на 1 минуту меньше времени на пачке (8–10 минут), крышка закрыта.", ["pasta"]], [97, "Макароны (2 из 2)", "Из чаши: макароны слей в сито, ополосни холодной водой 30 секунд, стряхни и выложи на пергамент. Чашу и корзину ополосни. Макароны 250 г: в чашу макароны, соль 1¼ ч. л. и горячая вода из чайника, чтобы покрыла на 2 см (≈ 875 мл, не выше 2/3 чаши). Программа «Макароны» или «Варка» на 1 минуту меньше времени на пачке (8–10 минут), крышка закрыта.", []], [109, "Взвесь и раздели", "Последний заход, из чаши: макароны слей в сито, ополосни холодной водой 30 секунд, стряхни и выложи на пергамент. Чашу и корзину ополосни. Взвесь каждый готовый компонент целиком (рис, гречка, макароны, курица, рыба без сока, овощи, картофель). Расфасуй по контейнерам по таблице расфасовки, подписав каждый.", []], [127, "Охлаждение", "Контейнеры без крышек поставь в таз с холодной водой на 10–15 минут, пока не станут тёплыми. Горячим в морозилку не ставь.", []], [137, "Холодильник, морозилка, уборка", "Закрой крышками. «Холодильник» в холодильник, «морозилка» в морозилку, баночки с соусами в холодильник. Мыть: чаша, корзина, миска, сито, доска, нож. Пергамент и фольгу выброси.", []]]}, "rc": {"1fa2ba51": {"title": "Курица, запечённая в кефирном маринаде", "sub": "650 г сырого филе бедра → ≈ 470 г готового, 5 порций по 130 г сырого", "items": ["куриное филе бедра (без кожи и кости) 650 г", "кефир 100 мл", "чеснок 2 зубчика", "паприка сладкая молотая 1½ ч. л.", "орегано или итальянские травы 1 ч. л.", "соль 1 ч. л. (≈ 6 г)", "чёрный перец молотый ¼ ч. л. (по желанию)"], "steps": ["Достань курицу из холодильника, обсуши бумажным полотенцем, срежь лишний жир и плёнки.", "В миске смешай кефир, чеснок (раздави или потри на мелкой тёрке), паприку, травы, соль и перец. Выложи курицу, перемешай руками, закрой. Маринад работает от 30 минут; если мариновал с вечера в холодильнике, мясо мягче.", "Противень застели пергаментом. Куски выложи на расстоянии 1–2 см, избыток маринада стряхни.", "Духовка 200 °C (верх и низ), середина. 25–30 минут. Готово, когда в самом толстом куске не меньше 74 °C (бедро мягче при 80 °C) или на разрезе нет розового и сок прозрачный.", "Дай постоять 5 минут. Не мой сырую курицу под краном: брызги разносят бактерии. После неё мой руки, доску и нож с мылом."], "notes": ["Бедро с кефирным маринадом остаётся сочным и после разогрева. Грудка в плане не используется."]}, "8787d2e5": {"title": "Минтай в фольге с лимоном и укропом", "sub": "360 г сырого филе → ≈ 280 г готового, 2 конверта по 180 г", "items": ["минтай, филе 360 г (разморозь)", "лимон 2 шт: 4 тонких кружка и сок остального", "укроп 2 веточки", "лук репчатый 30 г кольцами", "соль ½ ч. л.", "фольга"], "steps": ["Разморозка: в холодильнике с вечера или в закрытом пакете в миске с холодной водой 40–60 минут (воду меняй каждые 15 минут). Не размораживай в тёплой воде и на столе.", "Филе обсуши. На лист фольги 30×30 см положи кольца лука, на них 180 г рыбы, посоли, сверху лимон и укроп.", "Заверни конвертом, швы наверх, чтобы сок не вытек.", "200 °C, 15–18 минут. Готово, когда мякоть белая, непрозрачная и расслаивается вилкой.", "Рыбу выложи вместе с соком из фольги (1–2 ст. л.): сок удерживает влагу при разогреве."], "notes": ["Минтай постный (0,9% жира): жир приходит из масла и соуса при разогреве. Рыба в плане стоит в первые сутки после готовки, дальше курица."]}, "a2438b1a": {"title": "Рис в мультиварке", "sub": "200 г сухого → ≈ 540 г готового", "items": ["рис длиннозёрный шлифованный (не пропаренный, не круглый) 200 г", "вода 360 мл (1 г риса : 1,8 мл воды)", "соль ¾ ч. л."], "steps": ["Промой рис в сите холодной водой 4–5 раз, пока вода почти не станет прозрачной.", "В чашу: рис, вода, соль. Размешай, выровняй.", "Программа «Рис» или «Крупа» (обычно 30–40 минут). Нет такой — «Плов» или «Каша». Крышку не открывай.", "После сигнала подожди 5–10 минут, затем сразу выложи рис из чаши на противень или широкое блюдо тонким слоем. Отключи «подогрев»: рис нельзя оставлять в мультиварке остывать.", "Остынет за 15–20 минут. Взвесь весь готовый рис."], "notes": ["Первая партия калибрует воду: рис твёрдый — в следующий раз воды на 10% больше; каша — на 10% меньше.", "FSA: варёный рис остужать до часа, в холодильнике не дольше суток, греть один раз до пара."]}, "3240043e": {"title": "Гречка рассыпчатая", "sub": "220 г сухой → ≈ 550 г готовой", "items": ["гречка ядрица 220 г", "вода 550 мл (на 100 г крупы 250 мл)", "соль ½ ч. л."], "steps": ["Пересыпь гречку на тарелку, убери тёмные зёрна и шелуху. Промой в сите.", "В кастрюлю с толстым дном: крупа, холодная вода, соль. Доведи до кипения без крышки.", "Накрой крышкой, минимальный огонь, 15–18 минут, не мешай и не открывай.", "Вся вода впиталась — выключи, накрой полотенцем на 10 минут. Потом выложи на противень тонким слоем остывать."], "notes": ["Вода осталась, а крупа готова — слей. Вода выкипела, а крупа жёсткая — добавь 50 мл кипятка и держи под крышкой 5 минут."]}, "a8ad1c4c": {"title": "Макароны (al dente)", "sub": "400 г сухих → ≈ 920 г готовых", "items": ["макароны из твёрдой пшеницы 400 г", "вода 4 л (1 л на 100 г)", "соль 4 ч. л. (1 ч. л. на литр)"], "steps": ["Кастрюля от 4 л (на 200 г хватит 2 л); если меньше, вари в два захода.", "Воду посоли, доведи до кипения, засыпь макароны, размешай.", "Вари на 1 минуту меньше, чем написано на пачке: при разогреве доварятся.", "Слей в дуршлаг, ополосни холодной водой 30 секунд, чтобы остановить варку и охладить. Стряхни воду, выложи на противень тонким слоем."], "notes": ["Масло в макароны не добавляй: оно уже в плане и кладётся в контейнер при сборке."]}, "0dd57352": {"title": "Картофель, запечённый дольками", "sub": "250 г сырого → ≈ 210 г готового", "items": ["картофель 250 г", "соль и паприка сладкая по вкусу"], "steps": ["Картофель вымой щёткой. Нарежь дольками толщиной 2 см вместе с кожурой, обсуши полотенцем.", "Противень застели пергаментом. Выложи дольки в один слой, посоли, посыпь паприкой.", "200 °C, 30–35 минут, на 15-й минуте переверни. Готово, когда мягко внутри и подрумянено по краям."], "notes": ["До 500 г — запеки (вкуснее), больше — отвари (не занимает духовку)."]}, "bff7e38f": {"title": "Овощное рагу", "sub": "≈ 1050 г готового (по 150 г в контейнер); сырых овощей нужно больше, потому что они уваривают", "items": ["морковь 400 г", "кабачок 500 г", "цветная капуста замороженная 400 г", "лук репчатый 100 г", "томатная паста 30 г", "паприка сладкая 1 ч. л.", "лавровый лист 2 шт", "соль 1 ч. л.", "вода 120 мл", "укроп 10 г (если есть)"], "steps": ["Нарежь: лук мелко, морковь кружками 0,5 см, кабачок кубиками 2 см. Цветную капусту не размораживай, раздели на соцветия.", "В широкую кастрюлю с толстым дном: лук, морковь, томатная паста, паприка, лавровый лист, вода. Крышка, средний огонь, 10–12 минут.", "Добавь кабачок и цветную капусту, посоли, перемешай. Крышка, 15–20 минут, один раз перемешай.", "Последние 3–5 минут без крышки, чтобы выкипела лишняя вода. Лавровый лист выбрось, добавь укроп, если он есть.", "Остуди на противне или в широкой миске. Взвесь: должно получиться ≈ 1050 г"], "notes": ["Масла в рагу нет: оно в плане отдельно (по 10–15 г на контейнер)."]}, "bc7256a2": {"title": "Омлет с беконом и сыром (М1 в дни отдыха)", "sub": "4 яйца, бекон 30 г, сыр 20 г, хлеб 80 г; 10 минут", "items": ["яйца 4 шт (200 г)", "бекон 30 г", "сыр 20 г", "хлеб 80 г (3 ломтика)", "соль щепотка"], "steps": ["Бекон нарежь полосками 1 см, выложи на холодную антипригарную сковороду, средний огонь, 2–3 минуты, пока не вытопится жир. Масла не добавляй.", "Яйца взбей вилкой с солью. Влей на сковороду на беконе, огонь слабый.", "Через 2 минуты посыпь тёртым сыром, накрой крышкой на 3–4 минуты, пока не схватится. Подавай с хлебом."], "notes": ["При изжоге бекон убери (в плане он раз в неделю)."]}, "480cc887": {"title": "Омлет (М1 в понедельник и среду)", "sub": "3 яйца, молоко 50 мл; 7 минут", "items": ["яйца 3 шт (150 г)", "молоко 2,5% 50 мл", "соль щепотка", "по желанию зелень"], "steps": ["Взбей яйца с молоком и солью вилкой.", "Антипригарная сковорода с крышкой, огонь слабый, без масла. Влей смесь, накрой крышкой на 5–6 минут, пока верх не схватится.", "Ешь с хлебом 100 г и бананом (по плану)."], "notes": ["Единственное, что готовится утром. Всё остальное из контейнеров."]}, "6e698e37": {"title": "Овсянка в банке (М1 во вторник, четверг, пятницу, субботу)", "sub": "вечером накануне, 2 минуты", "items": ["овсяные хлопья 100 г (обычные, не быстрого приготовления)", "молоко 2,5% 200 мл", "щепотка соли, корица по желанию", "утром: банан 120 г, мёд 15 г"], "steps": ["Вечером в банку или контейнер 0,5 л: хлопья, молоко, соль. Размешай, закрой, убери в холодильник.", "Утром разогрей 1 минуту в микроволновке (или ешь холодной). Добавь нарезанный банан и мёд."], "notes": ["Хранится в холодильнике до утра следующего дня; на несколько дней вперёд не готовь."]}, "f1989b4b": {"title": "Соус кефирно-чесночный (кислый, свежий)", "sub": "≈ 250 г, 6–7 порций по 40 г; в холодильнике 3 дня", "items": ["кефир 1% 220 мл", "чеснок 2 зубчика", "укроп 20 г", "лимонный сок 2 ч. л.", "соль ¼ ч. л.", "чёрный перец (по желанию)"], "steps": ["Чеснок раздави, укроп мелко нарежь. Смешай всё с кефиром, посоли.", "Переложи в банку, убери в холодильник. Клади 1–2 ст. л. на контейнер после разогрева."], "notes": ["≈ 10 ккал на порцию; в плане калории соусов не учтены (это в пределах точности расчёта)."]}, "130c2897": {"title": "Соус томатно-паприковый (кисло-острый)", "sub": "≈ 170 г, 6–7 порций по 25–30 г; в холодильнике 4 дня", "items": ["томатная паста 60 г", "вода 150 мл", "паприка сладкая 1 ч. л.", "чеснок 1 зубчик", "мёд 1 ч. л.", "лимонный сок или уксус 9% 1 ч. л.", "перец чили хлопья ¼ ч. л. (для острого, по желанию)", "соль ¼ ч. л."], "steps": ["В ковшик: паста, вода, паприка, чеснок (раздави), мёд, соль, чили. Размешай до однородности.", "Доведи до кипения, на слабом огне 6–8 минут под неплотной крышкой, пока не загустеет.", "Добавь лимонный сок, остуди, перелей в банку. Клади 1–2 ст. л. на рыбу, рис, картофель."], "notes": ["≈ 10 ккал на порцию, не учтено. Остроту регулируй чили: без чили соус просто кисло-сладкий."]}, "e55bd1e8": {"title": "Курица, запечённая в кефирном маринаде", "sub": "390 г сырого филе бедра → ≈ 280 г готового, 3 порции по 130 г сырого", "items": ["куриное филе бедра (без кожи и кости) 390 г", "кефир 60 мл", "чеснок 2 зубчика", "паприка сладкая молотая 1 ч. л.", "орегано или итальянские травы ½ ч. л.", "соль ½ ч. л. (≈ 4 г)", "чёрный перец молотый ¼ ч. л. (по желанию)"], "steps": ["Достань курицу из холодильника. Выложи на лист пергамента (не на доску для овощей), обсуши бумажным полотенцем, срежь лишний жир и плёнки.", "В миске смешай кефир, чеснок (раздави или потри на мелкой тёрке), паприку, травы, соль и перец. Выложи курицу, перемешай руками, закрой. Маринад работает от 15 минут; чем дольше, тем мягче мясо.", "Противень №1 застели пергаментом. Куски выложи на расстоянии 1–2 см, избыток маринада стряхни.", "Духовка 200 °C (верх и низ), середина. 25–30 минут. Готово, когда в самом толстом куске не меньше 74 °C (бедро мягче при 80 °C) или на разрезе нет розового и сок прозрачный.", "Выложи куски на лист пергамента, дай постоять 5 минут. Не мой сырую курицу под краном: брызги разносят бактерии. После неё мой руки, нож и миску с мылом."], "notes": ["Бедро с кефирным маринадом остаётся сочным и после разогрева. Грудка в плане не используется."]}, "1c0b856c": {"title": "Овощи на пару в корзине мультиварки", "sub": "≈ 450 г готовых (по 150 г в контейнер); сырых 550 г; в корзину одним заходом", "items": ["морковь 200 г", "кабачок 200 г", "цветная капуста замороженная 150 г", "соль ½ ч. л. на всё", "укроп 10 г (если есть)"], "steps": ["Нарежь крупно, чтобы выдержали 30–40 минут над крупой: морковь кружками 1 см, кабачок кубиками 3 см. Цветную капусту не размораживай, раздели на соцветия.", "Овощи в корзину, слегка посоли. Корзину поставь над чашей с крупой (или с 500 мл воды, если заход «Пар»), закрой крышку.", "Готовы, когда вилка легко входит в морковь (на крупе это 30–40 минут). Выложи овощи на лист пергамента слоем 2 см остывать.", "Укроп добавь, если есть. Вес готовых овощей со всех заходов вместе должен получиться ≈ 450 г: взвесь при фасовке."], "notes": ["Корзина не вмещает ≈ 550 г: раздели овощи на большее число частей; каждый лишний заход «Пар» занимает 25 минут.", "Инструкция мультиварки запрещает корзину на программе «Рис» или «Гречка»: пускай овощи отдельными заходами «Пар» (25 минут каждый), общее время вырастет.", "Масла в овощах нет: оно в плане отдельно (10–15 г на контейнер). Вкус дают соусы из банок."]}, "aba51133": {"title": "Рис в мультиварке", "sub": "110 г сухого → ≈ 295 г готового; в чаше 3 л до ≈ 420 г сухого за заход", "items": ["рис длиннозёрный шлифованный (не пропаренный, не круглый) 110 г", "вода 200 мл (1 г риса : 1,8 мл воды)", "соль ¼ ч. л."], "steps": ["Промой рис в сите холодной водой 4–5 раз, пока вода почти не станет прозрачной.", "В чашу: рис, вода, соль. Размешай, выровняй. Сверху корзина с овощами, если она назначена на этот заход.", "Программа «Рис» или «Крупа» (30–40 минут). Нет такой — «Плов» или «Каша». Крышку не открывай.", "После сигнала подожди 5 минут, затем сразу выложи рис из чаши на лист пергамента слоем 2 см и не накрывай. «Подогрев» выключи: рис нельзя оставлять в мультиварке остывать.", "Остынет за 15–20 минут. Для фасовки взвесь весь рис вместе (все заходы)."], "notes": ["Первая партия калибрует воду: рис твёрдый — в следующий раз воды на 10% больше; каша — на 10% меньше.", "FSA: варёный рис остужать до часа, в холодильнике не дольше суток, греть один раз до пара."]}, "ee586ee3": {"title": "Гречка рассыпчатая в мультиварке", "sub": "110 г сухой → ≈ 275 г готовой", "items": ["гречка ядрица 110 г", "вода 275 мл (на 100 г крупы 250 мл)", "соль ¼ ч. л."], "steps": ["Пересыпь гречку на тарелку, убери тёмные зёрна и шелуху. Промой в сите.", "В чашу: крупа, холодная вода, соль. Размешай. Сверху корзина с овощами, если она назначена на этот заход.", "Программа «Гречка» или «Крупа» (25–30 минут). Крышку не открывай.", "После сигнала подожди 5 минут и выложи гречку на лист пергамента слоем 2 см остывать."], "notes": ["Вода осталась, а крупа готова — слей. Крупа жёсткая, воды нет — добавь 50 мл кипятка и ещё 5 минут «Подогрев»."]}, "496b8bc6": {"title": "Макароны (al dente) в мультиварке", "sub": "200 г сухих → ≈ 460 г готовых; в чаше до ≈ 300 г сухих за заход", "items": ["макароны из твёрдой пшеницы 200 г", "горячая вода ≈ 700 мл", "соль 1 ч. л."], "steps": ["Вскипяти воду в чайнике.", "В чашу: макароны, соль, горячая вода так, чтобы покрыла макароны на 2 см (уровень не выше 2/3 чаши: пена не должна попасть в клапан).", "Программа «Макароны» или «Варка» на 1 минуту меньше времени на пачке (обычно 8–10 минут), крышка закрыта. Нет таких программ — «Тушение»: помешивай.", "Слей в сито, ополосни холодной водой 30 секунд, стряхни воду и выложи на лист пергамента."], "notes": ["Масло в макароны не добавляй: оно уже в плане и кладётся в контейнер при сборке.", "Из клапана идёт пена: в следующий раз убавь воду (на 200 г хватает ≈ 700 мл) и сними крышку на 30 секунд."]}, "d32aff74": {"title": "Картофель, запечённый дольками (противень №2)", "sub": "300 г сырого → ≈ 255 г готового", "items": ["картофель 300 г", "соль и паприка сладкая по вкусу"], "steps": ["Картофель вымой щёткой. Нарежь дольками толщиной 2 см вместе с кожурой, обсуши полотенцем.", "Противень №2 застели пергаментом. Выложи дольки в один слой (не больше 900 г на противень), посоли, посыпь паприкой.", "200 °C, 35–40 минут, на 20-й минуте переверни. Готово, когда мягко внутри и подрумянено по краям.", "Оставь остывать на пергаменте."], "notes": ["Картофель в духовке, а не в мультиварке: чаша и корзина заняты крупой и овощами."]}, "2dc01b29": {"title": "Соус кефирно-чесночный (прямо в банке)", "sub": "≈ 250 г, 6–7 порций по 40 г; в холодильнике 3 дня", "items": ["кефир 1% 220 мл", "чеснок 2 зубчика", "укроп 20 г", "лимонный сок 2 ч. л.", "соль ¼ ч. л.", "чёрный перец (по желанию)", "банка 0,3–0,5 л с крышкой"], "steps": ["В банку: чеснок (раздави ножом и мелко нарежь), мелко нарезанный укроп, лимонный сок, соль, кефир.", "Закрой крышкой и встряхни. Убери в холодильник. Клади 1–2 ст. л. на контейнер после разогрева."], "notes": ["≈ 10 ккал на порцию; в плане калории соусов не учтены (это в пределах точности расчёта)."]}, "ecc99e02": {"title": "Соус томатно-паприковый (прямо в банке)", "sub": "≈ 170 г, 6–7 порций по 25–30 г; в холодильнике 4 дня", "items": ["томатная паста 60 г", "вода 150 мл", "паприка сладкая 1 ч. л.", "чеснок 1 зубчик", "мёд 1 ч. л.", "лимонный сок или уксус 9% 1 ч. л.", "перец чили хлопья ¼ ч. л. (для острого, по желанию)", "соль ¼ ч. л.", "банка 0,25–0,3 л с крышкой"], "steps": ["В банку: паста, вода, паприка, раздавленный чеснок, мёд, лимонный сок, соль, чили. Размешай ложкой до однородности.", "Если вкус пасты кажется сырым, поставь банку без крышки в микроволновку на 1 минуту и размешай. Остуди, закрой, убери в холодильник. Клади 1–2 ст. л. на рыбу, рис, картофель."], "notes": ["≈ 10 ккал на порцию, не учтено. Остроту регулируй чили: без чили соус просто кисло-сладкий."]}, "de3bd505": {"title": "Курица, запечённая в кефирном маринаде", "sub": "780 г сырого филе бедра → ≈ 560 г готового, 6 порций по 130 г сырого", "items": ["куриное филе бедра (без кожи и кости) 780 г", "кефир 120 мл", "чеснок 2 зубчика", "паприка сладкая молотая 1¾ ч. л.", "орегано или итальянские травы 1¼ ч. л.", "соль 1¼ ч. л. (≈ 7 г)", "чёрный перец молотый ¼ ч. л. (по желанию)"], "steps": ["Достань курицу из холодильника. Выложи на лист пергамента (не на доску для овощей), обсуши бумажным полотенцем, срежь лишний жир и плёнки.", "В миске смешай кефир, чеснок (раздави или потри на мелкой тёрке), паприку, травы, соль и перец. Выложи курицу, перемешай руками, закрой. Маринад работает от 15 минут; чем дольше, тем мягче мясо.", "Противень №1 застели пергаментом. Куски выложи на расстоянии 1–2 см, избыток маринада стряхни.", "Духовка 200 °C (верх и низ), середина. 25–30 минут. Готово, когда в самом толстом куске не меньше 74 °C (бедро мягче при 80 °C) или на разрезе нет розового и сок прозрачный.", "Выложи куски на лист пергамента, дай постоять 5 минут. Не мой сырую курицу под краном: брызги разносят бактерии. После неё мой руки, нож и миску с мылом."], "notes": ["Бедро с кефирным маринадом остаётся сочным и после разогрева. Грудка в плане не используется."]}, "ac2a214b": {"title": "Овощи на пару в корзине мультиварки", "sub": "≈ 1200 г готовых (по 150 г в контейнер); сырых 1400 г; в корзину 2 раза по ≈ 700 г", "items": ["морковь 450 г", "кабачок 550 г", "цветная капуста замороженная 400 г", "соль 1½ ч. л. на всё", "укроп 10 г (если есть)"], "steps": ["Нарежь крупно, чтобы выдержали 30–40 минут над крупой: морковь кружками 1 см, кабачок кубиками 3 см. Цветную капусту не размораживай, раздели на соцветия. Раздели нарезанное по весу на 2 части поровну (≈ 700 г в каждой); вторую и следующие нарежь, пока варится первый заход.", "Часть овощей в корзину, слегка посоли. Корзину поставь над чашей с крупой (или с 500 мл воды, если заход «Пар»), закрой крышку.", "Готовы, когда вилка легко входит в морковь (на крупе это 30–40 минут). Выложи овощи на лист пергамента слоем 2 см остывать.", "Укроп добавь, если есть. Вес готовых овощей со всех заходов вместе должен получиться ≈ 1200 г: взвесь при фасовке."], "notes": ["Корзина не вмещает ≈ 700 г: раздели овощи на большее число частей; каждый лишний заход «Пар» занимает 25 минут.", "Инструкция мультиварки запрещает корзину на программе «Рис» или «Гречка»: пускай овощи отдельными заходами «Пар» (25 минут каждый), общее время вырастет.", "Масла в овощах нет: оно в плане отдельно (10–15 г на контейнер). Вкус дают соусы из банок."]}, "89067e2c": {"title": "Рис в мультиварке (2 захода)", "sub": "830 г сухого → ≈ 2,24 кг готового; в чаше 3 л до ≈ 420 г сухого за заход", "items": ["рис длиннозёрный шлифованный (не пропаренный, не круглый) 830 г", "заход 1 из 2: рис 415 г, вода 745 мл, соль 1¼ ч. л.", "заход 2 из 2: рис 415 г, вода 745 мл, соль 1¼ ч. л."], "steps": ["Промой рис в сите холодной водой 4–5 раз, пока вода почти не станет прозрачной.", "В чашу: рис, вода, соль. Размешай, выровняй. Сверху корзина с овощами, если она назначена на этот заход.", "Программа «Рис» или «Крупа» (30–40 минут). Нет такой — «Плов» или «Каша». Крышку не открывай.", "После сигнала подожди 5 минут, затем сразу выложи рис из чаши на лист пергамента слоем 2 см и не накрывай. «Подогрев» выключи: рис нельзя оставлять в мультиварке остывать.", "Остынет за 15–20 минут. Для фасовки взвесь весь рис вместе (все заходы)."], "notes": ["Первая партия калибрует воду: рис твёрдый — в следующий раз воды на 10% больше; каша — на 10% меньше.", "Метка максимума в твоей чаше ниже ≈ 420 г сухого риса: увеличь число заходов и раздели рис поровну.", "Нужно быстрее: один из заходов вари в кастрюле параллельно (вода 1,8 мл на 1 г риса, кипение, крышка, минимальный огонь 15 минут, выключить и не открывать ещё 10 минут). Время короче на 40 минут, кастрюля лишняя.", "FSA: варёный рис остужать до часа, в холодильнике не дольше суток, греть один раз до пара."]}, "44e84e47": {"title": "Макароны (al dente) в мультиварке", "sub": "100 г сухих → ≈ 230 г готовых; в чаше до ≈ 300 г сухих за заход", "items": ["макароны из твёрдой пшеницы 100 г", "горячая вода ≈ 350 мл", "соль ½ ч. л."], "steps": ["Вскипяти воду в чайнике.", "В чашу: макароны, соль, горячая вода так, чтобы покрыла макароны на 2 см (уровень не выше 2/3 чаши: пена не должна попасть в клапан).", "Программа «Макароны» или «Варка» на 1 минуту меньше времени на пачке (обычно 8–10 минут), крышка закрыта. Нет таких программ — «Тушение»: помешивай.", "Слей в сито, ополосни холодной водой 30 секунд, стряхни воду и выложи на лист пергамента."], "notes": ["Масло в макароны не добавляй: оно уже в плане и кладётся в контейнер при сборке.", "Из клапана идёт пена: в следующий раз убавь воду (на 200 г хватает ≈ 700 мл) и сними крышку на 30 секунд."]}, "41204644": {"title": "Картофель, запечённый дольками (противень №2)", "sub": "1100 г сырого → ≈ 935 г готового", "items": ["картофель 1100 г", "соль и паприка сладкая по вкусу"], "steps": ["Картофель вымой щёткой. Нарежь дольками толщиной 2 см вместе с кожурой, обсуши полотенцем.", "Противень №2 застели пергаментом. Выложи дольки в один слой (не больше 900 г на противень), посоли, посыпь паприкой. Остаток (200 г) нарежь позже: он пойдёт на противень №1 вместе с рыбой.", "200 °C, 35–40 минут, на 20-й минуте переверни. Готово, когда мягко внутри и подрумянено по краям.", "Оставь остывать на пергаменте."], "notes": ["Картофель в духовке, а не в мультиварке: чаша и корзина заняты крупой и овощами."]}, "048c4312": {"title": "Минтай в фольге с лимоном и укропом", "sub": "360 г сырого филе → ≈ 280 г готового, 2 конверта по 180 г", "items": ["минтай, филе 360 г (разморозь)", "лимон 2 шт: 4 тонких кружка и сок остального", "укроп 2 веточки", "лук репчатый 30 г кольцами", "соль ½ ч. л.", "фольга"], "steps": ["Разморозка: в холодильнике с вечера или в закрытом пакете в миске с холодной водой 40–60 минут (воду меняй каждые 15 минут). Не размораживай в тёплой воде и на столе.", "Филе обсуши. На лист фольги 30×30 см положи кольца лука, на них 180 г рыбы, посоли, сверху лимон и укроп.", "Заверни конвертом, швы наверх, чтобы сок не вытек.", "Конверты поставь на противень №1 (он освободился после курицы). 200 ), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "хлеб 60 г (2 ломтика)"], "kcal": 830, "p": 43}, "m5": {"items": ["рис (сух.) 110 г", "куриное филе бедра (сырое) 130 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "картофель 200 г"], "kcal": 854, "p": 39}}}, "2027-01-24": {"rest": true, "kcal": 2731, "kcal_maint": 2731, "p": 149, "meals": {"m2": {"items": ["рис (сух.) 100 г", "куриное филе бедра (сырое) 130 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 10 г (1 ст. л.)"], "kcal": 622, "p": 34}}}, "2027-01-26": {"rest": false, "kcal": 3437, "kcal_maint": 3746, "p": 167, "meals": {"m3": {"items": ["гречка (сух.) 110 г", "минтай, филе (сырое) 180 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "хлеб 60 г (2 ломтика)"], "kcal": 829, "p": 49}, "m5": {"items": ["рис (сух.) 110 г", "куриное филе бедра (сырое) 130 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "картофель 200 г"], "kcal": 854, "p": 39}}}, "2027-01-27": {"rest": false, "kcal": 3877, "kcal_maint": 4186, "p": 191, "meals": {"m3": {"items": ["гречка (сух.) 110 г", "минтай, филе (сырое) 180 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "хлеб 60 г (2 ломтика)"], "kcal": 829, "p": 49}, "m5": {"items": ["макароны (сух.) 110 г", "куриное филе бедра (сырое) 130 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "картофель 100 г"], "kcal": 793, "p": 41}}}, "2027-01-30": {"rest": false, "kcal": 3929, "kcal_maint": 4238, "p": 170, "meals": {"m3": {"items": ["рис (сух.) 110 г", "минтай, филе (сырое) 180 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "хлеб 60 г (2 ломтика)"], "kcal": 830, "p": 43}, "m5": {"items": ["рис (сух.) 110 г", "куриное филе бедра (сырое) 130 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "картофель 200 г"], "kcal": 854, "p": 39}}}, "2027-02-02": {"rest": false, "kcal": 3464, "kcal_maint": 3774, "p": 163, "meals": {"m5": {"items": ["рис (сух.) 110 г", "куриное филе бедра (сырое) 130 г", "овощи (морковь, кабачок, цветная капуста), на пару 150 г", "масло подсолнечное 15 г (1 ст. л.)", "картофель 200 г"], "kcal": 854, "p": 39}}}}, "docs": [{"id": "home", "title": "Главное", "html": "\n<div class=\"box ok\"><b>Цель:<\/b> меньше жира при той же силе и скорости в воде. Темп около 0,3 кг в неделю, к 27.12 около −3 кг по моей оценке расхода. Реальный темп покажут весы, а не расчёт.<\/div>\n<h3>Старт<\/h3>\n<ul>\n<li><b>Сб 17.10 и Вс 18.10:<\/b> меню отдыха (≈ 2700 ккал, без дефицита). Покупки, первая готовка (лист cook-17-10.pdf), весы.<\/li>\n<li><b>Вс 18.10 утром:<\/b> первое взвешивание (после туалета, до еды и воды) и талия по пупку.<\/li>\n<li><b>Пн 19.10:<\/b> первый день меню с дефицитом.<\/li>\n<li>Две недели до 01.11 — калибровка: решения по весу принимаются с 02.11. Вес в первые дни может прыгнуть на ±1 кг из-за воды и гликогена.<\/li>\n<\/ul>\n<h3>Как устроена готовка<\/h3>\n<ul>\n<li><b>«Два через два»:<\/b> можно готовить 18–19.10, нельзя 20–21, можно 22–23 и так далее. Одна готовка на пару «можно» дней, в первый день (старт ≈ 10:30 после утренней воды, длится 2–3 часа). Покупки в любой удобный день до готовки.<\/li>\n<li>Партия кормит до следующей готовки, 4 дня. Остальное — сборка за 5 минут вечером: сумка на завтра, банка овсянки, достать из морозилки то, что назначено (раздел «Расписание готовок»).<\/li>\n<li>Порция, которую съедаешь позже чем через ≈ 24 часа после готовки, сразу идёт в морозилку. Рыба только в обедах первых суток, дальше курица.<\/li>\n<li><b>Без кастрюль:<\/b> крупа, макароны и овощи на пару готовятся в мультиварке заходами один за другим, курица, картофель и рыба в фольге параллельно в духовке. Мыть: чаша и корзина, миска, сито, доска, нож. Готовка занимает 2–3 часа, зато посуды почти нет.<\/li>\n<\/ul>\n<h3>Что купить кроме еды<\/h3>\n<ul>\n<li>Весы для тела с шагом 100 г. Контейнеры 0,8–1 л: 6–7 на каждую готовку. Пергамент (рулон) и фольга; корзина для пара входит в комплект мультиварки.<\/li>\n<li>Термосумка и 2 замороженные бутылки воды вместо хладоэлементов: обед на учёбе стоит без холода около 6 часов.<\/li>\n<li>2 банки для соусов, малярный скотч и маркер для подписей.<\/li>\n<\/ul>\n<h3>Главное<\/h3>\n<ul>\n<li>6 приёмов; пауза между ними не больше 4–5 часов; последний не позже 20:00 (за 2 часа до сна).<\/li>\n<li>Не пропускай М2 после воды: 5 минут в раздевалке.<\/li>\n<li>Еда тёплая, есть медленно. Не жарить: варить, тушить, запекать, на пару.<\/li>\n<li>Кофе, энергетики, шоколад и газировка в план не входят; газировка раз в месяц — твоё решение.<\/li>\n<\/ul>"}, {"id": "nums", "title": "Числа по дням", "html": "<table class=\"t\"><tr><th>День<\/th><th>Нагрузка<\/th><th>ккал<\/th><th>Белок, г<\/th><th>Угл., г/кг<\/th><th>Жир, г<\/th><th>Дост. энергия<\/th><\/tr><tr><td class=b>Пн<\/td><td>вода ×2<\/td><td class=n>4214<\/td><td class=n>193<\/td><td class=n>7.7<\/td><td class=n>91<\/td><td class=n>33<\/td><\/tr><tr><td class=b>Вт<\/td><td>вода утром<\/td><td class=n>3437<\/td><td class=n>167<\/td><td class=n>6.1<\/td><td class=n>75<\/td><td class=n>35<\/td><\/tr><tr><td class=b>Ср<\/td><td>вода + зал A<\/td><td class=n>3877<\/td><td class=n>191<\/td><td class=n>6.8<\/td><td class=n>85<\/td><td class=n>36<\/td><\/tr><tr><td class=b>Чт<\/td><td>вода + зал C<\/td><td class=n>3681<\/td><td class=n>162<\/td><td class=n>6.8<\/td><td class=n>79<\/td><td class=n>35<\/td><\/tr><tr><td class=b>Пт<\/td><td>вода ×2<\/td><td class=n>4266<\/td><td class=n>172<\/td><td class=n>8.3<\/td><td class=n>81<\/td><td class=n>34<\/td><\/tr><tr><td class=b>Сб<\/td><td>вода + зал B<\/td><td class=n>3929<\/td><td class=n>170<\/td><td class=n>7.5<\/td><td class=n>75<\/td><td class=n>34<\/td><\/tr><tr><td class=b>Вс<\/td><td>отдых<\/td><td class=n>2703<\/td><td class=n>152<\/td><td class=n>3.9<\/td><td class=n>81<\/td><td class=n>39<\/td><\/tr><\/table>\n<div class=\"box\">В среднем <b>≈ 3730 ккал<\/b> и <b>≈ 170 г белка<\/b> (2,0 г на кг). Моя оценка расхода <b>≈ 4030 ккал в день<\/b> (±400).\nДефицит около <b>300 ккал<\/b> в день, около 0,28 кг в неделю. Продукты на неделю стоят ≈ 3540 ₽ (оценка).<\/div>\n<h3>Как посчитано<\/h3>\n<ul>\n<li>Покой: 1953 ккал (формула Миффлина — Сан-Жеора) × 1,4 за обычный день = 2734 ккал.<\/li>\n<li>Тренировки сверх покоя: вода ≈ 510 ккал в час (≈ 1020 за утро, ≈ 890 за вечер), зал ≈ 300 ккал в час. Оценка по METs, ошибка ±30%.<\/li>\n<li><b>Доступная энергия<\/b> = (еда − расход на тренировки) на кг тощей массы (69 кг, оценка). Общий ориентир IOC: ниже 30 ккал — низкая. У мужчин порог изучен хуже, поэтому держим не ниже 33 в каждый день. В таблице видно, почему на тяжёлых днях дефицита почти нет, а на лёгких он больше.<\/li>\n<li><b>Белок<\/b> 2 г на кг: в дефиците при силовых тренировках защищает мышцы (ориентир 1,6–2,4 г на кг). Числа дня считаны по базовому меню: в ужинах вт, ср и сб там минтай, а в приложении курица (≈ +30 ккал, −3 г белка).<\/li>\n<li><b>Поддержание<\/b> (запасной вариант): то же меню + блок А в М6 с понедельника по субботу. В среднем ≈ 3990 ккал.<\/li>\n<\/ul>\n<h3>Когда М1, М2 и М4<\/h3><table class=\"t\"><colgroup><col style=\"width:9%\"><col style=\"width:30%\"><col style=\"width:11%\"><col style=\"width:11%\"><col style=\"width:39%\"><\/colgroup><tr><th>День<\/th><th>Тренировки<\/th><th>М1<\/th><th>М2<\/th><th>М4<\/th><\/tr><tr><td class=b>Пн<\/td><td class=small>вода 07:00–09:00 и 16:45–18:30<\/td><td class=n>06:15<\/td><td class=n>09:10<\/td><td><b>15:30<\/b><br><span class=small>перекус перед водой в 16:45<\/span><\/td><\/tr><tr><td class=b>Вт<\/td><td class=small>вода 07:00–09:00<\/td><td class=n>06:15<\/td><td class=n>09:10<\/td><td><b>15:30<\/b><br><span class=small>полдник: вечером тренировки нет<\/span><\/td><\/tr><tr><td class=b>Ср<\/td><td class=small>вода 07:00–09:00; зал A 16:00–17:15<\/td><td class=n>06:15<\/td><td class=n>09:10<\/td><td><b>14:30<\/b><br><span class=small>перекус перед залом A в 16:00<\/span><\/td><\/tr><tr><td class=b>Чт<\/td><td class=small>вода 07:00–09:00; зал C 17:00–17:50<\/td><td class=n>06:15<\/td><td class=n>09:10<\/td><td><b>15:30<\/b><br><span class=small>перекус перед залом C в 17:00<\/span><\/td><\/tr><tr><td class=b>Пт<\/td><td class=small>вода 07:00–09:00 и 16:45–18:30<\/td><td class=n>06:15<\/td><td class=n>09:10<\/td><td><b>15:30<\/b><br><span class=small>перекус перед водой в 16:45<\/span><\/td><\/tr><tr><td class=b>Сб<\/td><td class=small>вода 07:30–09:45; зал B 14:30–15:50<\/td><td class=n>06:45<\/td><td class=n>09:55<\/td><td><b>16:00<\/b><br><span class=small>перекус после зала B (зал до ≈ 15:50)<\/span><\/td><\/tr><\/table><p class=\"small\">М1 за 45 минут до воды, М2 через 10 минут после неё, М4 за 75 минут до вечерней воды или за 90 минут до зала; если так выходит раньше чем через 2 часа после обеда (суббота), М4 после зала.<\/p>"}, {"id": "base", "title": "База дня: вторник", "html": "<p class=\"small\">Крупы и мясо — в сухом и сыром весе (взвешивай до готовки на кухонных весах). Овощи — на пару, масло добавляй в готовое.<\/p>\n<table class=\"t mt\"><colgroup><col style=\"width:17%\"><col style=\"width:59%\"><col style=\"width:12%\"><col style=\"width:12%\"><\/colgroup>\n<tr><th>Время<\/th><th>Приём<\/th><th>ккал<\/th><th>Белок<\/th><\/tr><tr><td class=b style='white-space:normal'>06:15<\/td><td><b>М1<\/b> до воды (за 45 мин)<br><span class=small>овсяные хлопья (сух.) 100 г<br>молоко 2,5% 200 мл<br>банан 120 г<br>мёд 15 г (2 ч. л.)<\/span><\/td><td class=n>611<\/td><td class=n>19<\/td><\/tr><tr><td class=b style='white-space:normal'>09:10<\/td><td><b>М2<\/b> после воды (из сумки)<br><span class=small>кефир 1% 400 мл<br>банан 120 г<br>хлеб 80 г (3 ломтика)<\/span><\/td><td class=n>476<\/td><td class=n>19<\/td><\/tr><tr><td class=b style='white-space:normal'>12:30<\/td><td><b>М3<\/b> обед (контейнер, микроволновка)<br><span class=small>гречка (сух.) 110 г<br>куриное филе бедра (сырое) 130 г<br>овощи (морковь, кабачок, цветная капуста), на пару 150 г<br>масло подсолнечное 15 г (1 ст. л.)<br>хлеб 60 г (2 ломтика)<\/span><\/td><td class=n>856<\/td><td class=n>46<\/td><\/tr><tr><td class=b style='white-space:normal'>15:30<\/td><td><b>М4<\/b> полдник: вечером тренировки нет<br><span class=small>творог 5% 80 г<br>хлеб 60 г (2 ломтика)<br>мёд 15 г (2 ч. л.)<br>яблоко сладкое 150 г<\/span><\/td><td class=n>370<\/td><td class=n>19<\/td><\/tr><tr><td class=b style='white-space:normal'>19:15<\/td><td><b>М5<\/b> ужин (дома)<br><span class=small>рис (сух.) 110 г<br>минтай, филе (сырое) 180 г<br>овощи (морковь, кабачок, цветная капуста), на пару 150 г<br>масло подсолнечное 15 г (1 ст. л.)<br>картофель 200 г<\/span><\/td><td class=n>826<\/td><td class=n>42<\/td><\/tr><tr><td class=b style='white-space:normal'>19:50<\/td><td><b>М6<\/b> перед сном (за 2 ч)<br><span class=small>кефир 1% 300 мл<br>творог 5% 50 г<\/span><\/td><td class=n>180<\/td><td class=n>18<\/td><\/tr><tr><td class=b>+<\/td><td><b>Картофель<\/b> к обеду<br><span class=small>картофель 150 г<\/span><\/td><td class=n>116<\/td><td class=n>3<\/td><\/tr>\n<tr class=\"bh\"><td colspan=\"2\">Итого вторник<\/td><td class=n>3437<\/td><td class=n>167<\/td><\/tr><\/table>\n<h3>Что где<\/h3>\n<ul>\n<li><b>М1:<\/b> овсянка (или омлет в дни из таблицы). За 45 минут до воды: 06:15, в субботу 06:45.<\/li>\n<li><b>М2:<\/b> в сумке, съедаешь после воды: в 09:10, в субботу в 09:55. Нет аппетита — хотя бы кефир и банан.<\/li>\n<li><b>М3:<\/b> контейнер, 1–2 минуты в микроволновке на учёбе. Рыба или курица: по положению порции в партии, в приложении уже учтено.<\/li>\n<li><b>М4:<\/b> перед вечерней тренировкой (за 75 минут до воды, за 90 минут до зала); во вторник тренировки вечером нет, это обычный полдник в 15:30; в субботу после зала. Время по дням: раздел «Числа по дням».<\/li>\n<li><b>М5, М6:<\/b> дома. В таблице выше минтай 180 г, но по правилу «рыба только в обедах первых суток» в ужин идёт курица 130 г (≈ +30 ккал, −3 г белка): в приложении уже так. М6 не позже 20:00.<\/li>\n<\/ul>"}, {"id": "days", "title": "Дни недели", "html": "<p class=\"small\">Состав М2, М4 и М6 одинаковый во все дни (как во вторник); меняются М1, М3, М5 и добавки. Время М1, М2 и М4 зависит от тренировок дня (таблица в разделе «Числа по дням»). Белок: рыба только в обедах первых суток, дальше курица (раздел «Расписание готовок»); в приложении состав дня уже пересчитан.<\/p>\n<table class=\"t\"><colgroup><col style=\"width:9%\"><col style=\"width:18%\"><col style=\"width:20%\"><col style=\"width:28%\"><col style=\"width:25%\"><\/colgroup>\n<tr><th>День<\/th><th>М1<\/th><th>М3<\/th><th>М5<\/th><th>Добавки<\/th><\/tr><tr><td class=b>Пн<\/td><td>омлет (3 яйца)<\/td><td>гречка + курица или рыба<\/td><td>макароны, курица, картофель 100 г<\/td><td class=small>Блок А к М2<br>Блок А к М4<br>Блок Б (макароны) к ужину<\/td><\/tr><tr><td class=b>Вт<\/td><td>овсянка<\/td><td>гречка + курица или рыба<\/td><td>рис, курица, картофель 200 г<\/td><td class=small>Картофель к обеду<\/td><\/tr><tr><td class=b>Ср<\/td><td>омлет (3 яйца)<\/td><td>гречка + курица или рыба<\/td><td>макароны, курица, картофель 100 г<\/td><td class=small>Блок А к М4<br>Блок Б (макароны) к ужину<\/td><\/tr><tr><td class=b>Чт<\/td><td>овсянка<\/td><td>рис + курица или рыба<\/td><td>картофель 450 г, курица<\/td><td class=small>Блок А к М4<br>Блок В (картофель) к ужину<\/td><\/tr><tr><td class=b>Пт<\/td><td>овсянка<\/td><td>рис + курица или рыба<\/td><td>рис, курица, картофель 200 г<\/td><td class=small>Блок А к М2<br>Блок А к М4<br>Блок Б (рис) к ужину<\/td><\/tr><tr><td class=b>Сб<\/td><td>овсянка<\/td><td>рис + курица или рыба<\/td><td>рис, курица, картофель 200 г<\/td><td class=small>Блок А к М2<br>Блок Б (рис) к ужину<\/td><\/tr><tr><td class=b>Вс<\/td><td colspan=3>меню отдыха (раздел «Отдых»)<\/td><td>—<\/td><\/tr><\/table>\n<h3>Блоки<\/h3>\n<table class=\"t\"><tr><th>Блок<\/th><th>Состав<\/th><th>ккал<\/th><\/tr><tr><td class=b>Блок А<\/td><td>хлеб 60 г (2 ломтика)<br>мёд 15 г (2 ч. л.)<br>банан 120 г<\/td><td class=n>310<\/td><\/tr><tr><td class=b>Блок Б (рис)<\/td><td>рис (сух.) 90 г<\/td><td class=n>297<\/td><\/tr><tr><td class=b>Блок В (картофель)<\/td><td>картофель 250 г<\/td><td class=n>192<\/td><\/tr><tr><td class=b>Картофель<\/td><td>картофель 150 г<\/td><td class=n>116<\/td><\/tr><\/table>\n<div class=\"box ok\"><b>Блок А — резерв:<\/b> снижение веса быстрее 0,6 кг в неделю, плохой сон, «тяжелее» на режиме. Добавь его в М6 с пн по сб (≈ +310 ккал в день). Правила: раздел «Проверка».<\/div>\n<h3>Замены (ккал почти не меняются)<\/h3>\n<ul>\n<li>минтай 180 г ↔ куриное филе бедра 130 г (и наоборот);<\/li>\n<li>творог 80 г ↔ 2 яйца вкрутую;<\/li>\n<li>кефир ↔ молоко 2,5% (+50 ккал на 400 мл);<\/li>\n<li>банан ↔ груша или сладкое яблоко 200 г;<\/li>\n<li>гречка ↔ рис ↔ макароны по сухому весу; картофель в три раза больше по весу;<\/li>\n<li>шейк NEO вместо кефира в М2 (30 г белка): на вкус и по цене решаешь сам.<\/li>\n<\/ul>"}, {"id": "rest", "title": "Отдых: воскресенье", "html": "<table class=\"t mt\"><colgroup><col style=\"width:14%\"><col style=\"width:62%\"><col style=\"width:12%\"><col style=\"width:12%\"><\/colgroup>\n<tr><th>Время<\/th><th>Приём<\/th><th>ккал<\/th><th>Белок<\/th><\/tr><tr><td class=b>09:00<\/td><td><b>М1<\/b> завтрак<br><span class=small>4 яйца (200 г)<br>бекон 30 г<br>сыр 20 г<br>хлеб 80 г (3 ломтика)<\/span><br><span class=small>омлет с беконом и сыром — раз в неделю; при изжоге бекон убрать<\/span><\/td><td class=n>694<\/td><td class=n>40<\/td><\/tr><tr><td class=b>12:30<\/td><td><b>М2<\/b> обед<br><span class=small>рис (сух.) 100 г<br>минтай, филе (сырое) 180 г<br>овощи (морковь, кабачок, цветная капуста), на пару 150 г<br>масло подсолнечное 10 г (1 ст. л.)<\/span><br><span class=small>контейнер из холодильника или морозилки: см. вкладку «Еда»<\/span><\/td><td class=n>594<\/td><td class=n>38<\/td><\/tr><tr><td class=b>15:30<\/td><td><b>М3<\/b> полдник<br><span class=small>творог 5% 100 г<br>банан 120 г<br>мёд 15 г (2 ч. л.)<br>хлеб 60 г (2 ломтика)<\/span><\/td><td class=n>431<\/td><td class=n>23<\/td><\/tr><tr><td class=b>19:00<\/td><td><b>М4<\/b> ужин<br><span class=small>макароны (сух.) 100 г<br>куриное филе бедра (сырое) 130 г<br>овощи (морковь, кабачок, цветная капуста), на пару 150 г<br>масло подсолнечное 10 г (1 ст. л.)<\/span><br><span class=small>контейнер из холодильника или морозилки: см. вкладку «Еда»<\/span><\/td><td class=n>636<\/td><td class=n>38<\/td><\/tr><tr><td class=b>19:50<\/td><td><b>М5<\/b> вечер<br><span class=small>кефир 1% 300 мл<br>яблоко сладкое 150 г<br>хлеб 60 г (2 ломтика)<\/span><br><span class=small>не позже 20:00<\/span><\/td><td class=n>348<\/td><td class=n>14<\/td><\/tr>\n<tr class=\"bh\"><td colspan=\"2\">Итого<\/td><td class=n>2703<\/td><td class=n>152<\/td><\/tr><\/table>\n<p class=\"small\">Расход в день отдыха ≈ 2730 ккал, поэтому дефицита здесь нет: воскресенье пополняет запасы перед понедельником.<\/p>"}, {"id": "week", "title": "Расписание готовок", "html": "<div class=\"box ok\"><b>«Два через два»:<\/b> можно готовить 18–19 октября, нельзя 20–21, можно 22–23, нельзя 24–25 и так далее. Одна готовка на пару «можно» дней, в первый день; второй день запасной. Каждая партия кормит до следующей готовки (4 дня). Покупки в любой удобный день до готовки.<\/div>\n<ul><li><b>Вс 18.10<\/b> · 16:00–18:15 · мини-готовка: Вт ужин → Ср ужин (3: морозилка 3). <span class=small>можно 18–19, дальше два дня нельзя<\/span><\/li><li><b>Чт 22.10<\/b> · 10:30–12:55 · готовка: Чт обед → Вс ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 22–23, дальше два дня нельзя<\/span><\/li><li><b>Пн 26.10<\/b> · 10:30–12:57 · готовка: Пн обед → Чт ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 26–27, дальше два дня нельзя<\/span><\/li><li><b>Пт 30.10<\/b> · 10:30–13:25 · готовка: Пт обед → Пн ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 30–31, дальше два дня нельзя<\/span><\/li><li><b>Вт 03.11<\/b> · 10:30–13:25 · готовка: Вт обед → Пт ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 3–4, дальше два дня нельзя<\/span><\/li><li><b>Сб 07.11<\/b> · 10:30–13:25 · готовка: Сб обед → Вт ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 7–8, дальше два дня нельзя<\/span><\/li><li><b>Ср 11.11<\/b> · 10:30–13:25 · готовка: Ср обед → Сб ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 11–12, дальше два дня нельзя<\/span><\/li><li><b>Вс 15.11<\/b> · 10:30–12:57 · готовка: Вс обед → Ср ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 15–16, дальше два дня нельзя<\/span><\/li><li><b>Чт 19.11<\/b> · 10:30–12:55 · готовка: Чт обед → Вс ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 19–20, дальше два дня нельзя<\/span><\/li><li><b>Пн 23.11<\/b> · 10:30–12:57 · готовка: Пн обед → Чт ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 23–24, дальше два дня нельзя<\/span><\/li><li><b>Пт 27.11<\/b> · 10:30–13:25 · готовка: Пт обед → Пн ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 27–28, дальше два дня нельзя<\/span><\/li><li><b>Вт 01.12<\/b> · 10:30–13:25 · готовка: Вт обед → Пт ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 1–2, дальше два дня нельзя<\/span><\/li><li><b>Сб 05.12<\/b> · 10:30–13:25 · готовка: Сб обед → Вт ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 5–6, дальше два дня нельзя<\/span><\/li><li><b>Ср 09.12<\/b> · 10:30–13:25 · готовка: Ср обед → Сб ужин (8: сразу 1, холодильник 2, морозилка 5). <span class=small>можно 9–10, дальше два дня нельзя<\/span><\/li><\/ul>\n<h3>Как это работает<\/h3>\n<ul>\n<li>В день готовки обед свежий, ужин и обед следующего дня в холодильнике (до ≈ 24 часов), остальное сразу в морозилку.<\/li>\n<li><b>Рыба<\/b> только в обедах первых суток (свежий и следующий), дальше курица: после морозилки и разогрева курица остаётся сочнее, минтай сохнет.<\/li>\n<li>Каждый вечер и утро 5 минут: сумка на завтра, банка овсянки, достать из морозилки то, что назначено. Приложение напоминает (вкладка «Еда» → «Дела»).<\/li>\n<li>Первая суббота 17.10 и мини-готовка 18.10 — отдельные листы: cook-17-10.pdf, cook-18-10.pdf. Все остальные листы собирает приложение.<\/li>\n<\/ul>"}, {"id": "store", "title": "Хранение и разогрев", "html": "<table class=\"t\"><colgroup><col style=\"width:24%\"><col><\/colgroup><tr><th>Тема<\/th><th>Правило<\/th><\/tr><tr><td class=b style='white-space:normal'>Холодильник или морозилка<\/td><td>В холодильнике лежит только то, что съедается в течение ≈ 24 часов после готовки. Остальное в морозилку, как только остынет в контейнере. Таблица «Расфасовка» говорит, куда что.<\/td><\/tr><tr><td class=b style='white-space:normal'>Охлаждение<\/td><td>Не оставляй готовое остывать в чаше мультиварки: после каждого захода сразу выкладывай крупу и овощи на пергамент слоем 2 см и не накрывай. Рис, гречка, макароны: в холодильник или морозилку не позже 2 часов после выхода из мультиварки (USDA), лучше быстрее (FSA: рис остужать до часа). Поэтому лист с крупой первых заходов уходит в холодильник до фасовки. Горячий контейнер в морозилку не ставь: подожди, пока станет тёплым.<\/td><\/tr><tr><td class=b style='white-space:normal'>Размораживание<\/td><td>Контейнер из морозилки переложи в холодильник: на обед — накануне вечером, на ужин — утром того же дня. Не размораживай на столе.<\/td><\/tr><tr><td class=b style='white-space:normal'>Минтай<\/td><td>Хранится в морозилке. Накануне готовки вечером переложи нужную часть в холодильник (приложение напомнит). Не размораживай на столе и в тёплой воде.<\/td><\/tr><tr><td class=b style='white-space:normal'>Разогрев<\/td><td>Один раз, в микроволновке: 1–2 ст. л. воды, крышка с щелью, 2 минуты на 800 Вт, перемешай, ещё 1–2 минуты. Должно парить по всему объёму (≥ 74 °C). Разогретое не убирай обратно: съешь или выбрось.<\/td><\/tr><tr><td class=b style='white-space:normal'>На учёбе<\/td><td>Утром контейнер из холодильника в термосумку с 2 хладоэлементами (или с 2 замороженными бутылками воды). Готовая еда с мясом, рисом и макаронами не должна стоять без холода дольше 2 часов (USDA); обед в 12:30 при выходе в 06:30 — это 6 часов.<\/td><\/tr><tr><td class=b style='white-space:normal'>Что выбросить<\/td><td>Контейнер из холодильника старше 24 часов с рисом или макаронами; любой с кислым или необычным запахом; любой, который был разогрет и не съеден.<\/td><\/tr><\/table><h3>Источники<\/h3><ul><li><a href=\"https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker\">FSA (Великобритания), Home food fact checker, обновлено 21.08.2026<\/a><\/li><li><a href=\"https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety\">USDA FSIS, Leftovers and Food Safety<\/a><\/li><li><a href=\"https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/bacteria-foodborne-illness/bacillus-cereus\">FSANZ, Bacillus cereus<\/a><\/li><\/ul><p class=\"small\">FSA: рис в холодильнике не дольше 1 суток, остужать до часа, греть один раз. USDA: готовые блюда 3–4 суток в холодильнике, 3–4 месяца в морозилке, разогрев до 74 °C. FSANZ: токсин B. cereus образуется и в других крахмалистых блюдах при плохом охлаждении. Правило «24 часа или морозилка» строже USDA.<\/p>\n<h3>Когда доставать из морозилки<\/h3>\n<ul>\n<li><b>Обед:<\/b> накануне вечером переложить из морозилки в холодильник; утром в термосумку.<\/li>\n<li><b>Ужин:<\/b> утром того же дня переложить из морозилки в холодильник.<\/li>\n<li><b>Минтай:<\/b> вечером накануне готовки (если в партии есть рыба).<\/li>\n<li>Точные даты на каждый день показывает приложение: «Еда» → «Дела».<\/li>\n<\/ul>"}, {"id": "time", "title": "Режим дня", "html": "<table class=\"t\"><colgroup><col style=\"width:25%\"><col><\/colgroup><tr><td class=b>06:00<\/td><td>подъём, вес до еды (в журнал)<\/td><\/tr><tr><td class=b>06:15<\/td><td>М1: овсянка или омлет (суббота 06:45)<\/td><\/tr><tr><td class=b>06:30<\/td><td>выход (суббота 07:00)<\/td><\/tr><tr><td class=b>07:00–09:00<\/td><td>вода (суббота 07:30–09:45); в день готовки после воды магазин, затем готовка с 10:30 (2–3 часа)<\/td><\/tr><tr><td class=b>09:10<\/td><td>М2 из сумки (суббота 09:55)<\/td><\/tr><tr><td class=b>09:00–16:00<\/td><td>учёба или дом<\/td><\/tr><tr><td class=b>12:30<\/td><td>М3: контейнер<\/td><\/tr><tr><td class=b>после обеда<\/td><td>М4 по тренировке дня: Пн 15:30, Вт 15:30, Ср 14:30, Чт 15:30, Пт 15:30, Сб 16:00. Подробнее в разделе «Числа по дням»<\/td><\/tr><tr><td class=b>14:30–18:30<\/td><td>тренировки: вода 16:45–18:30 (пн, пт); зал A в среду 16:00; зал C в четверг 17:00; зал B в субботу с 14:30. Во вторник вечером тренировки нет<\/td><\/tr><tr><td class=b>19:15<\/td><td>М5: ужин<\/td><\/tr><tr><td class=b>19:50<\/td><td>М6: кефир и творог, последний приём<\/td><\/tr><tr><td class=b>21:30<\/td><td>экраны выключены<\/td><\/tr><tr><td class=b>22:00<\/td><td>сон<\/td><\/tr><\/table>\n<ul>\n<li>Подъём в 06:00 и отбой в 22:00 каждый день, включая выходные: 8 часов сна. Если сейчас ложишься сильно позже, сдвигай отбой на 30 минут каждые 3 дня.<\/li>\n<li>Ужин и М6 не позже чем за 2 часа до сна.<\/li>\n<li>Выходной: те же 06:00 и 22:00, но без воды и зала.<\/li>\n<\/ul>"}, {"id": "check", "title": "Проверка раз в неделю и остановка", "html": "<h3>Понедельник утром (страница «Неделя» в журнале)<\/h3>\n<ul>\n<li>Вес: среднее за 7 дней (нужно 4 взвешивания и больше), сравнивай со средним прошлой недели.<\/li>\n<li><b>Падает быстрее 0,6 кг в неделю<\/b> (0,7% веса): добавь блок А в М6 с понедельника по субботу.<\/li>\n<li><b>Падает на 0,1–0,6 кг:<\/b> всё по плану.<\/li>\n<li><b>Не падает 2 недели подряд:<\/b> сам не урезай: запас по доступной энергии небольшой. Пришли данные, я пересчитаю расход.<\/li>\n<li><b>Растёт больше 0,5 кг в неделю:<\/b> проверь, что взвешиваешься в одних условиях; потом пришли данные.<\/li>\n<li>Талия по пупку раз в неделю (воскресенье утром): −1 см за 4 недели — ориентир, ±1 см — погрешность.<\/li>\n<\/ul>\n<div class=\"box red\"><b>Остановка дефицита.<\/b> Любой из пунктов → ешь меню на поддержание (то же меню + блок А в М6) не меньше 2 недель и напиши мне:<br>\n1. «Тяжелее» на режиме два раза в неделю и больше две недели подряд.<br>\n2. Рабочие веса главных подъёмов в зале ниже на 5% и больше за неделю.<br>\n3. Болезнь, травма, температура.<br>\n4. Сон меньше 6,5 часа три ночи подряд.<br>\n5. Срыв: переедание или «не лезет» больше двух дней.<br>\n6. Изжога или боль в животе три дня подряд.<br>\n7. Вес падает быстрее 0,6 кг в неделю две недели подряд.<\/div>"}], "nums": {"rows": [["Пн", "вода ×2", 4214, 193, 7.7, 91, 33], ["Вт", "вода утром", 3437, 167, 6.1, 75, 35], ["Ср", "вода + зал A", 3877, 191, 6.8, 85, 36], ["Чт", "вода + зал C", 3681, 162, 6.8, 79, 35], ["Пт", "вода ×2", 4266, 172, 8.3, 81, 34], ["Сб", "вода + зал B", 3929, 170, 7.5, 75, 34], ["Вс", "отдых", 2703, 152, 3.9, 81, 39]], "avg": {"kcal": 3729, "p": 173, "tee": 4029, "deficit": 300}}, "rules": [["Холодильник или морозилка", "В холодильнике лежит только то, что съедается в течение ≈ 24 часов после готовки. Остальное в морозилку, как только остынет в контейнере. Таблица «Расфасовка» говорит, куда что."], ["Охлаждение", "Не оставляй готовое остывать в чаше мультиварки: после каждого захода сразу выкладывай крупу и овощи на пергамент слоем 2 см и не накрывай. Рис, гречка, макароны: в холодильник или морозилку не позже 2 часов после выхода из мультиварки (USDA), лучше быстрее (FSA: рис остужать до часа). Поэтому лист с крупой первых заходов уходит в холодильник до фасовки. Горячий контейнер в морозилку не ставь: подожди, пока станет тёплым."], ["Размораживание", "Контейнер из морозилки переложи в холодильник: на обед — накануне вечером, на ужин — утром того же дня. Не размораживай на столе."], ["Минтай", "Хранится в морозилке. Накануне готовки вечером переложи нужную часть в холодильник (приложение напомнит). Не размораживай на столе и в тёплой воде."], ["Разогрев", "Один раз, в микроволновке: 1–2 ст. л. воды, крышка с щелью, 2 минуты на 800 Вт, перемешай, ещё 1–2 минуты. Должно парить по всему объёму (≥ 74 °C). Разогретое не убирай обратно: съешь или выбрось."], ["На учёбе", "Утром контейнер из холодильника в термосумку с 2 хладоэлементами (или с 2 замороженными бутылками воды). Готовая еда с мясом, рисом и макаронами не должна стоять без холода дольше 2 часов (USDA); обед в 12:30 при выходе в 06:30 — это 6 часов."], ["Что выбросить", "Контейнер из холодильника старше 24 часов с рисом или макаронами; любой с кислым или необычным запахом; любой, который был разогрет и не съеден."]], "sources": [["FSA (Великобритания), Home food fact checker, обновлено 21.08.2026", "https://www.gov.uk/government/publications/home-food-fact-checker/home-food-fact-checker"], ["USDA FSIS, Leftovers and Food Safety", "https://www.fsis.usda.gov/food-safety/safe-food-handling-and-preparation/food-safety-basics/leftovers-and-food-safety"], ["FSANZ, Bacillus cereus", "https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/bacteria-foodborne-illness/bacillus-cereus"]], "sourcesNote": "FSA: рис в холодильнике не дольше 1 суток, остужать до часа, греть один раз. USDA: готовые блюда 3–4 суток в холодильнике, 3–4 месяца в морозилке, разогрев до 74 °C. FSANZ: токсин B. cereus образуется и в других крахмалистых блюдах при плохом охлаждении. Правило «24 часа или морозилка» строже USDA.", "anchor": "2026-10-18", "lastCal": "2027-02-03"}, "sched": {"weeks": [{"n": 1, "days": [[{"k": "w", "p": "am", "t": "07:00", "e": "09:00"}, {"k": "w", "p": "pm", "t": "16:45", "e": "18:30"}], [{"k": "w", "p": "am", "t": "07:00", "e": "09:00"}, {   else if (r.delta == null) r.msgs.push({t: 'mut', s: 'Нет среднего прошлой недели для сравнения.'});
  else if (calib) r.msgs.push({t: 'mut', s: 'Калибровка: решения по весу с 02.11. Изменение ' + (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг.'});
  else if (r.delta <= -0.6) r.msgs.push({t: 'bad', s: 'Быстрее лимита (' + fmt(r.delta, 2) + ' кг). Добавь блок А в М6 с понедельника по субботу.'});
  else if (r.delta <= -0.1) r.msgs.push({t: 'ok', s: 'По плану: ' + fmt(r.delta, 2) + ' кг за неделю.'});
  else if (r.delta <= 0.5) { const pd = n > 2 && weekAvg(n - 1) != null && weekAvg(n - 2) != null ? weekAvg(n - 1) - weekAvg(n - 2) : null; r.msgs.push(pd != null && pd > -0.1 ? {t: 'warn', s: 'Вес не падает две недели подряд. Сам еду не урезай: пришли данные, пересчитаю расход.'} : {t: 'warn', s: 'Вес почти не меняется (' + (r.delta > 0 ? '+' : '') + fmt(r.delta, 2) + ' кг). Ещё неделя наблюдения.'}); }
  else r.msgs.push({t: 'warn', s: 'Вес растёт больше 0,5 кг. Проверь условия взвешивания, потом пришли данные.'});
  return r;
}

        <div style="flex:0 0 auto"><label class="f">&nbsp;</label><button class="btn" data-act="addset" data-ex="${ex.code}">+ подход</button></div></div></div>`;
  }).join('');
  const lifts = DATA.lifts.map(l => { const a = liftBest(l[0], n), b = n > 1 ? liftBest(l[0], n - 1) : null; const d = (a != null && b != null) ? (a / b - 1) * 100 : null;
    return `<tr><td>${esc(l[1])}</td><td class="n">${a != null ? fmt(a) : '—'}</td><td class="n">${b != null ? fmt(b) : '—'}</td><td class="n">${d != null ? (d > 0 ? '+' : '') + fmt(d) + '%' : '—'}</td></tr>`; }).join('');
  return `
  <div class="days"><button class="btn sec" data-act="day" data-n="-1">‹</button><input type="date" id="dt" value="${date}"><button class="btn sec" data-act="day" data-n="1">›</button></div>
  <div class="chips" style="margin:8px 0">${['A', 'B', 'C'].map(k => `<button class="chip ${sess === k ? 'on' : ''}" data-act="sess" data-v="${k}">Занятие ${k}</button>`).join('')}</div>
  ${wk ? `<div class="card"><h2>Неделя ${n} · ${esc(wk.kind)}</h2><div class="kv"><span>Жим / присед</span><span>${esc(wk.main)}</span><span>Подтягивания</span><span>${esc(wk.pull)}</span><span>Допы</span><span>${esc(wk.acc)}</span><span>Прыжки · медбол</span><span>${esc(wk.jump)} · ${esc(wk.ball)}</span><span>Занятие C</span><span>${esc(wk.c)}</span></div>
    ${wk.note ? `<div class="sm mut" style="margin-top:6px">${esc(wk.note)}</div>` : ''}</div>` : ''}
  <div class="card"><h2>Занятие ${sess}</h2>${exCards}</div>
  <div class="card"><h2>Расчётный максимум по неделям</h2><table><tr><th>Подъём</th><th class="n">Эта</th><th class="n">Прошлая</th><th class="n">Δ</th></tr>${lifts}</table>
  <div class="xs mut" style="margin-top:6px">Макс. = вес × (1 + (повторы + 10 − RPE) / 30). Для подтягиваний — добавочный вес к весу тела (${fmt(curBW())} кг).</div></div>`;
}

/* ---------------- вкладка «Еда» ---------------- */
const FD = DATA.food;
const FS = () => { const f = S.food = S.food || {}; ['shop', 'cook', 'calc', 'chores'].forEach(k => { f[k] = f[k] || {}; }); return f; };
const STORE_NAME = {fresh: 'сразу', F: 'холодильник', Z: 'морозилка'};
const storeChip = s => `<span class="store ${s}">${STORE_NAME[s]}</span>`;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const hm = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const toMin = s => { const p = String(s).split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const T_MORNING = 6 * 60 + 30, T_EVENING = 20 * 60 + 30;
const COOKDATES = FD.cooks.map(c => c[0]);
function cookOnOrAfter(s) { for (let i = 0; i < COOKDATES.length; i++) { if (COOKDATES[i] >= s) return COOKDATES[i]; } return COOKDATES[COOKDATES.length - 1]; }
function cookOnOrBefore(s) { let r = COOKDATES[0]; for (let i = 0; i < COOKDATES.length; i++) { if (COOKDATES[i] <= s) r = COOKDATES[i]; else break; } return r; }
const EMPTY_DAY = {events: [], m1: null, cook: null, can: false, evening: []};
const calFor = s => FD.cal[s] || EMPTY_DAY;
const SESS_CACHE = {};
function sessOf(key) {   // готовка с распакованными таймлайном, списком подготовки и рецептами
  if (SESS_CACHE[key]) return SESS_CACHE[key];
  const s = FD.sessions[key], P = FD.pool;
  return (SESS_CACHE[key] = Object.assign({}, s, {timeline: P.tl[s.tl], prep: P.prep[s.prep], recipes: Object.keys(s.rc).map(id => Object.assign({id: id}, P.rc[s.rc[id]]))}));
}
let openRecs = {};        // раскрытые рецепты: не сохраняются, нужны, чтобы рецепт не сворачивался при отметке шага
let foodScroll = false;   // при открытии прокрутить к «дальше»
document.addEventListener('toggle', ev => { const d = ev.target; if (d && d.tagName === 'DETAILS' && d.dataset && d.dataset.rk) { if (d.open) openRecs[d.dataset.rk] = true; else delete openRecs[d.dataset.rk]; } }, true);

/* вес компонента в контейнере по введённому общему готовому весу: вес по плану × (вышло ÷ по плану всего) */
function weightOf(sess, p, vals) {
  const tot = (sess.totals.find(t => t[0] === p[0]) || [])[2], v = num((vals || {})[p[0]]);
  return (tot && v != null && v > 0) ? Math.round(p[2] * v / tot) : null;
}
function contHtml(sess, co, vals) {
  const parts = co.parts.map(p => { const w = weightOf(sess, p, vals); return p[0] === 'veg' ? 'овощи ' + (w != null ? w : p[2]) + ' г' : p[1] + ' ' + (w != null ? w + ' г' : '≈ ' + p[3] + ' г'); });
  return esc(parts.join(', ') + (co.oil ? ', масло ' + co.oil + ' г' : '') + (co.bread ? ', хлеб ' + co.bread + ' г отдельно' : ''));
}

/* ---- дела на дату, по времени ---- */
function choreItems(date) {
  const c = calFor(date), nx = calFor(addDays(date, 1)), items = [];
  const add = (t, id, html, go) => items.push({t, id, html, go});
  const mt = ((menuFor(date).meals || [])[0] || {}).time, m1m = /^\d\d:\d\d$/.test(mt || '') ? toMin(mt) : 6 * 60 + 15;     // время М1 из меню дня (в субботу 06:45)
  if (c.m1 === 'oats') add(m1m, 'm1', '<b>Завтрак</b> · овсянка из банки (она с вечера в холодильнике): 1 минута в микроволновке, банан и мёд');
  else if (c.m1 === 'omelet') add(m1m, 'm1', '<b>Завтрак</b> · омлет из 3 яиц, 7 минут', 'rec');
  else if (c.m1 === 'rest') add(9 * 60, 'm1', '<b>Завтрак</b> · омлет с беконом и сыром, 10 минут', 'rec');
  if (c.cook) {
    const s = FD.sessions[c.cook], tr = FD.trips[c.cook];
    add(toMin(s.start) - 45, 'shop', `<b>Продукты куплены?</b> Список в «Покупки» (≈ ${tr.grand} ₽)`, 'shop');
    add(toMin(s.start), 'cook', `<b>Готовка</b> ${esc(s.start)}–${esc(s.end)} · шаги и рецепты в «Готовка»`, 'cook');
  }
  c.events.forEach(ev => {
    const co = FD.sessions[ev[5]].containers.find(x => x.label === ev[1] && x.date === date);
    if (ev[2] === 'Z' && ev[0] === 'ужин') add(T_MORNING, 'm-' + ev[1], `Достань из морозилки в холодильник «${esc(ev[1])}» (на ужин)`);
    if (ev[0] === 'обед' && ev[2] !== 'fresh' && dayCode(date) !== 'Вс') add(T_MORNING, 'b-' + ev[1], `Положи «${esc(ev[1])}» в термосумку (обед на учёбе)`);
    add(toMin(ev[3]), 'e-' + ev[1], `<b>${esc(cap(ev[0]))}</b> · «${esc(ev[1])}» ${storeChip(ev[2])}<div class="xs mut">${co ? contHtml(sessOf(ev[5]), co) : ''}</div>`);
  });
  nx.events.forEach(ev => { if (ev[2] === 'Z' && ev[0] === 'обед') add(T_EVENING, 't-' + ev[1], `Достань из морозилки в холодильник «${esc(ev[1])}» (на завтрашний обед)`); });
  if (nx.m1 === 'oats') add(T_EVENING, 'jar', 'Сделай банку овсянки на утро: хлопья 100 г, молоко 200 мл, щепотка соли; закрой и в холодильник', 'rec');
  (c.evening || []).forEach((t, i) => add(T_EVENING, 'x' + i, esc(cap(t))));
  if (dayCode(addDays(date, 1)) !== 'Вс') {
    const lunch = nx.events.find(e => e[0] === 'обед' && e[2] !== 'fresh');
    add(T_EVENING, 'bag', 'Собери сумку на завтра: М2' + (lunch ? ', обед «' + esc(lunch[1]) + '» в термосумке' : '') + ', М4' + (lunch ? '; 2 замороженные бутылки воды' : ''));
  }
  return items.map((x, i) => Object.assign(x, {o: i})).sort((a, b) => a.t - b.t || a.o - b.o);
}
function choreRow(date, x, ck, cls) {
  const k = date + '|' + x.id;
  return `<div class="tick ${ck[k] ? 'on' : ''} ${cls || ''}" data-act="tick" data-k="${esc(k)}"><div class="ck">✓</div><div class="tx"><span class="tm">${hm(x.t)}</span>${cls ? '<span class="pill">дальше</span> ' : ''}${x.html}</div>${x.go ? `<button class="btn sec sm" data-act="gofood" data-v="${x.go}">Открыть</button>` : ''}</div>`;
}
function foodChoresCard(date) {
  if (date < FD.firstCook || date > FD.lastCal) return '';
  const items = choreItems(date), ck = FS().chores, isToday = date === today(), nm = nowMin();
  let left = items.filter(x => !ck[date + '|' + x.id]);
  if (isToday) left = left.filter(x => x.t >= nm - 45);
  const rows = left.slice(0, 4).map((x, i) => choreRow(date, x, ck, isToday && i === 0 ? 'now' : '')).join('');
  return `<div class="card"><h2><span>Еда: что сделать</span><button class="btn sec sm" data-act="gofood" data-v="plan">Все дела</button></h2>${rows || '<div class="sm mut">По еде на сегодня всё сделано.</div>'}</div>`;

/* подсказка в меню дня: из какого контейнера этот приём и откуда его брать */
function contHint(date, x) {

  if (!kind) return '';

  if (!ev) return '';
  const how = ev[2] === 'fresh' ? 'готовишь и ешь сразу' : ev[2] === 'F' ? 'бери из холодильника' : kind === 'обед' ? 'достань накануне вечером' : 'достань утром';
  return `<div class="mi" style="color:var(--ink)"><b>Контейнер «${esc(ev[1])}»</b> ${storeChip(ev[2])} ${esc(how)}</div>`;
}
const FOOD_HELP = {plan: 'Что сделать сегодня по еде, по времени. Нажимай на строку, когда сделал.', cook: 'Шаги по минутам. Рецепт раскрывается внутри шага. В конце раскладка по контейнерам.',
  shop: 'Список перед готовкой. Нажимай на продукт, когда положил в корзину.', pack: 'Что лежит в каждом контейнере, куда его убрать и когда достать.',
  rec: 'Рецепты партии в том порядке, в котором их готовишь.', ref: 'Расписание готовок, числа, правила хранения, режим дня.'};
function foodPlan() {
  const date = curDate;
  if (date < FD.firstCook) return `<div class="card"><div class="sm mut">Раздел «Еда» работает с ${esc(dshort(FD.firstCook))}.</div></div>`;

  return `${hint}<div class="card"><h2><span>${esc(WDN[parse(date).getDay()])}, ${esc(dlong(date))}</span></h2><div style="margin:-2px 0 4px">${st}</div>${rows}</div>`;
}
function cookNav(cdte, label) {
  return `<div class="row" style="margin:8px 0;flex-wrap:nowrap"><button class="btn sec" data-act="cookmove" data-n="-1" style="flex:0 0 auto" aria-label="Предыдущая готовка">‹</button><div class="sm" style="text-align:center;flex:1"><b>${esc(dayCode(cdte) + ' ' + dshort(cdte))}</b> · ${esc(label)}</div><button class="btn sec" data-act="cookmove" data-n="1" style="flex:0 0 auto" aria-label="Следующая готовка">›</button></div>`;
}
const cookKindName = s => s.kind === 'first' ? 'первая готовка' : s.kind === 'bridge' ? 'мини-готовка' : 'готовка';
function recDetails(key, r, title, extra) {

}
function nextCooksHtml(key) {
  const i = COOKDATES.indexOf(key), nx = COOKDATES.slice(i + 1, i + 4);
  if (!nx.length) return '';
  return `<div class="xs mut" style="margin:2px 2px 8px">Дальше по расписанию: ${nx.map(k => esc(dayCode(k) + ' ' + dshort(k))).join(', ')}. Можно готовить: 2 дня, потом 2 дня нельзя.</div>`;
}
function foodCook() {
  const key = cookOnOrAfter(curDate), s = sessOf(key), st = FS().cook, k0 = key + '|';
  const startStr = st[k0 + 'start'] || s.start, base = toMin(startStr);
  const total = s.timeline.length, done = s.timeline.filter((x, i) => st[k0 + 's' + i]).length;
  const nextIdx = s.timeline.findIndex((x, i) => !st[k0 + 's' + i]);
  const recs = {}; s.recipes.forEach(r => { recs[r.id] = r; });
  const seqNo = {}; s.recipeSeq.forEach((r, i) => { seqNo[r[0]] = i + 1; });
  const tr = FD.trips[key], shopTotal = tr.groups.reduce((n, g) => n + g[1].length, 0) + tr.fresh.length + tr.pantry.length + tr.nonfood.length;
  const shopDone = Object.keys(FS().shop).filter(x => x.indexOf(k0) === 0 && x.indexOf('|s:') < 0).length;
  const pre = s.prep.map((p, i) => { const k = k0 + 'p' + i; return `<div class="tick ${st[k] ? 'on' : ''}" data-act="ctick" data-k="${esc(k)}"><div class="ck">✓</div><div class="tx">${esc(p)}</div>${i === 0 ? `<button class="btn sec sm" data-act="gofood" data-v="shop">Покупки ${shopDone}/${shopTotal}</button>` : ''}</div>`; }).join('');
  const steps = s.timeline.map((x, i) => {

    return `<div class="step ${on ? 'on' : ''} ${nx ? 'next' : ''}"><div class="tick" data-act="ctick" data-k="${esc(k)}"><div class="ck">✓</div><div class="tx"><span class="tm">${hm(base + x[0])}</span><b>${esc(x[1])}</b>${nx ? ' <span class="pill">дальше</span>' : ''}<div class="sm">${esc(x[2])}</div></div></div>${rh ? `<div class="recs">${rh}</div>` : ''}</div>`;
  }).join('');
  const nowBtn = key === today() ? `<button class="btn sec sm" data-act="cnow" data-k="${esc(k0 + 'start')}">Начать сейчас</button>` : '';
  return `${cookNav(key, cookKindName(s))}${nextCooksHtml(key)}
  <div class="card"><h2><span>Перед стартом</span></h2>${pre}</div>
